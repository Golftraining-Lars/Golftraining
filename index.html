<!DOCTYPE html>

     Sie steht weiter unten im nicht-ausfuehrenden Block:  id="devdocs"
     (suche im Quelltext nach:  ===DOC:START=== )
     In der App sichtbar unter:  Mehr -> Daten -> "Entwickler- & KI-Dokumentation".
  2. Sie enthaelt: Architektur, Datenmodell, Persistenz/Sicherung, die unverhandelbaren
     Regeln und den Aenderungs-Leitfaden (wie testen, was nie anfassen).
  3. HALTE DIE DOKU AKTUELL: Wer Datenmodell oder ein Subsystem aendert, aktualisiert
     im selben Schritt den passenden Abschnitt in id="devdocs".

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2b">
<title>Golf Training · Lars</title>
<style>
  :root{
    --bg:#eef2ef; --surface:#ffffff; --surface2:#f6f9f6;
    --ink:#132019; --ink-soft:#4a5b52; --ink-faint:#8a998f;
    --line:#dde5e0; --line-soft:#e9efeb;
    --pine:#1e6f4c; --pine-deep:#0f3d2b; --pine-soft:#e3f0e9;
    --gold:#d99a1c; --gold-soft:#fbf1da;
    --red:#c6402f; --red-soft:#fbe6e2; --amber:#e0a52b;
    --t0:#b9c4bd; --t1:#8fc7a8; --t2:#4fa87b; --t3:#1e6f4c; --t4:#0f3d2b;
    --radius:16px; --radius-sm:11px;
    --shadow:0 1px 2px rgba(19,32,25,.05),0 4px 16px rgba(19,32,25,.06);
    --mono:"SF Mono",ui-monospace,"JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .tnum{font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;font-weight:750;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:16px}

  /* header */
  header{position:sticky;top:0;z-index:20;background:var(--pine-deep);color:#eaf3ee;
    padding:calc(12px + env(safe-area-inset-top)) 18px 14px}
  .h-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .h-name{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#9dc3b1;font-weight:600}
  .h-phase{font-size:12px;color:#bcd8cb;letter-spacing:.02em}
  .sync-pill{border:none;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;line-height:1;white-space:nowrap;font-family:inherit}
  .sync-pill.idle{background:rgba(255,255,255,.14);color:#cfe0d6}
  .sync-pill.ok{background:rgba(126,214,150,.24);color:#cbf5d8}
  .sync-pill.pend{background:rgba(240,205,120,.24);color:#f6e6bc}
  .sync-pill.sync{background:rgba(150,195,240,.26);color:#d5e8ff}
  .sync-pill.warn{background:rgba(240,180,110,.28);color:#ffe4c2}
  .sync-pill.err{background:rgba(240,120,110,.32);color:#ffd6d0}
  .docs{font-size:14px;line-height:1.6;color:var(--ink)}
  .docs h1{font-size:20px;margin:6px 0 10px}
  .docs h2{font-size:16px;margin:18px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
  .docs h3{font-size:14px;margin:12px 0 4px;color:var(--pine-deep)}
  .docs h4{font-size:13px;margin:10px 0 4px;color:var(--ink-soft)}
  .docs p{margin:6px 0}
  .docs ul{margin:6px 0 6px 2px;padding-left:18px}
  .docs li{margin:3px 0}
  .docs code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:6px}
  .docs pre{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font-family:var(--mono);font-size:12px}
  .docs blockquote{margin:8px 0;padding:8px 12px;background:var(--pine-soft);border-left:3px solid var(--pine);border-radius:0 8px 8px 0;font-size:13px}
  .h-hcp{display:flex;align-items:baseline;gap:10px;margin-top:6px}
  .h-hcp .big{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .h-hcp .goal{font-size:13px;color:#9dc3b1}
  .h-bar{margin-top:12px;height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  .h-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f0c65a);border-radius:99px}

  /* layout */
  main{max-width:640px;margin:0 auto;padding:18px 16px 8px}
  .view{display:none}.view.active{display:block;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:700;margin:26px 0 12px}
  .eyebrow:first-child{margin-top:4px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .pad{padding:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .kpi{padding:15px 16px}
  .kpi .lab{font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.01em;
    display:flex;align-items:center;gap:6px}
  .kpi .val{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1}
  .kpi .val small{font-size:14px;color:var(--ink-faint);font-weight:500}
  .kpi .sub{font-size:12px;color:var(--ink-faint);margin-top:5px}
  .trend{font-size:12px;font-weight:700}
  .up{color:var(--pine)}.down{color:var(--red)}.flat{color:var(--ink-faint)}

  /* benchmark ladder */
  .ladder{margin-top:9px}
  .ladder-track{position:relative;height:9px;border-radius:99px;
    background:linear-gradient(90deg,var(--t0),var(--t1),var(--t2),var(--t3),var(--t4))}
  .ladder-gate{position:absolute;top:-3px;width:1.5px;height:15px;background:rgba(19,32,25,.22)}
  .ladder-mark{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
    background:#fff;border:3px solid var(--ink);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .5s cubic-bezier(.4,1.2,.5,1)}
  .ladder-scale{display:flex;justify-content:space-between;margin-top:5px;
    font-size:10px;color:var(--ink-faint);font-weight:600;letter-spacing:.02em}

  .lvl-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    padding:3px 9px;border-radius:99px;letter-spacing:.01em}

  /* list rows */
  .row{display:flex;align-items:center;gap:13px;padding:14px 16px;border-top:1px solid var(--line-soft);cursor:pointer}
  .row:first-child{border-top:none}
  .row:active{background:var(--surface2)}
  .row .ico{width:34px;height:34px;border-radius:10px;background:var(--pine-soft);color:var(--pine-deep);
    display:grid;place-items:center;font-size:17px;flex:none}
  .row .grow{flex:1;min-width:0}
  .row .r-t{font-weight:650;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .r-s{font-size:12px;color:var(--ink-faint);margin-top:2px}
  .row .r-v{font-family:var(--mono);font-weight:600;font-size:16px;text-align:right}
  .row .chev{color:var(--ink-faint);font-size:18px;flex:none}

  .cat-h{font-size:13px;font-weight:750;letter-spacing:.01em;color:var(--pine-deep);
    padding:13px 16px 9px;display:flex;align-items:center;gap:8px}
  .cat-h .dot{width:8px;height:8px;border-radius:50%;background:var(--pine)}

  /* focus cards */
  .focus{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line-soft)}
  .focus:first-child{border-top:none}
  .focus .rank{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--gold);width:20px}
  .focus .grow{flex:1;min-width:0}
  .focus .f-t{font-weight:650;font-size:14px}
  .focus .f-s{font-size:11.5px;color:var(--ink-faint);margin-top:2px}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--pine);color:#fff;font-weight:650;font-size:15px;
    padding:13px 18px;border-radius:13px;width:100%;letter-spacing:.01em;transition:transform .06s}
  .btn:active{transform:scale(.985)}
  .btn.sec{background:var(--surface);color:var(--pine-deep);border:1.5px solid var(--line)}
  .btn.ghost{background:var(--surface2);color:var(--ink-soft);border:1px solid var(--line)}
  .btn.warn{background:var(--red-soft);color:var(--red);border:1px solid #f0cdc6}
  .btn.gold{background:var(--gold);color:#3a2905}

  /* forms & sheet */
  .backdrop{position:fixed;inset:0;background:rgba(15,25,20,.42);z-index:40;opacity:0;
    pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
  .backdrop.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
    border-radius:22px 22px 0 0;max-width:640px;margin:0 auto;max-height:92vh;overflow-y:auto;
    transform:translateY(102%);transition:transform .32s cubic-bezier(.3,.9,.3,1);
    padding:8px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet.open{transform:translateY(0)}
  .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 4px}
  .sheet-x-bar{position:sticky;top:0;z-index:6;display:flex;justify-content:flex-end;margin:-8px -18px 0;padding:8px 14px 6px;background:linear-gradient(var(--surface),var(--surface) 62%,rgba(255,255,255,0))}
  .sheet-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--ink-soft);font-size:16px;font-weight:700;cursor:pointer;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .sheet-x:active{background:var(--line-soft)}
  .sheet h2{font-size:20px;margin:2px 2px 4px}
  .sheet .sub{font-size:13px;color:var(--ink-faint);margin:0 2px 16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.01em}
  .field input,.field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);
    border-radius:11px;background:var(--surface2);color:var(--ink);outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus{border-color:var(--pine)}
  .field.num input{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .in-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
  .in-grid .field{margin:0}
  .live{display:flex;align-items:center;justify-content:space-between;background:var(--pine-soft);
    border-radius:13px;padding:13px 16px;margin:6px 0 16px}
  .live .lv-l{font-size:12px;color:var(--pine-deep);font-weight:650}
  .live .lv-n{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--pine-deep);letter-spacing:-.02em}

  /* charts */
  .chart{width:100%;height:auto;display:block;overflow:visible}
  .spark{width:100%;height:34px;display:block}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:10px;height:3px;border-radius:2px;display:inline-block}

  .empty{text-align:center;color:var(--ink-faint);padding:34px 20px;font-size:14px}
  .empty .big{font-size:32px;margin-bottom:8px}

  .hist-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line-soft);font-size:13.5px}
  .hist-row:first-child{border-top:none}
  .hist-row .d{color:var(--ink-faint);font-size:12px;font-family:var(--mono);width:64px;flex:none}
  .hist-row .v{font-family:var(--mono);font-weight:600;margin-left:auto}
  .del{color:var(--red);font-size:12px;font-weight:650;padding:4px 8px}

  .note{font-size:12px;color:var(--ink-faint);line-height:1.5;margin-top:10px}
  .save-badge{display:inline-block;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:700}
  .save-badge.ok{background:var(--pine-soft);color:var(--pine-deep)}
  .save-badge.warn{background:var(--gold-soft);color:#8a5a00}
  .lm-pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;min-width:30px;text-align:center}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .grid3 .kpi{padding:10px 6px;text-align:center}
  .grid3 .kpi .lab{font-size:10.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .grid3 .kpi .val{font-size:19px;font-weight:800;font-family:var(--mono);margin-top:2px}
  .grid3 .kpi .sub{font-size:10px;color:var(--ink-faint)}
  .lm-rec{border-radius:12px;padding:11px 13px;margin-bottom:9px;border:1px solid var(--line);border-left-width:4px;background:var(--surface)}
  .lm-rec.r{border-left-color:var(--red);background:var(--red-soft)}
  .lm-rec.y{border-left-color:var(--gold);background:var(--gold-soft)}
  .lm-rec.g{border-left-color:var(--pine);background:var(--pine-soft)}
  .lm-rt{font-weight:750;font-size:14px;line-height:1.35}
  .lm-badge{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.06);margin-right:5px;vertical-align:middle}
  .lm-rd{font-size:13px;color:var(--ink);line-height:1.5;margin-top:5px}
  .lm-drill{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
  .descbox{margin:12px 0 2px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);overflow:hidden}
  .descbox summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;font-size:13px;font-weight:650;color:var(--pine-deep)}
  .descbox summary::-webkit-details-marker{display:none}
  .descbox .chev-d{transition:transform .2s;color:var(--ink-faint)}
  .descbox[open] .chev-d{transform:rotate(180deg)}
  .descbox .desc-body{padding:2px 15px 15px;font-size:13px;line-height:1.6;color:var(--ink-soft);
    border-top:1px solid var(--line-soft);white-space:normal}
  .descbox[open] summary{border-bottom:0}
  .stat-line{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line-soft);font-size:14px}
  .stat-line:first-child{border-top:none}
  .stat-line b{font-family:var(--mono);font-weight:600}

  /* bottom nav */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.94);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;max-width:640px;margin:0 auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 2px;color:var(--ink-faint);font-size:10.5px;font-weight:650;letter-spacing:.01em;border-radius:12px;white-space:nowrap}
  nav button .ni{font-size:20px;line-height:1}
  #subnav{position:sticky;top:0;z-index:20;display:none;gap:6px;padding:9px 14px;background:var(--bg);
    border-bottom:1px solid var(--line);overflow-x:auto;max-width:760px;margin:0 auto}
  #subnav button{flex:0 0 auto;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:650;
    color:var(--ink-soft);background:var(--surface2);border:1px solid var(--line)}
  #subnav button.on{background:var(--pine);color:#fff;border-color:var(--pine)}
  nav button.on{color:var(--pine)}
  nav button.on .ni{transform:translateY(-1px)}

  .toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
    z-index:60;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;
    width:56px;height:56px;border-radius:50%;background:var(--pine);color:#fff;font-size:28px;
    display:grid;place-items:center;box-shadow:0 6px 20px rgba(30,111,76,.4)}
  .fab:active{transform:scale(.94)}
  /* Schläger-Empfehlung je Loch */
  .club-tip{font-size:12px;color:var(--pine-deep);background:var(--pine-soft);border-radius:9px;
    padding:6px 10px;margin:-2px 0 9px;line-height:1.5}
  .club-tip .ct-arrow{color:var(--pine);opacity:.65;font-weight:700;padding:0 1px}
  /* Pinnwand */
  .pin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .pin-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:13px 12px 11px;box-shadow:var(--shadow)}
  .pin-card.pinned{background:var(--gold-soft);border-color:#eaddb4}
  .pin-card .pc-cat{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint)}
  .pin-card .pc-title{font-weight:700;font-size:14px;margin:3px 0 5px;color:var(--ink);line-height:1.3;padding-right:20px}
  .pin-card .pc-body{font-size:12.5px;line-height:1.5;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word}
  .pin-card .pc-meta{margin-top:10px;padding-top:8px;border-top:1px solid var(--line-soft);
    display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--ink-faint)}
  .pin-card .pc-meta a{color:var(--pine);font-weight:600;cursor:pointer}
  .pin-card .pc-meta a.del{color:var(--red)}
  .pin-card .pc-pin{position:absolute;top:9px;right:9px;font-size:17px;cursor:pointer;line-height:1;
    filter:grayscale(1);opacity:.4;transition:all .15s}
  .pin-card.pinned .pc-pin{filter:none;opacity:1}
  .pin-card .pc-accent{position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:99px}
  /* Schlag-GPS */
  .gps-live{background:var(--pine-deep);color:#fff;border-radius:18px;padding:20px 18px;text-align:center;position:relative;overflow:hidden}
  .gps-live .gl-cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;font-weight:700}
  .gps-live .gl-dist{font-family:var(--mono);font-size:58px;font-weight:700;line-height:1.02;margin:2px 0 0}
  .gps-live .gl-dist small{font-size:22px;opacity:.6;font-weight:600;margin-left:4px}
  .gps-live .gl-sub{font-size:12.5px;opacity:.8;margin-top:4px;min-height:16px}
  .gps-acc{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
    padding:4px 10px;border-radius:99px;margin-top:10px}
  .gps-acc.good{background:rgba(120,220,160,.22);color:#bff0d0}
  .gps-acc.mid{background:rgba(230,190,90,.22);color:#f4dfa6}
  .gps-acc.bad{background:rgba(230,120,100,.22);color:#f6c6bd}
  .gps-acc .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
  .gps-btn{width:100%;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:700;cursor:pointer}
  .gps-btn.a{background:var(--pine);color:#fff}
  .gps-btn.b{background:var(--gold);color:#3a2a05}
  .gps-btn:disabled{opacity:.4}
  .gps-btn.ghost{background:var(--surface2);color:var(--ink-soft);border:1px solid var(--line);font-weight:600;font-size:13px;padding:11px}
  .shot-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
  .shot-row .sr-club{flex:1;font-weight:600}
  .shot-row .sr-d{font-family:var(--mono);font-weight:700}
  .shot-row .sr-acc{font-size:11px;color:var(--ink-faint)}

# Entwickler- & KI-Dokumentation — Golf Training PWA

> **Verbindliche Arbeitsgrundlage.** Bei jeder Code-Aenderung ZUERST lesen, DANACH den
> passenden Abschnitt aktualisieren. Diese Doku ist Teil des Programms (Block `id="devdocs"`).
> In der App sichtbar: Mehr → Daten → „Entwickler- & KI-Dokumentation".

## 0. Fuer die KI: Arbeitsweise an dieser Datei (zuerst lesen)
- **Single-File-PWA:** die gesamte App ist eine `index.html` (HTML + CSS + genau ein grosser
  Haupt-Script-Block). Kein Build, kein Framework, reines Vanilla-JavaScript.
- **Sprache:** UI und Antworten auf Deutsch, knapp. Ehrlich unterscheiden zwischen „getestet"
  und „nur am Geraet pruefbar" (GPS, Touch, echtes Cloud-Verhalten).
- **Vorgehen bei Aenderungen:** betroffene Funktion per Suche (`grep`) / Ansicht finden,
  gezielt aendern, nichts Bestehendes brechen (alte Datenstaende muessen weiter laden).
- **Validieren (Pflicht):** den Inhalt des Haupt-Script-Blocks in eine Datei extrahieren und
  `node --check` laufen lassen. Fuer reine Logik zusaetzlich kleine Node-Harness-Tests: die
  betroffene Funktion per Klammer-Matching aus der Datei ziehen, Helfer wie `haversine`,
  `esc`, `DB` stubben, Ein-/Ausgaben pruefen.
- **Abschluss:** `index.html` nach `/mnt/user-data/outputs` kopieren und mit `present_files`
  zeigen. Danach diese Doku aktualisieren.

## 1. Unverhandelbare Regeln (nie verletzen)
1. **Datensicherungs-Guards in `cloudSave` bleiben erhalten:** Empty-Guard (fast leeren Stand
   nie ins Repo schreiben) und „Repo-hat-mehr"-Guard (groesseren/neueren Repo-Stand nicht
   ueberschreiben). Sie verhindern den frueheren Datenverlust.
2. **Nie** den gesamten Datenbestand ungeprueft ueberschreiben.
3. **`persist()`** nach jeder datenveraendernden Aktion aufrufen (schreibt lokal, legt Backup
   an, plant Cloud-Sync). Nicht direkt und ausschliesslich in localStorage schreiben.
4. **Fakten additiv behandeln.** Notizen werden in den **Papierkorb** verschoben
   (90-Tage-Auto-Loeschung), nicht hart geloescht.
5. **Abwaertskompatibel bleiben:** neue Felder additiv, `ensureDefaults()` fuellt Fehlendes,
   alte gespeicherte Staende muessen ohne Fehler laden.
6. **Diese Doku pflegen** (Abschnitt 8).

## 2. Architektur-Ueberblick
- **`DB`** — ein zentrales JS-Objekt, das ALLE Daten haelt (siehe Abschnitt 3).
- **Persistenz:** IndexedDB als durable Speicher (`saveLocal` / `persist` / `idbHydrate`),
  localStorage nur als synchroner Notnagel; automatische Backups (`snapshot` / `_backups`);
  optionale Cloud-Sicherung ueber einen Worker in die Repo-Datei `trainingsdaten.json`
  (`cloudSave`), Laden beim Start (`cloudLoad`). Siehe Abschnitt 4.
- **UI-Geruest:** `header` (HCP-Fortschritt, Sync-Pill), `#subnav`, `main` mit je einer
  `section#v-<view>` pro Ansicht, untere Navigation (`GROUPS`), Floating-Action-Button (`#fab`),
  Sheet-System (`openSheet` / `closeSheet`, `#sheetBody`, dauerhafter Schliessen-Button).
- **Rendering:** pro Ansicht eine `render<Name>()`-Funktion. `renderAll()` ruft alle auf.
  Navigation: `setView(v)` schaltet die aktive Section, `setGroup(g)` die untere Nav.
- **Views:** heute, dash, korrelation, records, tests, rounds, comp, places, launch, gps,
  fitness, planung, notes, bag, data.

## 3. Datenmodell (`DB`)
Wichtigste Felder:
- `rounds[]` — Runden. Hole-Objekte: `{hole, par, si, len, score, putts, tee, penN, girDirect,
  shots?, ...}`. `shots[]` = aufgezeichnete Ballpositionen `{lat,lng,club}` (n Positionen =
  n-1 Schlaege).
- `competitions[]` — Turniere: `date, course, tournament, cr, tees, slope, holes(18/9),
  format, hcpStart, hcpAfter, courseHcp, par, gbe, deltaPar, stbGross, stbNet, sd, gir, fir, putts`.
- `tests[]`, `testDefs[]` — Test-Ergebnisse und -Definitionen.
- `courses[]` — Plaetze inkl. Tees und optional `.geo` (siehe unten).
- `fitnessSessions[]`, `playedCourses[]`, `phases[]`, `lmSessions[]` (Launch-Monitor),
  `clubDistances[]` (Schlagweiten), `profile{}` (HCP-Index, Ziele, Name),
  `pins{}` (tagesgenaue Fahnenposition je „Platz|Loch"), `notes[]`, `notesTrash[]`,
  `_draftRound` (laufender Runden-Entwurf).
- `course.geo` — aus OSM/GeoJSON: `{features[], holes{n:{tee,green,line,distM}}, mine[]
  (eigene Punkte/Flaechen/Linien), overrides{holes:{n:{green}}}, center, bbox, stats}`.

## 4. Persistenz & Datensicherung (kritisch)
- **`persist()`** → `saveLocal()` (IndexedDB durable + best-effort localStorage) + `markDirty()`
  + `snapshot("Auto")` + `scheduleCloudSync()`.
- **`saveLocal(db)`** schreibt nach IndexedDB (`golftraining` → Store `kv` → Key `golfdb`) und
  versucht zusaetzlich localStorage (darf bei grossen Staenden fehlschlagen).
- **Start:** `load()` liest synchron localStorage (schneller Pfad) → `renderAll()` →
  `idbHydrate()` laedt den vollen IndexedDB-Stand nach (falls groesser/neuer) → `cloudLoad()`.
- **Backups:** `snapshot()` haelt die letzten ~10 Staende in `_backups` (In-Memory) + IndexedDB;
  Wiederherstellung ueber `getBackups()` / `restoreBackup()` (UI: Mehr → Daten).
- **Cloud:** `cloudSave(silent,force)` mit den Guards aus Regel 1; `cloudLoad()` /
  `cloudLoadManual()` zum Laden aus dem Repo. Status jederzeit sichtbar in der **Sync-Pill**
  (Kopfzeile): idle/pending/syncing/ok/offline/error/blocked (`setSync` / `updateSyncPill`).
- **Speicher-Gesundheit:** Mehr → Daten zeigt Belegung via `navigator.storage.estimate()`.

## 5. Subsysteme
- **Scoring:** `computeRound(rd)` (Par/SI kommen aus dem Course-Tee).
- **WHS-Handicap:** Best-8-of-20-Logik (`whsPool` / `WHS_TABLE`).
- **Caddy:** `caddyPositionPlan(inp)` (Positions-Caddy: Wasser/Penalty carry, OB „nie darueber",
  Bunker als Lande-Gefahr, seitliche OB/Penalty-Warnung), `caddyContext`, `caddyMode`,
  `clubList`. Tee-Caddy: `caddyPlan`.
- **Geo/Karten:** `courseSVG(geo,opt)` rendert Loch/Platz als SVG (Flaechen, Loch-Linien,
  Gruens, eigene Punkte/Flaechen/Linien, Schlag-Flugbahnen, Position). Projektion via
  `_fitProject` / `geoProject`; Distanzen `geoDist` (nutzt `haversine`). Editor mit Pinch-Zoom
  (`GEOED`, `geoEd*`). Gefahren auf der Linie: `hazardsOnLine`, seitlich: `lateralHazards`.
  Front/Mitte/Back: `greenFMB`; Fahne/Pin: `greenAxisEdges` + `pinPoint`.
- **Spielmodus (On-Course):** State `PLAY`, `renderPlay()` (grosses Loch, Live-F/M/B-Distanzen,
  Fahnen-Steuerung, Caddy-Zeile, Score/Putts-Stepper, GIR, „Schlaege tracken", naechstes Loch),
  GPS-Loch-Erkennung (`nearestHole`), Live-Tracking (`liveStart`/`liveStop`, `LIVEPOS`).
  Speichert als normale Runde (`playRound` → `DB.rounds`, Entwurf via `saveDraft`).
- **Schlag-Tracking:** `RTRACK` (je Loch Positionen), `renderShotTrack` (GPS/manuell antippen,
  ziehen, Zoom), Flugbahn-Darstellung in `courseSVG` (`opt.shots`). Zaehlung: `shotCount`.
- **Notizen:** `renderNotes`, Papierkorb (`ensureNotes`, `trashNote`, `restoreNote`,
  `purgeNote`, 90-Tage-Purge).
- **Turniere:** `openAddComp(existing?)` (Anlegen/Bearbeiten mit allen Feldern), `openComp`.

## 6. Konventionen & Helfer
- Kurz-Helfer: `$()` (querySelector), `esc()` (HTML-escape — bei jedem eingesetzten String),
  `toast()`, `num()`, `fmtDate()`, `miniStat()`, `_short()`/`clubShort()`.
- Formatierung sparsam; Zahlen mit `.tnum`/`var(--mono)`. Farben/Abstaende ueber CSS-Variablen.
- Sheets immer via `openSheet(html)`; Schliessen via `closeSheet()` (stoppt auch Live-GPS).

## 7. Test-/Validierungs-Workflow (bewaehrt)
1. Haupt-Script-Inhalt extrahieren → `node --check` (Syntax). **Achtung:** die Datei enthaelt
   zwei Script-Elemente — den Doku-Block (`type="text/markdown"`, `id="devdocs"`) und den echten
   Haupt-Block (attributlos, am Dateiende). Fuer die Pruefung den **attributlosen** Block bzw.
   das **letzte** schliessende Script-Tag verwenden, sonst prueft man versehentlich einen leeren
   Bereich.
2. Reine Logik: Funktion per Klammer-Matching ziehen, Stubs setzen, Ein-/Ausgaben pruefen
   (z. B. Caddy-Entscheidungen, Geo-Distanzen, Guard-Faelle, F/M/B, Pin-Tiefe).
3. Integritaet: pruefen, dass keine verwaisten IDs/Referenzen zurueckbleiben.
4. Kopieren nach outputs, `present_files`, kurze ehrliche Zusammenfassung.

## 8. Diese Doku pflegen

  Dateien auslagern, um Drift zu vermeiden).
- Wer Datenmodell (Abschnitt 3), Persistenz (4) oder ein Subsystem (5) aendert, aktualisiert

- **Changelog-Pflicht:** Bei jeder inhaltlichen Aenderung einen datierten Eintrag im Abschnitt
  „Changelog" (am Ende) ergaenzen — neueste zuerst.

## 9. App-Aufbau im Detail
**Boot-Reihenfolge** (Ende des Haupt-Blocks): `DB` aus `load()` (localStorage, sonst SEED) →
`snapshot("Start",true)` → `renderAll()` → `setView("heute")` → `idbHydrate().then(cloudLoad)`.
`ensureDefaults()` (in `renderAll`) fuellt fehlende Felder und vergibt IDs.

**DOM-Geruest:** `header` (Name, Sync-Pill, Phase, HCP-Balken) · `#subnav` (Tabs innerhalb einer
Gruppe) · `main` mit je einer `section#v-<view>` pro Ansicht · untere `nav` (Gruppen) · `#fab`
(Floating Button) · Sheet: `#backdrop` + `#sheet` mit `#sheetBody`, dauerhaftem `#sheetClose` (✕).

**Navigation:** `GROUPS` definiert Gruppen→Views (heute · runden · turnier · training[tests,
fitness,launch,gps] · analyse[dash,records,korrelation] · mehr[places,planung,notes,bag,data]).
`VIEW_GROUP` mappt View→Gruppe. `setView(v)` setzt `current`, zeigt `#v-<v>`, baut `#subnav`
(nur sichtbar, wenn die Gruppe mehrere Views hat). `setGroup(g)` springt zur zuletzt genutzten
View der Gruppe (`groupLast`).

**FAB:** `FAB_ACTION={rounds:startRound, comp:openAddComp, notes:openAddNote}` — Aktion haengt an
`current`; ist keine gesetzt, passiert nichts.

**Rendering-Modell:** kein Framework/Virtual-DOM. Jede `render<View>()` baut einen HTML-String und
setzt `#v-<view>.innerHTML`; interaktive Elemente werden **danach** per `onclick` verdrahtet. Nach
Datenaenderung: `persist()` und die betroffene(n) `render*()` (oder `renderAll()`).

**Sheet-System:** `openSheet(html)` fuellt `#sheetBody` und oeffnet; Sheets **ersetzen** sich
(kein Stack). `closeSheet()` schliesst und ruft `liveStop()` + setzt
`MAPST.live/CADDYPOS.live/PLAY.live=false`. „Zurueck" aus einem Sheet = die vorige Ansicht bewusst
neu rendern (Zustand vorher sichern).

## 10. Geo & Karten im Detail
**Koordinaten-Konvention:** ueberall `[lat, lng]`-Arrays. `geoDist(a,b)`→Meter (Haversine).
`geoProject(lat,lng,refLat,refLng)`→`{x:Ost, y:Nord}` in Metern relativ zum Referenzpunkt.

**Import-Pipeline:** `renderGeoImport` (Overpass-Fetch oder GeoJSON) → `parseGeoJSONCourse` /
`parseOverpassCourse` → `finalizeGeo(feats,src)` (filtert weit entferntes Wasser, setzt
`geo={src,center,bbox,coreBBox,features,holes,mine:[],overrides,stats}`) → `buildHoleGeo`
(`holes[n]={tee,green,line,distM}`) → `applyGeoOverrides` (korrigierte Gruens).

**geo-Struktur:** `features[]`=`{kind, ring|line|pt}`, kinds green/bunker/fairway/rough/tee/water/
penalty/ob/hole/pin sowie Vegetation **wood/scrub/highrough** (Flaeche), **tree** (Punkt),
**hedge/treerow** (Linie) und weitere Import-Objekte **building/parking** (Flaeche), **path** (Linie)
und **other** (generischer Auffang — es wird nichts mehr verworfen). `holes{n}` s. o.
`mine[]`=eigene Objekte `{kind, ring|line|pt, label}` (auch tree/wood/hedge/highrough).
`overrides.holes[n].green`=korrigierte Grünmitte.

**`courseSVG(geo, opt)`** rendert Loch/Platz als SVG. `opt`-Flags: `w` · `hole` (auf Loch zoomen) ·
`edit` (Editor-Marker als zieh-/loeschbare Gruppen) · `editShots` (ziehbare Schlagpunkte) ·
`shots` (`[[lat,lng]]` → Flugbahn-Boegen + Distanz-Labels) · `here` (Marker `id="hereDot"`) ·
`rings` (Distanz-Ringe 50–250 m um `here`, Entfernungsmesser-Overlay) ·
`draftRing`/`draftOpen` (Zeichen-Vorschau). **Rueckgabe:** `{svg, H, M}` mit `M.map(lat,lng)→[x,y]`
in viewBox-Einheiten (`M.s` = Einheiten je Meter). Ruecktransformation: `geoEdVB` + `llFromVB`.

**Editor (`GEOED`):** Werkzeuge add/green/**tree**/area/line/del (Fläche auch als **Hohes Rough**
oder **Wald**, Linie auch als **Hecke**); **Pinch-Zoom + Zwei-Finger-Pan** (`GEOED.view/ptrs/pinch`)
und ±/⟳-Buttons; Marker/Flaechen/Linien per Finger ziehen. `GEOED.M` haelt die Projektion.
Overpass-Import holt neben Golf auch wood/forest/tree/tree_row/scrub/hedge; GeoJSON-Import behaelt
zusaetzlich Gebaeude/Wege/Parkplaetze/„other" (nichts wird verworfen).

**Gefahren & Distanzen:** `hazardsOnLine(here,green,feats,kinds)` (Ring- + Linien-Kreuzungen via
`segIntersect`). `lateralHazards` (seitliche OB/Penalty). `greenFMB(here,n)` = Front/Mitte/Back.
`greenDims(geo,n)` = Grün-**Tiefe** (entlang Spiellinie) × **Breite** (senkrecht). `greenAxisEdges`
+ `pinPoint(geo,n,d)` = tagesgenaue Fahne entlang Tee→Grün (`d`=Tiefe 0..1). `greenRingFor(geo,n)`
waehlt die Grünfläche (erst `pointInRing`, sonst nächste <30 m).

## 11. Caddy & Spielmodus im Detail
**Schlaeger:** `clubList()`→`[{name,carry,total,reach}]`; `clubSigma` schaetzt Streuung.
`caddyMode()/setCaddyMode()`→`safe|bal|aggr`.

**`caddyPositionPlan(inp)`** mit `inp={remaining,par,lie,mode,ctx,hazards}` →
`{shots:[{tone,role,club,dist,why}], tags(Set), alt, expect{n,l,chance}, headline,
carryNote{near,far,kind|ob}}`. Logik: **OB/building** = „nie darueber" (erzwungener Layup davor);
**water/penalty/wood** = je Modus tragen oder ablegen; **Bunker** = Lande-Gefahr meiden; **tree** =
Warn-Tag. `lieAt(geo,here)` erkennt die Lage automatisch (Bunker/Wald→recovery/**highrough**/
Fairway/Rough); Lie-Faktoren `LIE_F` (fairway 1.0 · rough 0.9 · highrough 0.78 · bunker 0.72 ·
recovery 0.58). Distanz-Ringe global abschaltbar (`ringsOn()`/`toggleRings`, `DB.ui.rings`) — aktiv in
Karte, Karten-Caddy und Spielmodus. Gefahren aus der Karte via
`hazardsOnLine(...,["water","penalty","ob","bunker","wood","tree","building"])` (Ringe, Linien UND Baum-Punkte,
inkl. `geo.mine`). Die manuelle Maske „Hinweise je Loch" (`course.trouble[n]`) ergaenzt den Caddy
nur um das, was die Karte nicht weiss: `tip` (Freitext) + `favor` (bevorzugte Seite) via
`manualTipHtml()` — konkrete Wasser/Bunker/OB werden NICHT doppelt eingetragen. Tee-Caddy: `caddyPlan`.

**Wetter (Open-Meteo, kein API-Key):** `fetchWeather/ensureWeather(lat,lng)` → `WEATHER
{temp,windMs,windDir,gustMs,at}` (Cache 20 min). Physik: `bearingDeg`, `windRel(ms,dir,bearing)`
→{head(+Rücken/−Gegen),crossMag,crossFrom}, `tempFactor` (~0,22 %/°C rel. 20 °C), `playsLike(dist,
temp,ms,dir,bearing)`. Der Positions-Caddy bekommt `inp.plays` (= „spielt wie"-Distanz) für die
Schlägerwahl; `weatherEffectHtml(bearing,dist)` zeigt Temp/Wind + Effekt. Anzeige: Heute-Wetterkarte
(auto via Geolocation), Spielmodus/Karten-Caddy (Live-Fetch). Gespeichert je Runde in
`round.conditions{temp,windMs,windDir}` + `round.weather`.

**Spielmodus (`PLAY`):** Felder `course,tee,side,type,roundId,date,hi,holes[],idx,here,live,auto,
greenRing,startTime,endTime`. `renderPlay()`=Schale; `playInfoHtml()`=**dynamischer** Teil (F/M/B
bzw. Fahne + Caddy), der bei Live-Ticks nur in `#playInfo` neu gesetzt wird (Stepper bleiben ruhig).
`playToggleLive` nutzt `liveStart/liveStop`, throttlet >2 m, wechselt das Loch automatisch nur, wenn
das aktuelle noch keinen Score hat. `playAdj` (erster Score-Tipp=Par), `playGir`, `playPrev/Next/
GoHole`, `playShots`→`renderShotTrack`, `playFinish`→`DB.rounds`, `playSaveDraft` (Entwurf+Cloud).
Fahne: `DB.pins["<course>|<hole>"]={d,date}` → `pinPoint`; Caddy rechnet dann mit Fahnendistanz.

**Schlag-Tracking:** `RTRACK` je Loch; **`shotCount(sh)=Positionen-1`** (zwei Punkte = ein Schlag).
`renderShotTrack(n,reopen,courseName)` interaktiv (GPS/antippen/ziehen/Zoom). Flugbahn+Labels via
`courseSVG opt.shots`. Schlaege haengen an `hole.shots`; Langzeit-Ansicht `openRoundShots`.

## 12. Aenderungs-Leitfaden / Rezepte (fuer die KI)
- **Feld zu Runde/Loch:** Eingabe in `openAddRound`/`buildHoles`, Auslesen in `collect()`, Anzeige
  in `openRound`, ggf. `computeRound`, Default in `ensureDefaults`.
- **Neue Ansicht/Tab:** `section#v-<x>` in `main`, `render<X>()` in `renderAll`, Eintrag in `GROUPS`,
  ggf. `FAB_ACTION`.
- **Neues Sheet/Modal:** HTML-String → `openSheet(html)` → Buttons verdrahten; Schliessen via
  `closeSheet()`.
- **Neue Geo-Gefahr/Feature:** `kind` in `classifyProps`/`GEO_STYLE`, Editor-Werkzeug + Abschluss,
  Rendering in `courseSVG`, bei Bedarf `hazardsOnLine`/`lateralHazards` + Caddy.
- **Caddy-Regel:** `caddyPositionPlan` bzw. `caddyPlan`; mit Node-Harness testen.
- **Datenmodell sicher erweitern:** additive Felder; `ensureDefaults()` fuellt Fehlendes; alte
  Staende muessen laden; **kein** Hard-Delete.

**Fallstricke (gelernt):**
- Jeden eingesetzten String mit **`esc()`** kapseln.
- Koordinaten immer **`[lat, lng]`**.
- **`activeHoles()` liefert Referenzen** auf Course-Loecher → beim Uebernehmen klonen (`{...h}`).
- Nach jeder Datenaenderung **`persist()`**.
- **Zwei Script-Bloecke** → Syntaxpruefung auf den attributlosen Haupt-Block / das letzte
  schliessende Script-Tag.
- **Live-GPS-Callbacks** pruefen, ob ihre Ansicht noch existiert (Element-ID), sonst `liveStop()`.
- Sheets **ersetzen** sich; „zurueck" = bewusstes Neu-Rendern mit gesichertem Zustand.

## 13. Glossar & Einheiten
- **HCP-Index** · **Course-HCP** · **GBE** (Brutto gesamt) · **SD** (Score-Differential) ·
  **Stableford brutto/netto** · **GIR** (Gruen in Regulation) · **FIR** (Fairway) · **SI/Loch-HCP**
  (Stroke Index) · **WHS** (Best 8 of 20) · **Carry/Total/Reach** · **F/M/B** (Front/Mitte/Back) ·
  **Pin-Tiefe** (`d`=0 vordere .. 1 hintere Grünkante).
- **Einheiten:** Distanzen in **Metern**, Positionen in **Grad** (`lat`,`lng`).

## 14. Versions- & Migrationskonzept
- **Datenversion:** `SEED.version` (aktuell 12). `load()` und `idbHydrate()` übernehmen gespeicherte
  Daten nur, wenn `version===SEED.version` — sonst wird der eingebettete `SEED` genutzt.
- **⚠️ Folge:** Ein Erhöhen von `SEED.version` **verwirft den gespeicherten Stand** und ersetzt ihn
  durch SEED. Daher gilt:
- **Migration = additiv + `ensureDefaults()`.** Neue Felder immer additiv; `ensureDefaults()` füllt
  Fehlendes beim Laden. **Solche Änderungen die Version NICHT erhöhen** (sonst Datenverlust).
- **Version nur erhöhen** bei bewusstem Reseed des eingebetteten Datensatzes; der neue SEED muss dann
  alle aktuellen Daten enthalten, der Live-Stand kommt via Repo/Cloud (`cloudLoad`) zurück. Vorher
  Export/Backup sicherstellen.
- **Faustregel:** Feature/Code → additiv, kein Bump. Strukturelle Datenänderung → Transform in
  `ensureDefaults` + Fixture/Test.

## 15. Trennung Daten ↔ Berechnung
- **Daten** leben ausschließlich in `DB` (persistiert). **Berechnungen** sind reine Funktionen ohne
  Seiteneffekte (`computeRound`, `caddy*`, `geo*`, WHS, `playsLike`, `greenDims`) — nur Eingabe→Ausgabe,
  kein DB-Schreiben, kein DOM.
- **Rendering** liest `DB` + reine Funktionen und erzeugt HTML; es verändert keine Daten.
- **Regel:** Neue Logik als reine Funktion (per Node-Harness testbar). Persistenz nur über `persist()`.
  Ableitbare Werte nicht zusätzlich speichern (Single Source of Truth = `DB`).

## 16. Datenintegrität
- Lade-Validierung (`load`: `testDefs`/`rounds` sind Arrays + Version passt).
- `ensureDefaults()` ergänzt/repariert fehlende Felder & IDs.
- `cloudSave`-Guards (Empty-Guard, Repo-hat-mehr) verhindern Überschreiben mit weniger.
- **Kein Hard-Delete** (Papierkorb/Tombstone). `persist()` legt bei jeder Änderung ein Backup an.
- Referenzen tolerant behandeln (Runde→Platz per Name; fehlt der Platz → „–", nie crashen).

## 17. Synchronisationsstrategie & Konfliktlösung
- **Local-first:** `DB` durable in IndexedDB + localStorage-Notnagel. Optionaler Cloud-Sync in die
  Repo-Datei `trainingsdaten.json` über einen Worker (`cloudSave`); Laden `cloudLoad`/`cloudLoadManual`.
- **Wann:** `scheduleCloudSync()` (debounced) nach Änderungen; im Spielmodus zusätzlich je Loch.
- **Konflikterkennung:** `dataScore(DB)` (gewichtete Datenmenge) + `exportedAt` (Zeitstempel).
- **Konfliktlösung (bewusst konservativ, kein Auto-Merge):**
  - Repo deutlich größer (`repoScore>locScore+3`) oder größer **und** neuer → **nicht** automatisch
    überschreiben; Status `blocked`, Hinweis „erst ☁ Aus Repo laden".
  - Fast leerer lokaler Stand (`dataScore<5`) → nie ins Repo (Empty-Guard).
  - Manuelles Speichern fragt bei Konflikt per `confirm()`.
  - **Prinzip:** Der vollständigere Stand gewinnt bewusst; Datenverlust-Vermeidung vor Vollautomatik.
    Im Zweifel entscheidet der Nutzer über Laden/Speichern.
- **Ausfall:** Repo/Worker nicht erreichbar → lokaler Betrieb unverändert, Nachhol-Sync später; Pill
  zeigt `offline`/`error`.

## 18. Export-/Import-Garantie
- **Gesamt-Backup:** `doExport`/`doImport` — komplettes `DB` als JSON. Import ersetzt erst nach
  Bestätigung; vorher Snapshot.
- **Einzel-Platz:** `exportCourse`/`importCourseFile` — `.course.json`
  (`{type:"golftraining-course",version,course}`) inkl. `geo` & eigener Bearbeitungen.
- **Garantien:** (1) Export vollständig & menschenlesbar (JSON). (2) Import abwärtskompatibel —
  fehlende Felder ergänzt `ensureDefaults`. (3) Round-Trip verlustfrei. (4) Import überschreibt nie
  unbemerkt (Bestätigung + Backup davor).
- **Regel:** Datenfelder so gestalten, dass ältere Exporte weiter importierbar bleiben.

## 19. Modul-/„Plugin"-Regeln
- Ein Subsystem kapselt sich in: einem **State-Objekt** (`PLAY`, `CADDYPOS`, `GEOED`, `MAPST`,
  `WEATHER`), **reinen Rechenfunktionen** und **render/HTML-Funktionen**.
- **Namenskonvention:** Modul-Präfix (`play*`, `cp*`/`caddy*`, `geoEd*`, `weather*`/`wx*`).
- **Keine globalen Leaks:** Zustand im Modul-Objekt, nicht in vielen losen Globals.
- **Einbindung:** Modul liefert HTML-Strings für vorhandene Container/Sheets und hängt sich an
  bestehende Hooks (Nav, FAB, Caddy) an, statt den Kernfluss umzubauen.
- **Robuste Degradation:** Fehlt eine Voraussetzung (kein GPS/`geo`/Wetter), zeigt das Modul einen
  Hinweis statt zu crashen.

## 20. Performanceregeln
- **Kein Full-Re-Render im Hotpath:** Live-GPS aktualisiert nur Teilbereiche (`#playInfo`, `#cpBody`),
  nicht die ganze Ansicht.
- **GPS throttlen** (>2 m Bewegung); **Wetter cachen** (20 min).
- **Geo schlank:** `thinRing` reduziert Ringpunkte; `courseSVG` zeichnet beim Loch-Zoom nur nahe Features.
- **IndexedDB async** (nicht blockieren), localStorage nur Best-Effort.
- Teure Berechnungen (Caddy/Geo) einmal je Render, nicht in Schleifen.

## 21. Erweiterungsstrategie
- **Additiv & abwärtskompatibel** (siehe 14/18); neue Felder optional, `ensureDefaults` versorgt Altstände.
- **Erst reine Rechenfunktion + Node-Test, dann UI.**
- **Wiederverwenden** (esc/$/toast/miniStat/geo*/caddy*), kein Parallel-Code.
- Am Gerät zu prüfende Teile (GPS/Touch/Netz) im Antworttext ehrlich kennzeichnen.
- Bei jeder Erweiterung: diesen Doku-Block + **Changelog** pflegen.

## 22. KI-Regeln (verbindlich)
- Vor Änderung den passenden Abschnitt lesen; nach Änderung Abschnitt **und Changelog** aktualisieren.
- **Unverhandelbare Regeln (Abschnitt 1)** nie verletzen.
- **Testen statt raten:** `node --check` auf den attributlosen Haupt-Block + Logik-Harness.
- **Additiv** arbeiten, bestehende Funktionen nicht brechen, Version nicht ohne Grund erhöhen.
- **Deutsch, knapp, ehrlich**; jeden ausgegebenen String `esc()`.
- Keine Frameworks/externen Libs; Single-File bleibt Single-File. Einzige Netz-Dienste:
  Repo-Worker (Sync) und Open-Meteo (Wetter).

## 23. Wetter
- **Quelle:** Open-Meteo (`api.open-meteo.com`, kein Key, CORS). `fetchWeather/ensureWeather(lat,lng)`
  → `WEATHER {temp,windMs,windDir,gustMs,code,at,lat,lng}`, Cache 20 min; `weatherByGeo(cb)` ortet automatisch.
- **Physik (rein):** `bearingDeg`, `windRel(ms,dir,bearing)`→{head(+Rücken/−Gegen),crossMag,crossFrom},
  `tempFactor` (~0,22 %/°C rel. 20 °C), `playsLike(dist,temp,ms,dir,bearing)`. `windDir` = Richtung,
  AUS der der Wind kommt.
- **Caddy:** `inp.plays` (=„spielt wie") steuert die Schlägerwahl; `weatherEffectHtml(bearing,dist)`
  zeigt Temp/Wind + Effekt; Böen-Warnung im Spielmodus.
- **Anzeige:** Heute-Wetterkarte (`weatherCardHtml`, auto), Spielmodus/Karten-Caddy (Live-Fetch),
  Runden-Detail-Rückblick (`roundWeatherHtml`).
- **Speicherung je Runde:** `conditions{temp,windMs,windDir}` + `weather`-Snapshot (`weatherSnapshot`).

/* ---------- scoring rules (subject logic, kept in code not data) ---------- */
const HCP_LABELS = ["HCP 20","HCP 15","HCP 8","HCP 3","Scratch"];
const TIER_COLORS = ["var(--t0)","var(--t1)","var(--t2)","var(--t3)","var(--t4)"];
const CAT_ICON = {"Putting":"⛳","Short Game & Pelz":"🏌","Wedge & Approach":"🎯","Driver & Longgame":"🚀","Platz & Analyse":"🧠"};

function computeTotal(defKey, def, inputs){
  const v=k=>{const x=inputs[k];return typeof x==="number"?x:null;};
  const nums=def.inputs.map(i=>v(i.key)).filter(x=>x!=null);
  const scored=def.inputs.filter(i=>typeof i.max==="number");
  const sum=()=>scored.reduce((a,i)=>a+(v(i.key)||0),0);
  const r2=x=>Math.round(x*100)/100;
  const s=def.score||"sum";
  if(s&&typeof s==="object"&&s.field!=null) return v(s.field);
  switch(s){
    case "avg":   return nums.length?r2(nums.reduce((a,b)=>a+b,0)/nums.length):null;
    case "range": return nums.length>=2?Math.max(...nums)-Math.min(...nums):null;
    case "ratio":{const b=v("Backswing (s)"),d=v("Downswing (s)");return (b&&d)?r2(b/d):null;}
    default:      return sum();
  }
}
// value used against benchmark (updown as %)
function benchValue(defKey,total){ return defKey==="updown"? (total==null?null:total*10) : total; }

function tierIndex(value, levels, higherIsBetter){
  if(value==null) return -1;
  let idx=-1;
  for(let i=0;i<levels.length;i++){
    if(higherIsBetter? value>=levels[i] : value<=levels[i]) idx=i;
  }
  return idx; // -1 = below HCP20 tier
}
// position 0..1 across ladder for the marker
function ladderPos(value, levels, higherIsBetter){
  if(value==null) return 0;
  const lo=levels[0], hi=levels[4];
  let t=(value-lo)/(hi-lo);
  if(!higherIsBetter) t=(lo-value)/(lo-hi); // lower better: invert
  return Math.max(0,Math.min(1,t));
}
function lvlColor(idx){ return idx<0? "var(--ink-faint)" : TIER_COLORS[idx]; }
function lvlLabel(idx){ return idx<0? "unter HCP 20" : HCP_LABELS[idx]; }

/* ---------- state ---------- */
let DB = load();
/* ---------- lokale Persistenz: IndexedDB (kein ~5-MB-Limit) + localStorage-Notnagel ---------- */
let _idbP=null;
function idbReady(){ if(_idbP) return _idbP;
  _idbP=new Promise((res,rej)=>{ try{
    if(!("indexedDB" in window)) return rej(new Error("no idb"));
    const r=indexedDB.open("golftraining",1);
    r.onupgradeneeded=()=>{ try{ if(!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); }catch(e){} };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }catch(e){ rej(e); } });
  return _idbP; }
function idbGet(key){ return idbReady().then(db=>new Promise((res,rej)=>{
  const t=db.transaction("kv","readonly").objectStore("kv").get(key); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); })); }
function idbSet(key,val){ return idbReady().then(db=>new Promise((res,rej)=>{
  const t=db.transaction("kv","readwrite").objectStore("kv").put(val,key); t.onsuccess=()=>res(true); t.onerror=()=>rej(t.error); })); }
// Durable-Write: IndexedDB (async, gross) + best-effort localStorage (synchron, darf bei grossen Staenden fehlschlagen)
function saveLocal(db){ db=db||DB;
  try{ idbSet("golfdb", db).catch(()=>{}); }catch(e){}
  try{ localStorage.setItem("golfdb", JSON.stringify(db)); return true; }catch(e){ return false; }
}
// Backups: In-Memory-Cache (synchron fuer die UI) + IndexedDB (durable). Initial aus localStorage migriert.
let _backups=(()=>{ try{ return JSON.parse(localStorage.getItem("golfdb_backups")||"[]"); }catch(e){ return []; } })();

function load(){
  try{const s=localStorage.getItem("golfdb"); if(s){
    const d=JSON.parse(s);
    // only reuse stored data if it matches the current schema version
    if(d && d.version===SEED.version && Array.isArray(d.testDefs) && Array.isArray(d.rounds)) return d;
  }}catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function persist(){ const okLS=saveLocal();
  if(!okLS){ try{ if(!persist._warned){ persist._warned=true; toast("Großer Datenstand – sicher in IndexedDB gespeichert."); } }catch(_){} }
  markDirty(); snapshot("Auto"); scheduleCloudSync(); }

/* ---------- data safety ---------- */
let dirty=false, lastSavedAt=null;
try{ lastSavedAt=localStorage.getItem("golfdb_savedAt")||null; }catch(e){}
function dataScore(d){ d=d||DB; return (d.rounds||[]).length*3+(d.competitions||[]).length+(d.tests||[]).length
  +(d.fitnessSessions||[]).length+(d.playedCourses||[]).length+((d.lmSessions||[]).reduce((a,s)=>a+(s.shots?s.shots.length:0),0)); }
function markDirty(){ dirty=true; updateSaveBadge();
  if(typeof cloudConfigured==="function" && cloudConfigured() && SYNC.cloud!=="syncing"){ SYNC.cloud="pending"; }
  updateSyncPill(); }
function markSaved(){ dirty=false; lastSavedAt=new Date().toISOString();
  try{ localStorage.setItem("golfdb_savedAt",lastSavedAt); }catch(e){} updateSaveBadge(); }
function updateSaveBadge(){ const el=$("#saveBadge"); if(!el) return;
  el.className="save-badge "+(dirty?"warn":"ok");

}
/* ---------- globaler Sync-Status (immer in der Kopfzeile sichtbar) ---------- */
let SYNC={cloud:"idle", at:(()=>{try{return localStorage.getItem("golfdb_cloudAt")||null;}catch(e){return null;}})()};
function setSync(state){ SYNC.cloud=state;
  if(state==="ok"){ SYNC.at=new Date().toISOString(); try{localStorage.setItem("golfdb_cloudAt",SYNC.at);}catch(e){} }
  updateSyncPill(); }
function syncTime(){ return SYNC.at? new Date(SYNC.at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) : ""; }
function updateSyncPill(){ const el=document.getElementById("syncPill"); if(!el) return;
  const cfg=(typeof cloudConfigured==="function")&&cloudConfigured();
  let cls="idle", txt="● nur lokal";
  if(!cfg){ cls="idle"; txt="● nur lokal"; }
  else switch(SYNC.cloud){
    case "syncing": cls="sync"; txt="↑ sichert…"; break;
    case "ok":      cls="ok";   txt="☁ "+(syncTime()||"gesichert"); break;
    case "pending": cls="pend"; txt="☁ ausstehend"; break;
    case "offline": cls="warn"; txt="⚠ offline"; break;
    case "error":   cls="err";  txt="⚠ nicht gesichert"; break;
    case "blocked": cls="err";  txt="⚠ Konflikt"; break;
    default:        cls=SYNC.at?"ok":"idle"; txt=SYNC.at?("☁ "+syncTime()):"● lokal";
  }
  el.className="sync-pill "+cls; el.textContent=txt;
}
function snapshot(reason, force){
  try{ const now=Date.now();
    if(!force && now-(snapshot._last||0) < 180000) return; snapshot._last=now;
    _backups.push({ts:new Date().toISOString(), reason, score:dataScore(), data:JSON.stringify(DB)});
    while(_backups.length>10) _backups.shift();
    try{ idbSet("golfdb_backups", _backups).catch(()=>{}); }catch(e){}
    // localStorage-Kopie der Backups nur best-effort; darf bei grossen Staenden fehlschlagen
    try{ localStorage.setItem("golfdb_backups", JSON.stringify(_backups)); }catch(e){ try{ localStorage.removeItem("golfdb_backups"); }catch(_){} }
  }catch(e){}
}
function getBackups(){ return _backups.slice(); }
function restoreBackup(ts){ const b=_backups.find(x=>x.ts===ts); if(!b) return;
  if(!confirm("Diesen Stand wiederherstellen? Der aktuelle Stand wird zuvor gesichert.")) return;
  snapshot("Vor Wiederherstellung", true);
  try{ DB=JSON.parse(b.data); saveLocal(); renderAll(); markDirty(); flushCloudNow(); toast("Stand wiederhergestellt"); }catch(e){ toast("Wiederherstellung fehlgeschlagen"); }
}
// conflict-aware loader used by all import paths
function applyLoaded(d, sourceLabel){
  if(!d||!d.testDefs||!d.tests){ toast("Keine gültige Datenbasis"); return false; }
  const curScore=dataScore(DB), newScore=dataScore(d);
  const curTime=DB.exportedAt||"", newTime=d.exportedAt||"";
  const olderByTime = curTime && newTime && newTime < curTime;
  if((newScore < curScore-2) || olderByTime){
    if(!confirm(`Achtung: Die geladene Datei wirkt ${olderByTime?"älter":"kleiner"} als dein aktueller Stand `
      +`(${newScore} vs. ${curScore} gewichtete Einträge). Wirklich überschreiben?`)) return false;
  }
  snapshot("Vor Laden", true);
  DB=d; saveLocal(); markSaved(); renderAll(); flushCloudNow(); toast("Datei geladen");
  return true;
}

/* ---------- laufende Runde: Entwurf automatisch sichern ---------- */
const DRAFT_KEY="golfdb_draftRound";
let draftCloudMark=0;
function saveDraft(r){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({round:r, ts:new Date().toISOString()})); }catch(e){} }
function getDraft(){ try{ const s=localStorage.getItem(DRAFT_KEY); if(!s)return null; const d=JSON.parse(s); return (d&&d.round)?d:null; }catch(e){ return null; } }
function getDraftAny(){ const l=getDraft(); if(l) return l; const c=DB._draftRound;
  return (c&&c.round&&(c.round.holes||[]).some(h=>h.score!=null))?c:null; }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} if(DB._draftRound) delete DB._draftRound; draftCloudMark=0; }
function draftHoles(d){ return ((d.round.holes||[]).filter(h=>h.score!=null)).length; }
// Kontrollpunkt: laufende Runde alle 3 gespielten Löcher zusätzlich ins Repo sichern
function maybeCheckpointDraft(r){
  if(!cloudConfigured()||localStorage.getItem("golfdb_cloudAuto")!=="1") return;
  const n=(r.holes||[]).filter(h=>h.score!=null).length;
  if(n>0 && n!==draftCloudMark){ draftCloudMark=n;
    DB._draftRound={round:r, ts:new Date().toISOString()};
    try{ saveLocal(); }catch(e){}
    cloudSave(true);
  }
}
function startRound(){ const d=getDraftAny(); if(d){ openAddRound(null, d.round); toast("Unterbrochene Runde fortgesetzt"); } else openAddRound(); }
function discardDraft(){ if(confirm("Unterbrochenen Runden-Entwurf verwerfen?")){ clearDraft(); persist(); renderAll(); flushCloudNow(); toast("Entwurf verworfen"); } }
function draftBanner(){ const d=getDraftAny(); if(!d) return "";
  const r=d.round, n=draftHoles(d); if(!n) return "";

    <div class="grid2" style="margin-top:10px">
      <button class="btn gold" onclick="startRound()">Fortsetzen</button>

}
function defFor(k){ return DB.testDefs.find(d=>d.key===k); }

function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ---------- SVG charts (dependency-free, offline) ---------- */
function lineChart(series, opts){
  opts=opts||{}; const W=560,H=opts.h||160,PL=34,PR=10,PT=12,PB=22;
  let all=[]; series.forEach(s=>s.pts.forEach(p=>{if(p.y!=null)all.push(p.y)}));
  if(!all.length) return '<div class="empty">Noch keine Daten.</div>';
  let mn=Math.min(...all), mx=Math.max(...all);
  if(opts.min!=null)mn=Math.min(mn,opts.min); if(opts.max!=null)mx=Math.max(mx,opts.max);
  if(opts.band){ mn=Math.min(mn,opts.band[0]); mx=Math.max(mx,opts.band[1]); }
  if(mn===mx){mn-=1;mx+=1;} const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const n=Math.max(...series.map(s=>s.pts.length));
  const x=i=>PL+(n<=1?0.5:i/(n-1))*(W-PL-PR);
  const y=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
  let g='';
  // gridlines
  for(let k=0;k<=3;k++){const gy=PT+k/3*(H-PT-PB);const gv=(mx-(mx-mn)*k/3);
    g+=`<line x1="${PL}" y1="${gy}" x2="${W-PR}" y2="${gy}" stroke="var(--line-soft)" stroke-width="1"/>`;
    g+=`<text x="${PL-6}" y="${gy+3}" text-anchor="end" font-size="10" fill="var(--ink-faint)" font-family="var(--mono)">${opts.fmt?opts.fmt(gv):Math.round(gv)}</text>`;}
  if(opts.band){ const yt=y(opts.band[1]), yb=y(opts.band[0]);
    g+=`<rect x="${PL}" y="${yt}" width="${W-PL-PR}" height="${Math.max(0,yb-yt)}" fill="${opts.bandColor||'var(--pine)'}" opacity="0.13"/>`;
    g+=`<text x="${W-PR}" y="${yt-3}" text-anchor="end" font-size="10" fill="var(--pine)">Zielbereich</text>`; }
  series.forEach(s=>{
    const pts=s.pts.filter(p=>p.y!=null);
    if(pts.length>1){let d=pts.map((p,i)=>(i?"L":"M")+x(p.i)+" "+y(p.y)).join(" ");
      g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;}
    pts.forEach(p=>{g+=`<circle cx="${x(p.i)}" cy="${y(p.y)}" r="3.1" fill="#fff" stroke="${s.color}" stroke-width="2"/>`;});
  });
  // x labels (first/last)
  if(opts.labels&&opts.labels.length){
    g+=`<text x="${PL}" y="${H-6}" font-size="10" fill="var(--ink-faint)" font-family="var(--mono)">${opts.labels[0]}</text>`;
    g+=`<text x="${W-PR}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--ink-faint)" font-family="var(--mono)">${opts.labels[opts.labels.length-1]}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
function sparkline(vals,color){
  vals=vals.filter(v=>v!=null); if(vals.length<2) return '';
  const W=120,H=34,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;

/* ---------- Schläger-Empfehlung je Loch (auf Basis der Schlagweiten) ---------- */
function clubShort(name){
  if(!name) return "";
  const parts=String(name).split("·");
  let head=parts[0].replace(/\s*\d+(?:[.,]\d+)?\s*°/,"").trim();  // Loft entfernen
  const tail=parts[1]?parts[1].trim():"";                        // z.B. "45 m" (Teilschlag)
  return tail? head+" "+tail : head;
}
function clubList(){
  const cs=Array.isArray(DB.clubDistances)?DB.clubDistances:[];
  return cs.map(c=>({name:c.club, carry:(c.carry!=null?+c.carry:null), total:(c.total!=null?+c.total:null)}))
           .map(c=>({...c, reach:(c.total!=null?c.total:c.carry)}))
           .filter(c=>c.reach!=null&&!isNaN(c.reach))
           .sort((a,b)=>b.reach-a.reach);
}
// wählt Schläger: mode 'reach' = kleinster voller Schläger, der die Distanz trägt (sonst längster);
// mode 'carry' = der distanzmäßig nächstgelegene Schläger (für Annäherungen ins Grün)
function pickClub(clubs, d, mode){
  const arr=clubs.map(c=>({c, v:(mode==="carry"?(c.carry!=null?c.carry:c.reach):c.reach)})).filter(x=>x.v!=null);
  if(!arr.length) return null;
  if(mode==="carry") return arr.sort((a,b)=>Math.abs(a.v-d)-Math.abs(b.v-d))[0].c;
  const reaching=arr.filter(x=>x.v>=d).sort((a,b)=>a.v-b.v);
  return (reaching.length?reaching[0]:arr.sort((a,b)=>b.v-a.v)[0]).c;
}
// liefert eine Schläger-Reihenfolge {club,dist,label} für ein Loch der Länge len (Meter)
function clubPlan(len,par){
  const clubs=clubList(); if(!clubs.length||!len) return [];
  const fairway=clubs.filter(c=>!/driver/i.test(c.name)); // vom Fairway kein Driver
  const fw=fairway.length?fairway:clubs;
  const maxReach=clubs[0].reach;
  const maxCarry=Math.max.apply(null,fw.map(c=>c.carry!=null?c.carry:0));
  const seq=[];
  if(par===3){ const c=pickClub(clubs,len,"carry"); if(c) seq.push({club:c,dist:len,label:"Grün"}); return seq; }
  // in einem Schlag erreichbar (kurzes/anfahrbares Loch)
  if(len<=maxReach){ const c=pickClub(clubs,len,len<=200?"carry":"reach"); if(c) seq.push({club:c,dist:len,label:"Grün"}); return seq; }
  // Abschlag mit dem längsten Schläger
  const driver=clubs[0]; seq.push({club:driver,dist:driver.reach,label:"Abschlag"});
  let rem=len-driver.reach, guard=0;
  // ggf. Layups (Fairwayschläger), solange der Rest keinen Approach zulässt
  while(rem>maxCarry && guard++<3){ const lay=pickClub(fw,rem,"reach"); if(!lay) break; seq.push({club:lay,dist:lay.reach,label:"Layup"}); rem-=lay.reach; }
  if(rem>5){ const ap=pickClub(fw,rem,"carry"); if(ap) seq.push({club:ap,dist:Math.round(rem),label:"Grün"}); }
  return seq;
}
function clubPlanText(len,par){
  const seq=clubPlan(len,par);
  if(!seq.length) return '<span style="color:var(--ink-faint)">Schlagweiten unter „Schläger" pflegen</span>';
  return seq.map(s=>`<b>${esc(clubShort(s.club.name))}</b>`).join(' <span class="ct-arrow">→</span> ');
}

function clubSigma(name, dist){
  const arr=(DB.gpsShots||[]).filter(s=>s.club===name).map(s=>s.dist);
  if(arr.length>=4){ const m=arr.reduce((a,b)=>a+b,0)/arr.length;
    const v=arr.reduce((a,b)=>a+(b-m)*(b-m),0)/arr.length; return Math.max(4,Math.round(Math.sqrt(v))); }
  return Math.max(6, Math.round(dist*0.06));
}

function bearingDeg(a,b){
  const toR=d=>d*Math.PI/180, toD=r=>r*180/Math.PI;
  const y=Math.sin(toR(b[1]-a[1]))*Math.cos(toR(b[0]));
  const x=Math.cos(toR(a[0]))*Math.sin(toR(b[0]))-Math.sin(toR(a[0]))*Math.cos(toR(b[0]))*Math.cos(toR(b[1]-a[1]));
  return (toD(Math.atan2(y,x))+360)%360;
}
const COMPASS8=["N","NO","O","SO","S","SW","W","NW"];
function compass8(deg){ return COMPASS8[Math.round(((deg%360)/45))%8]; }
function tempFactor(temp){ return temp==null?1:(1 + (temp-20)*0.0022); }  // ~0,22 % je °C rel. 20 °C
// windDir = Richtung, AUS der der Wind kommt (meteorologisch)
function windRel(windMs, windDir, bearing){
  if(windMs==null||windDir==null||bearing==null) return null;
  const toR=Math.PI/180;
  const blowTo=(windDir+180)%360;
  const relBlow=((blowTo - bearing + 540)%360)-180;   // 0 = Rückenwind aufs Ziel
  const head = windMs*Math.cos(relBlow*toR);          // + Rücken, − Gegen
  const crossMag = Math.abs(windMs*Math.sin(relBlow*toR));
  const srcRel=((windDir - bearing + 540)%360)-180;   // Quelle relativ zur Blickrichtung
  return { head, crossMag, crossFrom: srcRel<0?"links":"rechts" };
}
function playsLike(dist, temp, windMs, windDir, bearing){
  let d=dist / tempFactor(temp);                       // wärmer -> fliegt weiter -> spielt kürzer
  const w=windRel(windMs,windDir,bearing);
  if(w){ if(w.head<0) d += dist*(-w.head)*0.014; else d -= dist*w.head*0.008; }
  return Math.round(d);
}

// Güte einer Rest-Distanz ins Grün (0..100): volle Wedges stark, krumme Halbschläge schwach, lange Approaches schwach
function approachStrength(d){
  if(d==null) return 55; if(d<=0) return 60;
  const p=[[15,50],[25,42],[35,45],[50,54],[65,68],[80,80],[95,93],[110,95],[125,90],[140,84],[155,76],[170,67],[190,57],[210,47],[245,38]];
  if(d<=p[0][0]) return p[0][1];
  if(d>=p[p.length-1][0]) return p[p.length-1][1];
  for(let i=1;i<p.length;i++){ if(d<=p[i][0]){ const [x0,y0]=p[i-1],[x1,y1]=p[i]; return y0+(y1-y0)*(d-x0)/(x1-x0); } }
  return 60;
}
const _sideDE=s=>s==="L"?"links":s==="R"?"rechts":"";
const _typeDE=t=>t==="ob"?"OB":t==="water"?"Wasser":t==="bunker"?"Bunker":"";
function _short(name){ return (typeof clubShort==="function")?clubShort(name):name; }
function _nearest(d,pool){ return pool.reduce((b,c)=>Math.abs(c.dist-d)<Math.abs(b.dist-d)?c:b, pool[0]); }
function _reaching(d,pool){ const r=pool.filter(c=>c.dist>=d).sort((a,b)=>a.dist-b.dist); return r.length?r[0]:pool.slice().sort((a,b)=>b.dist-a.dist)[0]; }

function caddyPlan(len, par, tr, mode, ctx, hist){
  const clubs=ctx.clubs; if(!clubs.length||!len) return null;
  const miss=ctx.miss||{dir:null};
  const modeRisk = mode==="safe"?1.6 : mode==="aggr"?0.4 : 1.0;
  const fw=clubs.filter(c=>!/driver/i.test(c.name));
  const green=(fw.length?fw:clubs);
  const maxReach=clubs[0].dist;
  tr=tr||{};

  function teeRisk(club){
    let risk=0, why=[];
    if(tr.tSide && tr.tType){
      const reaches = tr.tAt!=null ? (club.dist + club.sigma >= tr.tAt) : (club.dist>150);
      if(reaches){ risk += tr.tType==="ob"?38:tr.tType==="water"?32:15;
        const mine = miss.dir && miss.dir===tr.tSide;
        if(mine) risk += 24;
        why.push({t:tr.tType,side:tr.tSide,mine}); }
    }
    if(tr.dog){ const at=(tr.dogAt!=null?tr.dogAt:200); if(club.dist+club.sigma>at){ risk+=12; why.push({dog:tr.dog}); } }
    if(tr.layupTo!=null && club.dist+club.sigma>tr.layupTo){ risk+=34; why.push({layup:true}); }
    return {risk, why};
  }
  const troubleReason=(why)=>{ if(!why||!why.length) return null; const w=why[0];
    if(w.t) return `${_typeDE(w.t)} ${_sideDE(w.side)}${w.mine?" — genau deine Fehlbild-Seite":""} bringt der große Schläger ins Spiel`;
    if(w.dog) return `Dogleg ${_sideDE(w.dog)} — zu viel Länge läuft durch die Ecke`;
    if(w.layup) return `Layup-Zone — nicht über die Gefahr hinausspielen`;
    return null; };
  const shortRisk=(why)=>{ if(!why||!why.length) return "mehr Varianz"; const w=why[0];
    if(w.t) return `${_typeDE(w.t)} ${_sideDE(w.side)} im Spiel`; if(w.dog) return `Dogleg ${_sideDE(w.dog)}`; if(w.layup) return "über die Gefahr hinaus"; return "mehr Varianz"; };

  const tags=new Set(), shots=[]; let alt=null, finalLeft=len, headline="";

  if(par===3){

    const club=_reaching(target, clubs);
    let why=`Genug Schläger für die Grünmitte${note.length?" · "+note[0]:""}. Ziel Zentrum, nicht Fahne.`;
    if(hist && hist.missNote){ why+=` Hier ${hist.missNote.toLowerCase()}.`; tags.add("Historie: "+hist.missNote); }

    finalLeft=len; headline=_short(club.name);
  }
  // ---------- kurzes/anfahrbares Par 4 ----------
  else if(par===4 && len<=maxReach){
    // Option A: aufs Grün gehen. Option B: auf volle Wedge-Zahl zurücklegen.

    let best=null;
    fw.forEach(c=>{ const left=len-c.dist; if(left<35) return; const s=approachStrength(left); if(!best||s>best.s) best={c,left,s}; });
    const goRisky = !!tr.green || len>250; // greenside Ärger o. langer Anlauf
    const preferLay = mode!=="aggr" && best && best.s>=80 && (goRisky || best.s>=88);
    if(preferLay){
      const ap=_nearest(best.left, green);
      shots.push({tone:"pos",role:"Abschlag",club:best.c.name,dist:best.c.dist+" m",
        why:`<b>Nicht der große Schläger.</b> Der ließe nur einen krummen Rest — ${_short(best.c.name)} legt dir ein volles Wedge auf <b>${Math.round(best.left)} m</b>.`});
      shots.push({tone:"go",role:"Grün",club:ap.name,dist:Math.round(best.left)+" m",
        why:`Volle Zahl in die Grünmitte${tr.green?` — ${_typeDE(tr.green)} vorn meiden`:""}.`});
      finalLeft=best.left; headline=_short(best.c.name)+" → "+_short(ap.name);
      tags.add("Volle Wedge-Zahl"); tags.add("Positionierung");
      alt={lab:"Wenn du Birdie jagst", txt:`${_short(goClub.name)} Richtung Grün gibt eine Anlauf-Chance — verfehlt aber oft in Grünnähe-Ärger.`};
    } else {
      shots.push({tone:mode==="aggr"?"warn":"go",role:"Grün-Anlauf",club:goClub.name,dist:len+" m",
        why:`Direkt Richtung Grün${tr.green?` — Achtung ${_typeDE(tr.green)} vorn`:""}. Kurzes Par 4, Chance nutzen.`});
      finalLeft=0; headline=_short(goClub.name);
      if(best) alt={lab:"Sicherer", txt:`${_short(best.c.name)} legt dir ${Math.round(best.left)} m volles Wedge statt Grün-Risiko.`};
      tags.add(mode==="aggr"?"Birdie-Chance":"Grün-Anlauf");
    }

  }
  // ---------- normales Par 4 / Par 5 ----------
  else {
    const teeCand=clubs.filter(c=>c.dist>=140);
    const pool=teeCand.length?teeCand:[clubs[0]];
    const isP5=par>=5;
    function evalTee(tc){
      const trk=teeRisk(tc); let seq=[{tone:"go",role:"Abschlag",club:tc.name,dist:tc.dist+" m",risk:trk}];
      let rem=len-tc.dist, left;
      if(isP5 && rem>195){

      } else {

        const ap=_nearest(rem, green);
        seq.push({tone:"go",role:"Grün",club:ap.name,dist:Math.round(rem)+" m"});
      }
      const advance = left>175 ? (left-175)*0.22 : 0;
      const score = Math.round(approachStrength(left)/4)*4 - trk.risk*modeRisk - advance + tc.dist*0.02;
      return {tc,seq,left,score,trk};
    }
    const evals=pool.map(evalTee).sort((a,b)=>b.score-a.score);
    const chosen=evals[0];
    const driverEval=evals.find(e=>/driver/i.test(e.tc.name));
    const driverLeft = driverEval ? driverEval.left : null;
    // reasons
    chosen.seq.forEach((s,i)=>{
      let why="";
      if(i===0){
        const notDriver = !/driver/i.test(chosen.tc.name) && driverEval && driverEval!==chosen;
        const tRes = troubleReason(chosen.trk.why) || (driverEval && driverEval.trk.risk>chosen.trk.risk ? troubleReason(driverEval.trk.why) : null);
        if(notDriver && tRes){
          why = `${tRes} — ${_short(chosen.tc.name)} bleibt sicher.`;
          if((driverEval.trk.why||[]).some(w=>w.mine)||chosen.trk.why.some(w=>w.mine)) tags.add("Fehlbild "+_sideDE(miss.dir)+" berücksichtigt");
          const av=(driverEval.trk.why||[]).find(w=>w.t)||chosen.trk.why.find(w=>w.t); if(av) tags.add(_typeDE(av.t)+"-Seite gemieden");
          tags.add("Positionierung");
        } else if(notDriver && driverLeft!=null && (driverLeft<75 || approachStrength(chosen.left)-approachStrength(driverLeft)>=10)){
          why = `Driver ließe nur <b>${Math.round(driverLeft)} m</b> — ${_short(chosen.tc.name)} legt dir volle <b>${Math.round(chosen.left)} m</b> in deine beste Zone.`;
          tags.add("Positionierung"); if(chosen.left>=85&&chosen.left<=120) tags.add("Volle Wedge-Zahl");
        } else if(notDriver){
          why = `${_short(chosen.tc.name)} lässt dir ${Math.round(chosen.left)} m — angenehmere Annäherung als mit dem großen Schläger.`;
          tags.add("Positionierung");
        } else {
          why = tr.tSide? `Voller Abschlag — Korridor beachten (${_typeDE(tr.tType)} ${_sideDE(tr.tSide)}).` : `Voller Abschlag Richtung Fahne.`;
          if(/driver/i.test(chosen.tc.name)&&mode==="aggr") tags.add("Volle Länge");
        }
      } else if(s.lay){
        why=`Bewusst zurückgelegt — lässt <b>${Math.round(chosen.left)} m</b>, dein bestes volles Wedge, statt eines krummen Halbschlags.`;
        tags.add("Volle Wedge-Zahl");
      } else {
        const strong=approachStrength(chosen.left)>=82;
        why=`${strong?"Volle Zahl":"Bestmögliche Distanz"} in die Grünmitte${tr.green?` — ${_typeDE(tr.green)} vorn meiden`:""}.`;
        if(chosen.left>=85&&chosen.left<=120) tags.add("Volle Wedge-Zahl");
      }
      shots.push({tone:s.tone,role:s.role,club:s.club,dist:s.dist,why});
    });
    finalLeft=chosen.left;
    headline=chosen.seq.map(s=>_short(s.club)).join(" → ");
    if(hist && hist.n>=3){ tags.add("Historie · n="+hist.n); }
    // Alternative
    const safeEvals=evals.filter(e=>e.trk.risk===0 && e.left<=200).sort((a,b)=>b.score-a.score);
    if(chosen.trk.risk>0 && safeEvals.length && safeEvals[0]!==chosen){
      alt={lab:"Sicherere Variante", txt:`${_short(safeEvals[0].tc.name)} nimmt die Gefahr komplett raus — lässt ${Math.round(safeEvals[0].left)} m ins Grün.`};
    } else if(driverEval && driverEval!==chosen){
      alt={lab:"Wenn du angreifen willst", txt:`Mit ${_short(driverEval.tc.name)} kommst du näher (${Math.round(driverEval.left)} m Rest) — dafür ${shortRisk(driverEval.trk.why)}.`};
    }
    if(mode==="aggr") tags.add("Offensiv");
    if(mode==="safe") tags.add("Sicher");
  }

  // Erwartung / Chance
  const s=approachStrength(finalLeft);
  const chance = par===3
      ? (s>=85?"gute GIR-Chance":s>=70?"solides Ziel":"anspruchsvoll")
      : (s>=85?"volles Wedge · gute GIR-Chance":s>=72?"gute Grün-Chance":s>=58?"solide Position":"schwierige Distanz");
  const expect = { n: (par===3? len : (finalLeft>0?Math.round(finalLeft):"–")) + (finalLeft>0||par===3?" m":""),
                   l: par===3?"Schlag ins Grün":(finalLeft>0?"Rest ins Grün":"aufs Grün"), chance };

  return { shots, tags:[...tags], alt, expect, headline };
}

function caddyBlockHtml(hd, courseName, mode, ctx){
  if(!hd || !hd.len) return "";

  if(!ctx.clubs.length) return `<div class="caddy"><div class="cad-head static"><span class="cad-ic">🧭</span><span class="cad-chain">Schlagweiten unter „Schläger" pflegen für Caddy-Tipps</span></div></div>`;
  const tr=holeTrouble(courseName, hd.hole);
  const hist=holeHistory(courseName, hd.hole, hd.par);
  const p=caddyPlan(hd.len, hd.par, tr, mode, ctx, hist);
  if(!p) return "";
  const toneDot=t=>`<span class="cad-dot ${t}"><i></i></span>`;
  const shots=p.shots.map(s=>`<div class="cad-shot">${toneDot(s.tone)}
    <div class="cad-sb"><div class="cad-s1"><span class="cad-role">${esc(s.role)}</span><span class="cad-club">${esc(_short(s.club))}</span><span class="cad-d">${esc(s.dist)}</span></div>
    <div class="cad-why">${s.why}</div></div></div>`).join("");
  const chips=p.tags.map(t=>`<span class="cad-chip">${esc(t)}</span>`).join("");
  const alt=p.alt?`<div class="cad-alt"><span class="cad-al">${p.alt.lab}</span> ${p.alt.txt}</div>`:"";
  const _cg=(DB.courses.find(x=>x.name===courseName)||{}).geo;
  const _tb=(_cg&&_cg.holes[hd.hole]&&_cg.holes[hd.hole].tee&&_cg.holes[hd.hole].green)?bearingDeg(_cg.holes[hd.hole].tee,_cg.holes[hd.hole].green):null;
  const wxLine=weatherEffectHtml(_tb, hd.len);
  return `<div class="caddy">
    <button type="button" class="cad-head" onclick="this.parentNode.classList.toggle('open')">
      <span class="cad-ic">🧭</span><span class="cad-chain">${esc(p.headline)}</span><span class="cad-chev">▾</span>
    </button>
    <div class="cad-detail">
      ${shots}
      <div class="cad-expect"><div><div class="cad-en">${esc(p.expect.n)}</div><div class="cad-el">${esc(p.expect.l)}</div></div><span class="cad-chance">${esc(p.expect.chance)}</span></div>
      <div class="cad-chips">${chips}</div>
      ${alt}
      ${wxLine}
      ${manualTipHtml(courseName, hd.hole)}
      <button type="button" class="cad-pos-b" onclick="caddyPos(${hd.hole})">📍 Ich stehe hier – ab Position rechnen</button>
    </div></div>`;
}
