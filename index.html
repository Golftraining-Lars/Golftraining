          <div class="field num" style="${fS}"><label>Putts</label><input inputmode="numeric" class="hin" data-f="putts" value="${ex.putts??''}" placeholder="–"></div>
        </div>
        ${hd.par!==3?`<div class="field" style="margin:8px 0 0"><label>Tee-Ergebnis</label><select class="hin" data-f="tee"><option value="">–</option>${teeOpts}</select></div>`:''}
        <div class="in-grid" style="grid-template-columns:1fr auto;align-items:end;margin-top:8px">
          <div class="field" style="${fS}"><label>Approach-Distanz</label><select class="hin" data-f="appr"><option value="">–</option>${apprOpts}</select></div>
          <div class="field num" style="${fS}"><label>Pen.</label><input inputmode="numeric" class="hin" data-f="penN" value="${ex.penN??''}" placeholder="0" style="width:56px"></div>
        </div>
        <details class="descbox" style="margin:9px 0 0">
          <summary style="padding:9px 11px"><span>Weitere Details</span><span class="chev-d">▾</span></summary>
          <div class="desc-body" style="padding:10px 11px">
            <div class="in-grid" style="grid-template-columns:1fr 1fr;gap:9px">
              <div class="field" style="${fS}"><label>1st-Putt-Distanz</label><select class="hin" data-f="firstPutt">${fpOpts}</select></div>
              <div class="field" style="${fS}"><label>Quality (nach 1. Putt)</label><select class="hin" data-f="quality">${qOpts}</select></div>
              <div class="field" style="${fS}"><label>Tee-Schläger</label><select class="hin" data-f="club">${clubOpts}</select></div>
              <div class="field" style="${fS}"><label>Approach-Lage</label><select class="hin" data-f="lie">${lieOpts}</select></div>
              <div class="field num" style="${fS}"><label>Distance to Pin (m)</label><input inputmode="decimal" class="hin" data-f="distToPin" value="${ex.distToPin??''}" placeholder="–"></div>
              <div class="field num" style="${fS}"><label>Bunker Anzahl</label><input inputmode="numeric" class="hin" data-f="bunkerN" value="${ex.bunkerN??''}" placeholder="0"></div>
              <div class="field" style="${fS}"><label>Bunker Typ</label><select class="hin" data-f="b1">${btOpts}</select></div>
              <div class="field" style="${fS}"><label>Penalty Typ</label><select class="hin" data-f="penType">${ptOpts}</select></div>
              <div class="field" style="${fS}"><label>Up &amp; Down</label><select class="hin" data-f="ud">${jn}</select></div>
              <div class="field" style="${fS}"><label>Sand Save</label><select class="hin" data-f="ss">${jn}</select></div>
              <div class="field" style="${fS}"><label>Recovery nötig</label><select class="hin" data-f="recovery">${jn}</select></div>
              <div class="field" style="${fS}"><label>GIR (Override)</label><select class="hin" data-f="girDirect">${jn}</select></div>
            </div>
          </div>
        </details>
      </div>`;
    }).join("");
    // set all select values from existing hole data
    $("#r_holes").querySelectorAll(".hcard").forEach(card=>{
      const n=+card.dataset.hole, ex=existingHole(n)||{};
      card.querySelectorAll("select.hin").forEach(sel=>{ const f=sel.dataset.f; if(ex[f]!=null) sel.value=ex[f]; });
    });
    $("#r_holes").querySelectorAll(".hin").forEach(el=>el.addEventListener("input",live));
    $("#r_holes").querySelectorAll("select.hin").forEach(el=>el.addEventListener("change",live));

  function collect(){
    const [_,type,side]=ROUND_KINDS[+kindSel.value];
    const holes=[];
    $("#r_holes").querySelectorAll(".hcard").forEach(card=>{
      const n=+card.dataset.hole; const o={hole:n};
      card.querySelectorAll(".hin").forEach(el=>{
        const f=el.dataset.f;
        if(el.tagName==="SELECT"){ if(el.value) o[f]=el.value; }
        else if(el.dataset.text){ if(el.value) o[f]=el.value; }
        else { const v=num(el.value); if(v!=null) o[f]=v; }
      });
      holes.push(o);
    });
    holes.forEach(o=>{ if(RTRACK[o.hole] && RTRACK[o.hole].length) o.shots=RTRACK[o.hole]; });
    const st=$("#r_start").value||null, en=$("#r_end").value||null;
    const baseCond = ed?Object.assign({},ed.conditions):{}; const wx=weatherSnapshot();
    if(wx){ if(baseCond.temp==null) baseCond.temp=Math.round(wx.temp); if(baseCond.windMs==null) baseCond.windMs=wx.windMs; if(baseCond.windDir==null) baseCond.windDir=wx.windDir; }
    return {id: ed?ed.id:"R"+Date.now(), date:$("#r_date").value, course:courseSel.value, tee:teeSel.value,
      type, side, hi:num($("#r_hi").value), countHcp:$("#r_eds").checked, conditions: baseCond, weather: (ed&&ed.weather)||wx||null,
      startTime:st, endTime:en, durationMin:roundDurationMin(st,en), holes};
  }
  function live(){
    const r=collect();
    const e=computeRound(r);
    $("#r_live").textContent = e.counted? `${e.toParThrough>=0?"+":""}${e.toParThrough} · ${e.gross} Schläge / ${e.counted} L` : "–";
    $("#r_live2").textContent = e.counted? `${e.stblN} · ${e.lever||"–"}` : "–";
    if(!ed){ const has=r.holes.some(h=>h.score!=null);
      if(has){ saveDraft(r); maybeCheckpointDraft(r); const as=$("#r_autosave"); if(as) as.textContent="✓ Automatisch gesichert · "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); } }
  }
  courseSel.onchange=()=>{fillTees();buildHoles();};
  teeSel.onchange=buildHoles; kindSel.onchange=buildHoles;
  buildHoles();
  window.__openShotTrack=function(n){
    let reopen; const cn=courseSel.value;
    if(ed){ const r=collect(); const i=DB.rounds.findIndex(x=>x.id===ed.id);
      if(i>=0){ DB.rounds[i]=r; persist(); reopen=()=>{ RTRACK_KEEP=true; openAddRound(DB.rounds[i]); }; }
      else reopen=()=>{ RTRACK_KEEP=true; openAddRound(ed); };
    } else { const d=collect(); if(d.holes.some(h=>h.score!=null)) saveDraft(d);
      reopen=()=>{ RTRACK_KEEP=true; openAddRound(null, d); }; }
    renderShotTrack(n, reopen, cn);
  };

function shotCount(sh){ const n=(sh&&sh.length)?sh.length:0; return Math.max(0,n-1); }
let STRK={n:null, courseName:null, reopen:null, M:null, view:null, vw:0, vh:0, ptrs:null, pinch:null, lastPinch:0, drag:null};
function renderShotTrack(n, reopen, courseName){
  STRK.n=n; STRK.courseName=courseName; STRK.reopen=reopen; STRK.ptrs=STRK.ptrs||new Map();

  const clubs=(typeof clubList==="function"?clubList():[]).map(c=>c.name);
  const clubOpt=(v)=>`<option value="">Schläger</option>`+clubs.map(cn=>`<option value="${esc(cn)}"${v===cn?" selected":""}>${esc(typeof _short==="function"?_short(cn):cn)}</option>`).join("");
  const rows=shots.map((s,i)=>{ const nx=shots[i+1]; const dist=nx?Math.round(geoDist([s.lat,s.lng],[nx.lat,nx.lng])):null;
    return `<div class="strk-row"><div class="strk-n">${i+1}</div>
      <select class="strk-club" onchange="RTRACK[${n}][${i}].club=this.value">${clubOpt(s.club)}</select>
      <div class="strk-d">${dist!=null?dist+" m →":"<span style='color:var(--ink-faint)'>Ziel/liegt</span>"}</div>
      <button class="strk-x" onclick="RTRACK[${n}].splice(${i},1);renderShotTrack(${n},window.__strkReopen,STRK.courseName)">✕</button></div>`; }).join("");
  window.__strkReopen=reopen;
  const mapBlock = sv ? `<div id="strkSvg" style="position:relative">${sv.svg}
      <div class="zoombtns">

      </div></div>
      <p class="note" style="margin:6px 2px 0">Tippe auf die Karte, um einen Schlag einzuzeichnen. Punkte ziehen zum Verschieben, zwei Finger zum Zoomen. Die Distanz steht an der Flugbahn.</p>`
    : `<p class="note">Für das Einzeichnen auf der Bahn importiere die OSM-Geodaten des Platzes (Plätze → Karte). Ohne Karte kannst du Schläge per GPS aufzeichnen.</p>`;
  const h=`<h2>🎯 Schläge · Loch ${n}</h2>
    <div class="sub">Automatisch per GPS oder manuell auf der Karte einzeichnen – wird der Runde/dem Loch zugeordnet.</div>
    ${mapBlock}
    <button class="btn" id="strkAdd" style="margin:12px 0 4px">📍 Ball hier aufzeichnen (GPS)</button>
    <div class="r-s" style="margin:2px 2px 10px">${shotCount(shots)} Schlag${shotCount(shots)===1?"":"e"} · ${shots.length} Punkt${shots.length===1?"":"e"} (Punkt 1 = Abschlag, jeder weitere Punkt = wo der Ball landet).</div>
    <div id="strkList">${rows||'<div class="r-s">Noch keine Schläge – tippe auf die Karte oder nutze GPS.</div>'}</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn ghost" id="strkUndo" style="flex:1">↶ Letzten</button>
      <button class="btn ghost" id="strkClear" style="flex:1">Alle löschen</button>
    </div>
    <button class="btn" id="strkDone" style="margin-top:12px">Fertig – zurück zur Runde</button>`;
  openSheet(h);
  const svg=document.querySelector("#strkSvg svg");
  if(svg){ svg.style.touchAction="none"; strkApplyView();
    svg.addEventListener("pointerdown",strkDown); svg.addEventListener("pointermove",strkMove);
    svg.addEventListener("pointerup",strkUp); svg.addEventListener("pointercancel",strkUp);

  $("#strkClear").onclick=()=>{ if(RTRACK[n]&&RTRACK[n].length&&confirm("Alle Schläge dieses Lochs löschen?")){ RTRACK[n]=[]; renderShotTrack(n,reopen,courseName); } };
  $("#strkDone").onclick=()=>reopen();
}
function strkVB(cx,cy,svg){ const M=STRK.M, r=svg.getBoundingClientRect(), v=STRK.view||{x:0,y:0,w:M.W,h:M.H};
  return [v.x+(cx-r.left)/r.width*v.w, v.y+(cy-r.top)/r.height*v.h]; }
function strkLL(vx,vy){ const M=STRK.M; const qx=(vx-M.pad)/M.s+M.minX, qy=M.maxY-(vy-M.pad)/M.s;
  return [ +(M.center[0]+qy/110540).toFixed(6), +(M.center[1]+qx/(Math.cos(M.center[0]*Math.PI/180)*111320)).toFixed(6) ]; }
function strkApplyView(){ const svg=document.querySelector("#strkSvg svg"); if(svg&&STRK.view) svg.setAttribute("viewBox",`${STRK.view.x} ${STRK.view.y} ${STRK.view.w} ${STRK.view.h}`); }
function strkZoomAt(f,cx,cy){ const M=STRK.M,v=STRK.view; if(!v) return; const minW=Math.max(40,M.W*0.12);
  let w=Math.min(M.W,Math.max(minW,v.w*f)), h=w*(M.H/M.W);
  let x=cx-(cx-v.x)*(w/v.w), y=cy-(cy-v.y)*(h/v.h);
  x=Math.max(0,Math.min(M.W-w,x)); y=Math.max(0,Math.min(M.H-h,y)); STRK.view={x,y,w,h}; strkApplyView(); }
function strkZoomBtn(f){ const v=STRK.view; if(v) strkZoomAt(f, v.x+v.w/2, v.y+v.h/2); }
function strkResetView(){ const M=STRK.M; if(M){ STRK.view={x:0,y:0,w:M.W,h:M.H}; strkApplyView(); } }
function strkDown(e){
  STRK.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); const svg=e.currentTarget;
  if(STRK.ptrs.size===2){ STRK.drag=null; const [a,b]=[...STRK.ptrs.values()];
    STRK.pinch={dist:Math.hypot(a.x-b.x,a.y-b.y)||1, view:{...STRK.view}, mid:strkVB((a.x+b.x)/2,(a.y+b.y)/2,svg)}; STRK.lastPinch=Date.now(); return; }
  if(STRK.pinch) return;
  const g=e.target.closest && e.target.closest("[data-shot]"); if(!g) return;
  const sv=strkVB(e.clientX,e.clientY,svg);
  STRK.drag={i:+g.dataset.shot, el:g, bx:+g.dataset.cx, by:+g.dataset.cy, sx:sv[0], sy:sv[1], moved:false};
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
}
function strkMove(e){
  if(STRK.ptrs.has(e.pointerId)) STRK.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(STRK.pinch && STRK.ptrs.size>=2){ const svg=e.currentTarget, r=svg.getBoundingClientRect(), [a,b]=[...STRK.ptrs.values()];
    const dist=Math.hypot(a.x-b.x,a.y-b.y)||1, M=STRK.M, p0=STRK.pinch, minW=Math.max(40,M.W*0.12);
    let w=Math.min(M.W,Math.max(minW,p0.view.w*(p0.dist/dist))), h=w*(M.H/M.W);
    const fx=((a.x+b.x)/2-r.left)/r.width, fy=((a.y+b.y)/2-r.top)/r.height;
    let x=p0.mid[0]-fx*w, y=p0.mid[1]-fy*h; x=Math.max(0,Math.min(M.W-w,x)); y=Math.max(0,Math.min(M.H-h,y));
    STRK.view={x,y,w,h}; STRK.lastPinch=Date.now(); strkApplyView(); return; }
  if(!STRK.drag) return; const svg=e.currentTarget; const v=strkVB(e.clientX,e.clientY,svg);
  const dx=v[0]-STRK.drag.sx, dy=v[1]-STRK.drag.sy; if(Math.abs(dx)+Math.abs(dy)>2) STRK.drag.moved=true;
  STRK.drag.el.setAttribute("transform",`translate(${dx.toFixed(1)} ${dy.toFixed(1)})`);
}
function strkUp(e){
  STRK.ptrs.delete(e.pointerId);
  if(STRK.pinch){ if(STRK.ptrs.size<2) STRK.pinch=null; STRK.lastPinch=Date.now(); return; }
  if(!STRK.drag) return; const svg=e.currentTarget;
  if(STRK.drag.moved){ const v=strkVB(e.clientX,e.clientY,svg); const dx=v[0]-STRK.drag.sx, dy=v[1]-STRK.drag.sy;
    const ll=strkLL(STRK.drag.bx+dx, STRK.drag.by+dy); const s=RTRACK[STRK.n][STRK.drag.i];
    if(s){ s.lat=ll[0]; s.lng=ll[1]; } STRK.drag=null; renderShotTrack(STRK.n,STRK.reopen,STRK.courseName); return; }
  STRK.drag.el.removeAttribute("transform"); STRK.drag=null;
}
function strkClick(e){
  if(STRK.drag) return;
  if(STRK.lastPinch && Date.now()-STRK.lastPinch<350) return;
  if(STRK.ptrs && STRK.ptrs.size>0) return;
  if(e.target.closest && e.target.closest("[data-shot]")) return;   // auf Punkt -> kein neuer
  const svg=e.currentTarget; if(!STRK.M) return;
  const ll=strkLL(...strkVB(e.clientX,e.clientY,svg));
  if(!RTRACK[STRK.n]) RTRACK[STRK.n]=[];
  RTRACK[STRK.n].push({lat:ll[0], lng:ll[1], club:""});
  renderShotTrack(STRK.n, STRK.reopen, STRK.courseName);
}
function shotTrackAdd(n, reopen, courseName){
  if(!navigator.geolocation){ toast("GPS nicht verfügbar"); return; }
  toast("Ortung…");
  navigator.geolocation.getCurrentPosition(p=>{
    if(!RTRACK[n]) RTRACK[n]=[];
    RTRACK[n].push({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), club:""});
    toast("Schlag "+RTRACK[n].length+" aufgezeichnet");
    renderShotTrack(n, reopen, courseName);
  }, e=>toast("Ortung fehlgeschlagen"), {enableHighAccuracy:true,timeout:10000,maximumAge:1000});
}

function openRoundShots(id){

  <button class="btn ghost" id="expCourse" style="margin-bottom:10px">⬇️ Platz + Karte exportieren</button>`:`<p class="note" style="margin:-6px 0 12px">Gefahren je Loch und OSM-Platzkarte kannst du nach dem Anlegen ergänzen.</p>`}
  <button class="btn" id="saveCourse">${isNew?"Platz anlegen":"Änderungen speichern"}</button>
  ${!isNew?`<button class="btn warn" id="delCourse" style="margin-top:10px">Platz löschen</button>`:""}`;
  openSheet(h);
  $("#saveCourse").onclick=()=>{
    const name=$("#c_name").value.trim(), tee=$("#c_tee").value.trim()||"Gelb";
    if(!name){ toast("Bitte Platzname"); return; }
    const holes=[]; for(let n=1;n<=18;n++){
      holes.push({hole:n, par:parseInt($(`.ch-par[data-h="${n}"]`).value), si:num($(`.ch-si[data-h="${n}"]`).value), len:num($(`.ch-len[data-h="${n}"]`).value)});
    }
    const crF=num($("#cr_f").value),slF=num($("#sl_f").value),paF=num($("#pa_f").value);
    const crB=num($("#cr_b").value),slB=num($("#sl_b").value),paB=num($("#pa_b").value);
    const sides={}; if(crF!=null) sides["Front 9"]={cr:crF,slope:slF,par:paF};
    if(crB!=null) sides["Back 9"]={cr:crB,slope:slB,par:paB};
    const cr18=(crF||0)+(crB||0), par18=(paF||0)+(paB||0);
    const slope18=(crF||crB)?Math.round(((crF||0)*(slF||0)+(crB||0)*(slB||0))/((crF||0)+(crB||0))):null;
    const teeObj={sides,cr18:+cr18.toFixed(1),slope18,par18,holes};
    const obj={name,tees:{[tee]:teeObj}};
    if(isNew){ if(DB.courses.some(c=>c.name===name)){ toast("Platz existiert schon"); return; } DB.courses.push(obj); }
    else {
      // preserve other tees
      const existing=DB.courses[idx]; existing.name=name; existing.tees[tee]=teeObj;
    }
    persist(); closeSheet(); renderAll(); toast(isNew?"Platz angelegt":"Platz gespeichert");
  };
  if(!isNew) $("#delCourse").onclick=()=>{ if(confirm("Platz löschen?")){ DB.courses.splice(idx,1); persist(); closeSheet(); renderAll(); toast("Gelöscht"); }};
  if(!isNew) $("#editTrouble").onclick=()=>openTroubleEditor(idx);
  if(!isNew) $("#openMap").onclick=()=>openCourseMap(idx);
  if(!isNew) $("#expCourse").onclick=()=>exportCourse(idx);
}

let MAPST={idx:null, hole:null, here:null, live:false, M:null};

function renderGeoImport(idx){
  const c=DB.courses[idx];
  const q=`[out:json][timeout:90];\n{{geocodeArea:"${c.name}"}}->.a;\n(\n  nwr["golf"](area.a);\n  nwr["natural"="water"](area.a);\n  nwr["natural"="wood"](area.a);\n  nwr["landuse"="forest"](area.a);\n  nwr["natural"="tree"](area.a);\n  nwr["natural"="tree_row"](area.a);\n  nwr["natural"="scrub"](area.a);\n  nwr["barrier"="hedge"](area.a);\n);\nout geom;`;
  const ta="width:100%;padding:9px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);box-sizing:border-box";
  const h=`<h2>OSM-Geodaten · ${esc(c.name)}</h2>
    <div class="sub">Flächen einmal von OpenStreetMap holen – danach offline gespeichert.</div>
    <div class="card pad" style="margin-bottom:12px">
      <b style="font-size:13px">Weg A · direkt laden</b>

      <div id="geoFetchMsg" class="r-s" style="margin-top:8px"></div>
    </div>

      <textarea readonly rows="6" style="${ta};font-family:var(--mono);font-size:11px">${esc(q)}</textarea>
      <input type="file" id="geoFile" accept=".geojson,.json,application/json" style="margin:10px 0 8px">
      <textarea id="geoPaste" rows="4" placeholder="…oder GeoJSON hier einfügen" style="${ta}"></textarea>

  $("#geoImport").onclick=()=>{ const t=$("#geoPaste").value.trim(); t?geoImportText(idx,t):toast("Bitte GeoJSON einfügen"); };
}

function geoImportText(idx,text){
  let data; try{ data=JSON.parse(text); }catch(e){ toast("Kein gültiges JSON"); return; }
  let geo; try{
    if(data && data.type==="FeatureCollection") geo=parseGeoJSONCourse(data);
    else if(data && Array.isArray(data.elements)) geo=parseOverpassCourse(data);
    else { toast("Weder GeoJSON noch Overpass-JSON"); return; }
  }catch(e){ toast(e.message||"Import fehlgeschlagen"); return; }
  const prev=DB.courses[idx].geo; if(prev){ if(prev.mine && prev.mine.length) geo.mine=prev.mine;
    if(prev.overrides && prev.overrides.holes && Object.keys(prev.overrides.holes).length){ geo.overrides=prev.overrides; applyGeoOverrides(geo); } }
  DB.courses[idx].geo=geo; persist();
  toast(`Import: ${geo.stats.greens} Grüns · ${geo.stats.bunkers} Bunker · ${geo.stats.holesMapped} Löcher`);
  renderCourseMap(idx);
}

async function geoFetchOSM(idx){
  const c=DB.courses[idx], msg=$("#geoFetchMsg");
  const set=t=>{ if(msg) msg.textContent=t; };
  try{
    set("Suche Platz…");
    const nom=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(c.name+" Golf")}&format=json&limit=1`);
    const nj=await nom.json();
    if(!nj.length){ set("Platz nicht gefunden – nimm Weg B (GeoJSON)."); return; }
    const [s,n,w,e]=nj[0].boundingbox;
    set("Lade Flächen von OpenStreetMap…");
    const query=`[out:json][timeout:90];(nwr["golf"](${s},${w},${n},${e});nwr["natural"="water"](${s},${w},${n},${e});nwr["natural"="wood"](${s},${w},${n},${e});nwr["landuse"="forest"](${s},${w},${n},${e});nwr["natural"="tree"](${s},${w},${n},${e});nwr["natural"="tree_row"](${s},${w},${n},${e});nwr["natural"="scrub"](${s},${w},${n},${e});nwr["barrier"="hedge"](${s},${w},${n},${e}););out geom;`;
    const ov=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(query)});
    const oj=await ov.json();
    const geo=parseOverpassCourse(oj);
    const prev=DB.courses[idx].geo; if(prev){ if(prev.mine && prev.mine.length) geo.mine=prev.mine;
      if(prev.overrides && prev.overrides.holes && Object.keys(prev.overrides.holes).length){ geo.overrides=prev.overrides; applyGeoOverrides(geo); } }
    DB.courses[idx].geo=geo; persist();
    toast(`Geladen: ${geo.stats.greens} Grüns · ${geo.stats.holesMapped} Löcher`);
    renderCourseMap(idx);
  }catch(err){ set("Laden fehlgeschlagen (offline oder blockiert) – nimm Weg B."); }
}

function mapSelHole(n){ MAPST.hole=(String(MAPST.hole)===String(n))?null:n; renderCourseMap(MAPST.idx); }

function mapToggleLive(idx){
  if(MAPST.live){ MAPST.live=false; liveStop(); renderCourseMap(idx); return; }
  if(!navigator.geolocation){ toast("GPS nicht verfügbar"); return; }
  MAPST.live=true; toast("Live-Position an…");
  liveStart(pos=>{
    if(!document.getElementById("mLive")){ liveStop(); MAPST.live=false; return; }   // Kartenansicht verlassen
    const first=!MAPST.here; MAPST.here=pos;
    const dot=document.getElementById("hereDot");
    if(first || !dot || !MAPST.M){ renderCourseMap(idx); return; }   // Marker erstmalig einblenden
    const q=MAPST.M.map(pos[0],pos[1]);

    const ld=document.getElementById("liveDist");
    if(ld && MAPST.hole){ const g=DB.courses[idx].geo.holes[MAPST.hole]; if(g&&g.green) ld.textContent=Math.round(geoDist(pos,g.green))+" m"; }
  });
}

function mapAddPoint(idx){

/* ================= CADDY AB POSITION (Phase 2) ================= */
const LIE_F={fairway:1.0, rough:0.9, highrough:0.78, bunker:0.72, recovery:0.58};
const LIE_LAB={fairway:"Fairway", rough:"Rough", highrough:"Hohes Rough", bunker:"Fairwaybunker", recovery:"Recovery / blockiert"};
function lieAt(geo, here){
  if(!geo||!here) return null;
  const inK=k=>((geo.features||[]).some(f=>f.kind===k&&f.ring&&pointInRing(here,f.ring)) || (geo.mine||[]).some(m=>m.kind===k&&m.ring&&pointInRing(here,m.ring)));
  if(inK("bunker")) return "bunker";
  if(inK("wood")) return "recovery";
  if(inK("highrough")) return "highrough";
  if(inK("fairway")) return "fairway";
  if(inK("rough")||inK("scrub")) return "rough";
  return null;
}
function ringsOn(){ return !(DB.ui && DB.ui.rings===false); }
function toggleRings(){ DB.ui=DB.ui||{}; DB.ui.rings=!ringsOn(); persist(); }

function caddyPositionPlan(inp){
  const {remaining, par, lie, mode, ctx, hazards} = inp;
  const clubs=ctx.clubs; if(!clubs||!clubs.length||!remaining) return null;
  const lf=LIE_F[lie]||1.0; const eff=c=>c.dist*lf;
  const modeName = mode==="safe"?"Sicher":mode==="aggr"?"Offensiv":"Ausgewogen";
  const smallestReach=t=>{ let b=null; clubs.forEach(c=>{ if(eff(c)>=t && (!b||eff(c)<eff(b))) b=c; }); return b||clubs[0]; };
  const largestUnder=t=>{ let b=null; clubs.forEach(c=>{ if(eff(c)<=t && (!b||eff(c)>eff(b))) b=c; }); return b||clubs[clubs.length-1]; };
  const nearest=t=>clubs.reduce((b,c)=>Math.abs(eff(c)-t)<Math.abs(eff(b)-t)?c:b, clubs[0]);
  const carry=(hazards||[]).filter(h=>(h.kind==="water"||h.kind==="penalty"||h.kind==="wood") && h.near<remaining-1).sort((a,b)=>a.near-b.near)[0];
  const hazLab = (carry&&carry.kind==="penalty")?"Penaltybereich":(carry&&carry.kind==="wood")?"Wald":"Wasser";
  const treeHaz=(hazards||[]).filter(h=>h.kind==="tree" && h.near>3 && h.near<remaining-1).sort((a,b)=>a.near-b.near);
  const ob=(hazards||[]).filter(h=>(h.kind==="ob"||h.kind==="building") && h.near<remaining-1).sort((a,b)=>a.near-b.near)[0];
  const bunkers=(hazards||[]).filter(h=>h.kind==="bunker" && h.far>3 && h.near<remaining+8).sort((a,b)=>a.near-b.near);
  const bunkerAt=d=>bunkers.find(b=> d>=b.near-4 && d<=b.far+4);
  const landClearUnder=limit=>{ let best=null; clubs.forEach(c=>{ const d=eff(c); if(d<=limit && !bunkerAt(d) && (!best||d>eff(best))) best=c; }); return best; };
  const frontBunker=bunkers.find(b=> b.near<remaining-3 && b.far>=remaining-16 && b.far<=remaining+6);
  const tags=new Set([LIE_LAB[lie]]); if(mode!=="bal") tags.add(modeName);
  const shots=[]; let finalLeft=remaining, alt=null, headline="", carryNote=null;

  // ---- Recovery: raus in Sicherheit ----
  if(lie==="recovery"){
    const tgt=Math.max(60, Math.min(remaining-20, 120));
    const club=nearest(tgt);
    shots.push({tone:"warn",role:"Zurück ins Spiel",club:club.name,dist:Math.round(eff(club))+" m",
      why:`Kein Grün-Angriff. Kontrolliert zurück aufs Fairway — von hier ist Bogey ein guter Score, ein zweiter Fehler kostet doppelt.`});
    finalLeft=Math.max(0, Math.round(remaining-eff(club)));
    tags.add("Schadensbegrenzung");
    headline=_short(club.name)+" · sicher raus";
    return finalize();
  }
  if(lie!=="fairway") tags.add(LIE_LAB[lie]+" eingerechnet");

  if(ob){
    const layT=ob.near-12; const naive=largestUnder(layT);
    const lc=(bunkerAt(eff(naive))?(landClearUnder(layT)||naive):naive);
    const left=remaining-eff(lc), ap=nearest(left);
    const isBld=ob.kind==="building";
    shots.push({tone:"warn",role:isBld?"Layup vor Gebäude":"Layup vor OB",club:lc.name,dist:Math.round(eff(lc))+" m",
      why:`${isBld?"Ein <b>Gebäude</b> steht":"<b>Out of Bounds</b> quert"} bei ~${Math.round(ob.near)} m — nicht anspielbar. ${_short(lc.name)} legt sicher davor ab.`});
    shots.push({tone:"go",role:"Grün",club:ap.name,dist:Math.round(left)+" m",why:`Lässt ${Math.round(left)} m ins Grün.`});
    finalLeft=left; tags.add(isBld?"Gebäude gemieden":"OB gemieden");
    headline=shots.map(s=>_short(s.club)).join(" → "); carryNote={near:Math.round(ob.near),far:Math.round(ob.near),ob:true};
    return finalize();
  }

  if(carry){
    carryNote={near:Math.round(carry.near), far:Math.round(carry.far), kind:carry.kind};
    const clearClub=smallestReach(carry.far+6);
    const reachGreen=smallestReach(remaining);
    const canClear = eff(clearClub)>=carry.far+6;
    const goForIt = canClear && (mode==="aggr" || (mode==="bal" && eff(reachGreen)>=carry.far+6 && (carry.far-carry.near)<22));
    if(goForIt){
      if(eff(reachGreen)>=carry.far+6){
        shots.push({tone:"go",role:"Grün",club:reachGreen.name,dist:remaining+" m",
          why:`Trägt über ${hazLab==="Wasser"?"das Wasser":"den Penaltybereich"} (Carry ~${Math.round(carry.far)} m) und erreicht die Grünmitte. ${modeName}: Angriff.`});
        finalLeft=0;
      } else {
        const land=Math.round(eff(clearClub));
        shots.push({tone:"go",role:"Über die Gefahr",club:clearClub.name,dist:land+" m",
          why:`Trägt sicher über die Kante (Carry ~${Math.round(carry.far)} m), landet bei ~${land} m.`});
        const left=remaining-eff(clearClub); const ap=nearest(left);
        shots.push({tone:"go",role:"Grün",club:ap.name,dist:Math.round(left)+" m",why:`Rest in die Grünmitte.`});
        finalLeft=left;
      }
      tags.add(hazLab+"-Carry "+Math.round(carry.far)+" m");
      const layT=carry.near-12, lc=largestUnder(layT);
      alt={lab:"Sicherer", txt:`${_short(lc.name)} legt vor ${hazLab==="Wasser"?"dem Wasser":"dem Penaltybereich"} ab (~${Math.round(eff(lc))} m), lässt ${Math.round(remaining-eff(lc))} m.`};
    } else {
      const layT=carry.near-12; const naive=largestUnder(layT);
      const lc=(bunkerAt(eff(naive))?(landClearUnder(layT)||naive):naive); const land=Math.round(eff(lc));
      const bAvoid=bunkerAt(eff(naive)) && !bunkerAt(eff(lc));
      const left=remaining-eff(lc); const ap=nearest(left);
      shots.push({tone:"pos",role:"Layup",club:lc.name,dist:land+" m",
        why:`${hazLab} quert bei <b>${Math.round(carry.near)}–${Math.round(carry.far)} m</b>. ${modeName}: davor ablegen — ${_short(lc.name)} bis ~${land} m.${bAvoid?" Fairwaybunker gemieden.":""}`});
      shots.push({tone:"go",role:"Grün",club:ap.name,dist:Math.round(left)+" m",
        why:`Lässt <b>${Math.round(left)} m</b> ins Grün${(left>=85&&left<=120)?" — volle Wedge-Zahl":""}.`});
      finalLeft=left; tags.add(hazLab+" gemieden"); if(bAvoid) tags.add("Fairwaybunker gemieden"); if(left>=85&&left<=120) tags.add("Volle Wedge-Zahl");
      if(canClear) alt={lab:"Wenn du angreifst", txt:`${_short(clearClub.name)} trägt über die Gefahr (Carry ~${Math.round(carry.far)} m) — höheres Risiko.`};
    }
    headline=shots.map(s=>_short(s.club)).join(" → ");
    return finalize();
  }

  // ---- kein Wasser im Weg ----
  const target=(inp.plays!=null?inp.plays:remaining);
  const playsDiff = inp.plays!=null && Math.abs(inp.plays-remaining)>=4;
  const reach=smallestReach(target);
  if(clubs.some(c=>eff(c)>=remaining) || eff(reach)>=target){
    const awkward = target<eff(reach)-8;
    if(frontBunker) tags.add("Bunker vor Grün");
    if(playsDiff) tags.add("spielt wie "+target+" m");
    shots.push({tone:"go",role:"Grün",club:reach.name,dist:remaining+" m",
      why:`${remaining} m in die Grünmitte${playsDiff?` — bei Wind/Temperatur spielt es wie <b>${target} m</b>, daher ${_short(reach.name)}`:""}${lie!=="fairway"?` (${LIE_LAB[lie]} eingerechnet)`:""}.${awkward&&!playsDiff?` Etwas weniger als voll — kontrolliert schwingen.`:""}${frontBunker?` Bunker vor dem Grün (${Math.round(frontBunker.near)}–${Math.round(frontBunker.far)} m) — genug Schläger, nicht kurz.`:""} Zentrum, nicht Fahne.`});
    finalLeft=0;
  } else {
    const naive=clubs[0]; const club=(bunkerAt(eff(naive))?(landClearUnder(remaining)||naive):naive);
    const bAvoid=bunkerAt(eff(naive)) && !bunkerAt(eff(club));
    const left=remaining-eff(club);
    shots.push({tone:"pos",role:"Vorlegen",club:club.name,dist:Math.round(eff(club))+" m",
      why:`Zu weit fürs Grün — ${_short(club.name)} bringt dich ~${Math.round(eff(club))} m voran, lässt ${Math.round(left)} m.${bAvoid?" Fairwaybunker gemieden.":""}`});
    const ap=nearest(left);
    shots.push({tone:"go",role:"Grün",club:ap.name,dist:Math.round(left)+" m",why:`Rest in die Grünmitte.`});
    finalLeft=left; tags.add("Positionierung"); if(bAvoid) tags.add("Fairwaybunker gemieden");
  }
  headline=shots.map(s=>_short(s.club)).join(" → ");
  return finalize();

  function finalize(){
    if(treeHaz.length) tags.add("🌳 Baum bei ~"+Math.round(treeHaz[0].near)+" m");
    const s=approachStrength(finalLeft);
    const chance = finalLeft<=0?"aufs Grün" : s>=85?"volles Wedge · gute GIR-Chance":s>=72?"gute Grün-Chance":s>=58?"solide Position":"schwierige Distanz";
    return { shots, tags:[...tags], alt,
      expect:{ n:(finalLeft>0?Math.round(finalLeft)+" m":"–"), l:(finalLeft>0?"Rest ins Grün":"direkt aufs Grün"), chance },
      headline, carryNote };
  }
}

function cpToggleLive(){
  if(CADDYPOS.live){ CADDYPOS.live=false; liveStop(); renderCaddyPosition(); return; }
  if(!navigator.geolocation){ toast("GPS nicht verfügbar"); return; }
  CADDYPOS.live=true; renderCaddyPosition(); toast("Live-Tracking an – geh zum Ball");
  let last=null;
  liveStart(pos=>{
    if(!document.getElementById("cpLive")){ liveStop(); CADDYPOS.live=false; return; }   // Ansicht verlassen
    if(last && geoDist(last,pos)<2) return; last=pos;
    CADDYPOS.here=pos; CADDYPOS.manual=false;
    const geo=cpGeo();
    if(geo && geo.holes[CADDYPOS.hole] && geo.holes[CADDYPOS.hole].green)
      CADDYPOS.remaining=Math.round(geoDist(pos, geo.holes[CADDYPOS.hole].green));
    cpRenderBody();
  });
}

function cpManual(){ const v=parseInt((document.getElementById("cp_manual")||{}).value); if(!v||v<5){ toast("Distanz eingeben"); return; }
  CADDYPOS.remaining=v; CADDYPOS.manual=true; CADDYPOS.here=null; renderCaddyPosition(); }
function cpLocate(){
  if(!navigator.geolocation){ toast("GPS nicht verfügbar — Distanz eintippen"); return; }
  toast("Ortung…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const here=[pos.coords.latitude,pos.coords.longitude]; CADDYPOS.here=here; CADDYPOS.manual=false;
    const geo=cpGeo();
    if(geo && geo.holes[CADDYPOS.hole] && geo.holes[CADDYPOS.hole].green){
      // ggf. Loch automatisch korrigieren, falls weit weg
      const nh=nearestHole(geo, here);
      if(nh && nh.hole!==CADDYPOS.hole && geo.holes[nh.hole].green){
        const dSel=Math.round(geoDist(here,geo.holes[CADDYPOS.hole].green));
        if(nh.dist < dSel-40){ CADDYPOS.hole=nh.hole; toast("Näher an Loch "+nh.hole+" – umgestellt"); }
      }
      CADDYPOS.remaining=Math.round(geoDist(here, geo.holes[CADDYPOS.hole].green));
    } else { toast("Keine Grün-Geodaten – Distanz eintippen"); }
    renderCaddyPosition();
  }, e=>toast("Ortung fehlgeschlagen — Distanz eintippen"), {enableHighAccuracy:true,timeout:10000,maximumAge:1500});
}

function geoEdVB(cx,cy,svg){ const M=GEOED.M, r=svg.getBoundingClientRect(); const v=GEOED.view||{x:0,y:0,w:M.W,h:M.H};
  return [v.x+(cx-r.left)/r.width*v.w, v.y+(cy-r.top)/r.height*v.h]; }
function llFromVB(vx,vy){ const M=GEOED.M;
  const qx=(vx-M.pad)/M.s+M.minX, qy=M.maxY-(vy-M.pad)/M.s;
  return roundLL([M.center[0]+qy/110540, M.center[1]+qx/(Math.cos(M.center[0]*Math.PI/180)*111320)]); }
function geoEdLL(cx,cy,svg){ const v=geoEdVB(cx,cy,svg); return llFromVB(v[0],v[1]); }
function geoEdApplyView(){ const svg=document.querySelector("#geoedSvg svg"); if(svg&&GEOED.view) svg.setAttribute("viewBox",`${GEOED.view.x} ${GEOED.view.y} ${GEOED.view.w} ${GEOED.view.h}`); }
function geoEdZoomAt(factor,cx,cy){ const M=GEOED.M,v=GEOED.view; if(!v) return;
  const minW=Math.max(40,M.W*0.12);
  let w=Math.min(M.W,Math.max(minW,v.w*factor)), h=w*(M.H/M.W);
  let x=cx-(cx-v.x)*(w/v.w), y=cy-(cy-v.y)*(h/v.h);
  x=Math.max(0,Math.min(M.W-w,x)); y=Math.max(0,Math.min(M.H-h,y));
  GEOED.view={x,y,w,h}; geoEdApplyView(); }
function geoEdZoomBtn(f){ const v=GEOED.view; if(v) geoEdZoomAt(f, v.x+v.w/2, v.y+v.h/2); }
function geoEdResetView(){ const M=GEOED.M; GEOED.view={x:0,y:0,w:M.W,h:M.H}; geoEdApplyView(); }

function geoEdTool(t){ GEOED.tool=t; GEOED.draw = (t==="area"||t==="line")?{pts:[]}:null; renderGeoEditor(); }

function geoEdDown(e){
  GEOED.ptrs=GEOED.ptrs||new Map(); GEOED.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const svg=e.currentTarget;
  if(GEOED.ptrs.size===2){                                  // Pinch/Pan starten
    GDRAG=null; const [a,b]=[...GEOED.ptrs.values()];
    GEOED.pinch={dist:Math.hypot(a.x-b.x,a.y-b.y)||1, view:{...GEOED.view}, mid:geoEdVB((a.x+b.x)/2,(a.y+b.y)/2,svg)};
    GEOED.lastPinch=Date.now(); return;
  }
  if(GEOED.pinch) return;
  if(GEOED.tool==="area"||GEOED.tool==="line") return;      // beim Zeichnen kein Ziehen
  const g=e.target.closest && e.target.closest("[data-drag]"); if(!g) return;
  const sv=geoEdVB(e.clientX,e.clientY,svg);
  GDRAG={spec:g.dataset.drag, el:g, bx:+g.dataset.cx||0, by:+g.dataset.cy||0, sx:sv[0], sy:sv[1], moved:false};
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
}
function geoEdMove(e){
  if(GEOED.ptrs && GEOED.ptrs.has(e.pointerId)) GEOED.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(GEOED.pinch && GEOED.ptrs && GEOED.ptrs.size>=2){       // Pinch/Pan
    const svg=e.currentTarget, r=svg.getBoundingClientRect(), [a,b]=[...GEOED.ptrs.values()];
    const dist=Math.hypot(a.x-b.x,a.y-b.y)||1, M=GEOED.M, p0=GEOED.pinch, minW=Math.max(40,M.W*0.12);
    let w=Math.min(M.W,Math.max(minW, p0.view.w*(p0.dist/dist))), h=w*(M.H/M.W);
    const fx=((a.x+b.x)/2-r.left)/r.width, fy=((a.y+b.y)/2-r.top)/r.height;
    let x=p0.mid[0]-fx*w, y=p0.mid[1]-fy*h;
    x=Math.max(0,Math.min(M.W-w,x)); y=Math.max(0,Math.min(M.H-h,y));
    GEOED.view={x,y,w,h}; GEOED.lastPinch=Date.now(); geoEdApplyView(); return;
  }
  if(!GDRAG) return; const svg=e.currentTarget; const v=geoEdVB(e.clientX,e.clientY,svg);
  const dx=v[0]-GDRAG.sx, dy=v[1]-GDRAG.sy; if(Math.abs(dx)+Math.abs(dy)>2) GDRAG.moved=true;
  GDRAG.el.setAttribute("transform",`translate(${dx.toFixed(1)} ${dy.toFixed(1)})`);
}
function geoEdUp(e){
  if(GEOED.ptrs) GEOED.ptrs.delete(e.pointerId);
  if(GEOED.pinch){ if(!GEOED.ptrs||GEOED.ptrs.size<2) GEOED.pinch=null; GEOED.lastPinch=Date.now(); return; }
  if(!GDRAG) return; const svg=e.currentTarget;
  if(GDRAG.moved){
    const v=geoEdVB(e.clientX,e.clientY,svg); const dx=v[0]-GDRAG.sx, dy=v[1]-GDRAG.sy;
    const geo=DB.courses[GEOED.idx].geo; const p=GDRAG.spec.split(":"), kind=p[0], key=p[1];
    if(kind==="mine"){ const m=geo.mine[+key]; if(m&&m.pt) m.pt=llFromVB(GDRAG.bx+dx, GDRAG.by+dy); }
    else if(kind==="green"){ const nll=llFromVB(GDRAG.bx+dx, GDRAG.by+dy);
      if(!geo.overrides)geo.overrides={holes:{}}; if(!geo.overrides.holes)geo.overrides.holes={};
      geo.overrides.holes[+key]={green:nll}; applyGeoOverrides(geo); }
    else if(kind==="minearea"){ const m=geo.mine[+key];
      if(m){ const a=llFromVB(GDRAG.sx,GDRAG.sy), b=llFromVB(v[0],v[1]);
        const dLat=b[0]-a[0], dLng=b[1]-a[1];
        if(m.ring) m.ring=m.ring.map(pt=>roundLL([pt[0]+dLat, pt[1]+dLng]));
        if(m.line) m.line=m.line.map(pt=>roundLL([pt[0]+dLat, pt[1]+dLng])); } }
    persist(); gSuppressClick=true; GDRAG=null; toast("Verschoben"); renderGeoEditor(); return;
  }
  GDRAG.el.removeAttribute("transform"); GDRAG=null;
}

function geoEdClick(evt){
  if(gSuppressClick){ gSuppressClick=false; return; }
  if(GDRAG) return;
  if(GEOED.lastPinch && Date.now()-GEOED.lastPinch<350) return;   // kein Setzen direkt nach Zoom/Pan
  if(GEOED.ptrs && GEOED.ptrs.size>0) return;
  const svg=evt.currentTarget; if(!GEOED.M) return;
  const pt=geoEdLL(evt.clientX,evt.clientY,svg);
  const geo=DB.courses[GEOED.idx].geo;
  if(GEOED.tool==="area"||GEOED.tool==="line"){ if(!GEOED.draw) GEOED.draw={pts:[]}; GEOED.draw.pts.push(pt); renderGeoEditor(); return; }
  if(GEOED.tool==="tree"){ if(!geo.mine) geo.mine=[]; geo.mine.push({kind:"tree",pt,own:true,hole:GEOED.hole||null}); persist(); toast("Baum gesetzt"); renderGeoEditor(); return; }
  if(GEOED.tool==="add"){
    const label=prompt("Bezeichnung des Punkts?"); if(label===null) return;
    if(!geo.mine) geo.mine=[]; geo.mine.push({kind:"mine",label:label||"",pt,hole:GEOED.hole||null});
    persist(); toast("Punkt gesetzt"); renderGeoEditor();
  } else if(GEOED.tool==="green"){
    const def=GEOED.hole?String(GEOED.hole):"";
    const nRaw=prompt("Für welches Loch ist dieses Grün? (1–18)", def); if(nRaw===null) return;
    const n=parseInt(nRaw); if(!(n>=1&&n<=18)){ toast("Bitte 1–18"); return; }
    if(!geo.overrides) geo.overrides={holes:{}}; if(!geo.overrides.holes) geo.overrides.holes={};
    geo.overrides.holes[n]={green:pt}; applyGeoOverrides(geo);
    persist(); toast("Grünmitte für Loch "+n+" gesetzt"); renderGeoEditor();
  } else if(GEOED.tool==="del"){
    // Reihenfolge: Fläche (innerhalb) → Linie (nah) → Punkt (nah)
    let ai=-1; (geo.mine||[]).forEach((m,i)=>{ if(ai<0 && m.ring && pointInRing(pt,m.ring)) ai=i; });
    if(ai>=0){ geo.mine.splice(ai,1); persist(); toast("Fläche entfernt"); renderGeoEditor(); return; }
    let li=-1,ld=Infinity; (geo.mine||[]).forEach((m,i)=>{ if(m.line){ for(let k=1;k<m.line.length;k++){ const d=_distPtSeg(pt,m.line[k-1],m.line[k]); if(d<ld){ld=d;li=i;} } }});
    if(li>=0 && ld<18){ geo.mine.splice(li,1); persist(); toast("Linie entfernt"); renderGeoEditor(); return; }
    let bi=-1,bd=Infinity; (geo.mine||[]).forEach((m,i)=>{ if(m.pt){ const d=geoDist(pt,m.pt); if(d<bd){bd=d;bi=i;} }});
    if(bi>=0 && bd<25){ const rm=geo.mine.splice(bi,1)[0]; persist(); toast("Gelöscht: "+(rm.label||"Punkt")); renderGeoEditor(); }
    else toast("Nichts in der Nähe");
  }
}
function _distPtSeg(p,a,b){
  const A=geoProject(a[0],a[1],p[0],p[1]), B=geoProject(b[0],b[1],p[0],p[1]), P={x:0,y:0};
  const dx=B.x-A.x, dy=B.y-A.y, L2=dx*dx+dy*dy; let t=L2?((P.x-A.x)*dx+(P.y-A.y)*dy)/L2:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(A.x+t*dx-P.x, A.y+t*dy-P.y);
}
function geoEdUndoPt(){ if(GEOED.draw&&GEOED.draw.pts.length){ GEOED.draw.pts.pop(); renderGeoEditor(); } }
function geoEdCancelArea(){ GEOED.draw=null; GEOED.tool="add"; renderGeoEditor(); }
function geoEdFinishArea(type){
  const d=GEOED.draw; if(!d||d.pts.length<3){ toast("Mindestens 3 Ecken tippen"); return; }
  const geo=DB.courses[GEOED.idx].geo; if(!geo.mine) geo.mine=[];
  const ring=d.pts.map(roundLL); ring.push(ring[0]);
  geo.mine.push({kind:type, ring, own:true});
  GEOED.draw=null; GEOED.tool="add"; persist();
  const lab={water:"Wasser",penalty:"Penalty",bunker:"Bunker",wood:"Wald",highrough:"Hohes Rough"}[type]||type;
  toast(lab+"-Fläche gespeichert"); renderGeoEditor();
}
function geoEdFinishLine(type){
  const d=GEOED.draw; if(!d||d.pts.length<2){ toast("Mindestens 2 Punkte tippen"); return; }
  const geo=DB.courses[GEOED.idx].geo; if(!geo.mine) geo.mine=[];
  geo.mine.push({kind:type, line:d.pts.map(roundLL), own:true});
  GEOED.draw=null; GEOED.tool="add"; persist();
  toast(({ob:"OB",penalty:"Penalty",hedge:"Hecke"}[type]||type)+(type==="hedge"?" gespeichert":"-Grenze gespeichert")); renderGeoEditor();
}

function exportCourse(idx){

function importCourseFile(file){
  const rd=new FileReader();
  rd.onload=()=>{ let o; try{ o=JSON.parse(rd.result); }catch(e){ toast("Datei nicht lesbar"); return; }
    const c=(o&&o.type==="golftraining-course"&&o.course)?o.course:((o&&o.name&&o.tees)?o:null);
    if(!c){ toast("Keine Platz-Datei"); return; }
    const ex=DB.courses.findIndex(x=>x.name===c.name);

async function cloudLoad(){
  try{
    const res=await fetch(REPO_DATA_URL,{cache:"no-store"}); if(!res.ok) return;
    const d=await res.json(); if(!d||!d.testDefs||!d.tests) return;
    if(JSON.stringify(d)===JSON.stringify(DB)) return; // identisch – nichts zu tun
    const localScore=dataScore(DB), repoScore=dataScore(d);
    const localT=DB.exportedAt||"", repoT=d.exportedAt||"";
    const repoNewer = repoScore>localScore || (repoT&&localT&&repoT>localT) || (repoT&&!localT);
    if(repoScore>=localScore-2 && repoNewer){
      snapshot("Vor Repo-Laden", true);
      DB=d; saveLocal(); markSaved(); setSync("ok"); renderAll(); setView(current||"heute");
      toast("Aktueller Stand aus dem Repository geladen");
    } else if(localScore>repoScore+2){
      toast("Lokaler Stand ist neuer als das Repository – bitte speichern");
    }
  }catch(e){ /* offline o. Ä. – lokal weiterarbeiten */ }
}
async function cloudLoadManual(){
  try{
    const res=await fetch(REPO_DATA_URL,{cache:"no-store"}); if(!res.ok){ toast("Repo nicht erreichbar"); return; }
    const d=await res.json(); if(!d||!d.testDefs||!d.tests){ toast("Repo-Datei ungültig"); return; }
    const rs=dataScore(d), ls=dataScore(DB);
    if(!confirm("Stand aus dem Repo laden?\n\nRepo: "+rs+" · Lokal: "+ls+" gewichtete Einträge.\nDein aktueller lokaler Stand wird zuvor gesichert.")) return;
    snapshot("Vor Repo-Laden (manuell)", true);
    DB=d; saveLocal(); markSaved(); setSync("ok"); renderAll(); setView(current||"heute");
    toast("Aus Repo geladen");
  }catch(e){ toast("Laden fehlgeschlagen"); }
}

/* ---------- In Repo speichern (über sicheren Worker-Proxy) ---------- */
function cloudCfg(){ return { url:(localStorage.getItem("golfdb_workerUrl")||"").trim(), key:(localStorage.getItem("golfdb_writeKey")||""), auto:localStorage.getItem("golfdb_cloudAuto")==="1" }; }
function cloudConfigured(){ const c=cloudCfg(); return !!(c.url&&c.key); }
let cloudTimer=null, cloudBusy=false;
function scheduleCloudSync(){ const c=cloudCfg(); if(!c.auto||!cloudConfigured())return; clearTimeout(cloudTimer); cloudTimer=setTimeout(()=>cloudSave(true),8000); }
async function cloudSave(silent, force){
  const c=cloudCfg();
  if(!cloudConfigured()){ toast("Bitte Worker-URL und Passwort unter Mehr → Daten eintragen"); return; }
  if(cloudBusy) return; cloudBusy=true; setSync("syncing");
  try{
    const locScore=dataScore(DB);
    // Schutz 1: fast leeren Stand (z. B. nach Reset) NIE automatisch ins Repo schreiben
    if(!force && locScore<5){ toast("🛡 Sicherung: fast leerer Stand wird nicht ins Repo geschrieben."); setSync("blocked"); return; }
    // Schutz 2: Repo nicht mit deutlich kleinerem/älterem Stand überschreiben
    if(!force){
      try{
        const rr=await fetch(REPO_DATA_URL,{cache:"no-store"});
        if(rr.ok){ const repo=await rr.json();
          if(repo && repo.testDefs){
            const repoScore=dataScore(repo);
            const repoT=repo.exportedAt||"", locT=DB.exportedAt||"";
            const repoNewer = repoT && locT && repoT>locT;
            if(repoScore>locScore+3 || (repoScore>locScore && repoNewer)){
              if(silent){ toast("🛡 Repo hat mehr Daten – nicht überschrieben. Erst „☁ Aus Repo laden“."); setSync("blocked"); return; }
              if(!confirm("Das Repository enthält mehr Daten ("+repoScore+" vs. "+locScore+" gewichtete Einträge). Wirklich mit deinem lokalen Stand überschreiben?")){ setSync("blocked"); return; }
            }
          }
        }
      }catch(_){ /* Repo nicht erreichbar – Schutz 1 greift weiterhin */ }
    }
    let url=c.url; if(url&&!/^https?:\/\//i.test(url)) url="https://"+url; url=url.replace(/\/+$/,"");
    DB.exportedAt=new Date().toISOString();
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","X-Write-Key":c.key},body:JSON.stringify({data:DB})});
    if(res.ok){ saveLocal(); markSaved(); setSync("ok"); toast(silent?"↑ Im Repo gesichert":"Im Repository gespeichert"); }
    else { const t=await res.text().catch(()=>""); console.error("cloudSave",res.status,t); setSync("error"); toast("Cloud-Speichern fehlgeschlagen ("+res.status+")"); }
  }catch(e){ setSync("offline"); toast("Keine Verbindung zum Worker"); }
  finally{ cloudBusy=false; }
}
function flushCloudNow(){ if(cloudConfigured()&&localStorage.getItem("golfdb_cloudAuto")==="1"){ clearTimeout(cloudTimer); cloudSave(true); } }

 {club:"7 Iron 30°",carry:140,total:149},{club:"8 Iron 34,5°",carry:133,total:140},
 {club:"9 Iron 39,5°",carry:119,total:125},{club:"PW 44,5°",carry:113,total:null},
 {club:"PW 44,5° · 105 m",carry:105,total:null},{club:"PW 44,5° · 85–90 m",carry:88,total:null},
 {club:"GW 50°",carry:100,total:null},{club:"GW 50° · 90 m",carry:90,total:null},
 {club:"GW 50° · 70 m",carry:70,total:null},{club:"SW 54°",carry:80,total:null},
 {club:"SW 54° · 75 m",carry:75,total:null},{club:"SW 54° · 65 m",carry:65,total:null},
 {club:"SW 54° · 45 m",carry:45,total:null},{club:"SW 54° · 40 m",carry:40,total:null},
 {club:"SW 54° · 35 m",carry:35,total:null}
];
function ensureDefaults(){
  let changed=false;
  if(!DB.pins) DB.pins={};
  if(!DB.ui) DB.ui={};
  if(!Array.isArray(DB.clubDistances)){
    DB.clubDistances=DEFAULT_CLUB_DISTANCES.map((c,i)=>({id:"C"+(i+1),club:c.club,carry:c.carry,total:c.total}));
    changed=true;
  } else DB.clubDistances.forEach((c,i)=>{ if(!c.id) c.id="C"+(i+1)+"x"+Math.floor(Math.random()*1e4); });
  if(Array.isArray(DB.tournaments)) DB.tournaments.forEach((x,i)=>{ if(!x.id){ x.id="T"+(i+1)+"x"+Math.floor(Math.random()*1e4); changed=true; } });
  if(Array.isArray(DB.seasonGoals)) DB.seasonGoals.forEach((x,i)=>{ if(!x.id){ x.id="G"+(i+1)+"x"+Math.floor(Math.random()*1e4); changed=true; } });
  if(DB.periodization){
    if(Array.isArray(DB.periodization.phases)) DB.periodization.phases.forEach((x,i)=>{ if(!x.id){ x.id="M"+(i+1)+"x"+Math.floor(Math.random()*1e4); changed=true; } });
    if(Array.isArray(DB.periodization.blocks)) DB.periodization.blocks.forEach((x,i)=>{ if(!x.id){ x.id="B"+(i+1)+"x"+Math.floor(Math.random()*1e4); changed=true; } });
  }
  if(changed){ try{saveLocal();}catch(e){} scheduleCloudSync(); }
  return changed;
}

async function idbHydrate(){
  try{
    const b=await idbGet("golfdb_backups");
    if(Array.isArray(b) && b.length) _backups=b;
    else if(_backups.length) idbSet("golfdb_backups", _backups).catch(()=>{});
    try{ localStorage.removeItem("golfdb_backups"); }catch(_){}   // grosse LS-Backups freigeben, liegen jetzt in IDB
    const idb=await idbGet("golfdb");
    if(idb && idb.testDefs && Array.isArray(idb.rounds) && idb.version===SEED.version){
      const idbScore=dataScore(idb), curScore=dataScore(DB);
      const idbT=idb.exportedAt||"", curT=DB.exportedAt||"";
      const idbNewer = (idbT && (!curT || idbT>curT)) || idbScore>curScore;
      if(idbNewer && JSON.stringify(idb)!==JSON.stringify(DB)){
        DB=idb; try{ localStorage.setItem("golfdb", JSON.stringify(DB)); }catch(e){}
        renderAll(); setView(current||"heute");
      }
    } else {
      idbSet("golfdb", DB).catch(()=>{});   // erstmalig IDB aus vorhandenem Stand befuellen
    }
  }catch(e){ /* IDB nicht verfuegbar -> localStorage-Betrieb wie bisher */ }
}
window.addEventListener("pagehide", ()=>{ try{ idbSet("golfdb", DB); }catch(e){} });

snapshot("Start", true);
renderAll();
setView("heute");
idbHydrate().then(cloudLoad);
</script>
