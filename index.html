/* ================= PLATZ-GEOMETRIE / OSM ================= */
function geoLL(a){ return {lat:a[0], lng:a[1]}; }
function geoDist(a,b){ return haversine(geoLL(a),geoLL(b)); }         // Meter
function geoProject(lat,lng,lat0,lng0){
  const R=Math.PI/180;
  return { x:(lng-lng0)*Math.cos(lat0*R)*111320, y:(lat-lat0)*110540 };
}
function ringCentroid(ring){                                          // [lat,lng] flächengewichtet
  if(!ring||ring.length<3){ // Mittel
    let la=0,ln=0; (ring||[]).forEach(p=>{la+=p[0];ln+=p[1];}); const n=(ring||[]).length||1; return [la/n,ln/n];
  }
  const lat0=ring[0][0], lng0=ring[0][1]; let A=0,cx=0,cy=0;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const p=geoProject(ring[i][0],ring[i][1],lat0,lng0), q=geoProject(ring[j][0],ring[j][1],lat0,lng0);
    const f=q.x*p.y - p.x*q.y; A+=f; cx+=(p.x+q.x)*f; cy+=(p.y+q.y)*f;
  }
  if(Math.abs(A)<1e-9){ let la=0,ln=0; ring.forEach(p=>{la+=p[0];ln+=p[1];}); return [la/ring.length,ln/ring.length]; }
  A*=0.5; cx/=(6*A); cy/=(6*A);
  return [ lat0 + cy/110540, lng0 + cx/(Math.cos(lat0*Math.PI/180)*111320) ];
}
function pointInRing(pt, ring){                                       // ray casting, lat/lng
  let inside=false; const x=pt[1], y=pt[0];
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][1], yi=ring[i][0], xj=ring[j][1], yj=ring[j][0];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function distToRing(pt, ring){                                        // Meter zum nächsten Rand
  const lat0=pt[0], lng0=pt[1]; const P=geoProject(pt[0],pt[1],lat0,lng0);
  let best=Infinity;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const a=geoProject(ring[i][0],ring[i][1],lat0,lng0), b=geoProject(ring[j][0],ring[j][1],lat0,lng0);
    const dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy;
    let t = L2? ((P.x-a.x)*dx+(P.y-a.y)*dy)/L2 : 0; t=Math.max(0,Math.min(1,t));
    const ex=a.x+t*dx-P.x, ey=a.y+t*dy-P.y; best=Math.min(best, Math.hypot(ex,ey));
  }
  return best;
}
function lineLenM(line){ let d=0; for(let i=1;i<line.length;i++) d+=geoDist(line[i-1],line[i]); return d; }
function geoInterp(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
// Gefahren, die die Linie here->green kreuzen: liefert Intervalle [near,far] in Metern ab "here"
function segIntersect(p1,p2,p3,p4){                 // lat/lng planar; returns [lat,lng]|null
  const x1=p1[1],y1=p1[0],x2=p2[1],y2=p2[0],x3=p3[1],y3=p3[0],x4=p4[1],y4=p4[0];
  const den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4); if(Math.abs(den)<1e-12) return null;
  const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/den;
  const u=((x1-x3)*(y1-y2)-(y1-y3)*(x1-x2))/den;
  if(t<0||t>1||u<0||u>1) return null;
  return [y1+t*(y2-y1), x1+t*(x2-x1)];
}
function hazardsOnLine(here, green, feats, kinds){
  const total=geoDist(here,green); if(total<5) return [];
  const step=4, N=Math.ceil(total/step);
  const rings=feats.filter(f=>f.ring && kinds.indexOf(f.kind)>=0);
  const active={}; const out=[];
  for(let i=0;i<=N;i++){ const d=Math.min(total, i*step); const p=geoInterp(here,green,d/total);
    rings.forEach((f,fi)=>{ const inside=pointInRing(p,f.ring);
      if(inside){ if(active[fi]==null) active[fi]={kind:f.kind,near:d,far:d}; else active[fi].far=d; }
      else if(active[fi]!=null){ out.push(active[fi]); active[fi]=null; }
    });
  }
  Object.values(active).forEach(a=>{ if(a) out.push(a); });
  // Linien-Features: Kreuzung mit der Spiellinie -> Punkt-Gefahr (near=far)
  feats.filter(f=>f.line && kinds.indexOf(f.kind)>=0).forEach(f=>{
    for(let k=1;k<f.line.length;k++){ const ip=segIntersect(here,green,f.line[k-1],f.line[k]);
      if(ip){ const d=geoDist(here,ip); if(d>2 && d<total-1) out.push({kind:f.kind,near:d,far:d,line:true}); }
    }
  });
  // Punkt-Features (Bäume) nahe der Spiellinie -> Punkt-Gefahr
  feats.filter(f=>f.pt && kinds.indexOf(f.kind)>=0).forEach(f=>{
    const A=geoProject(here[0],here[1],here[0],here[1]), B=geoProject(green[0],green[1],here[0],here[1]), P=geoProject(f.pt[0],f.pt[1],here[0],here[1]);
    const dx=B.x-A.x, dy=B.y-A.y, L2=dx*dx+dy*dy||1; const t=((P.x-A.x)*dx+(P.y-A.y)*dy)/L2;
    if(t>0.03 && t<0.97){ const along=t*Math.sqrt(L2); const perp=Math.hypot(A.x+t*dx-P.x, A.y+t*dy-P.y);
      if(perp<8) out.push({kind:f.kind,near:along,far:along,pt:true}); }
  });
  return out.sort((a,b)=>a.near-b.near);
}
// seitliche Gefahren (OB/Penalty-Linien, die NICHT kreuzen, aber nah am Korridor verlaufen)
function _projPerp(here,green,pt){
  const A=geoProject(here[0],here[1],here[0],here[1]), B=geoProject(green[0],green[1],here[0],here[1]), P=geoProject(pt[0],pt[1],here[0],here[1]);
  const dx=B.x-A.x, dy=B.y-A.y, L2=dx*dx+dy*dy||1;
  const t=((P.x-A.x)*dx+(P.y-A.y)*dy)/L2;
  const perp=(dx*(P.y-A.y)-dy*(P.x-A.x))/Math.sqrt(L2);   // >0 links, <0 rechts (Blickrichtung Grün)
  return {t,perp};
}
function lateralHazards(here, green, feats, kinds){
  const cross=hazardsOnLine(here,green,feats,kinds).filter(h=>h.line);   // die kreuzen schon
  const out=[];
  feats.filter(f=>f.line && kinds.indexOf(f.kind)>=0).forEach(f=>{
    // kreuzt sie? dann nicht lateral
    let crosses=false; for(let k=1;k<f.line.length;k++){ if(segIntersect(here,green,f.line[k-1],f.line[k])){crosses=true;break;} }
    if(crosses) return;
    let mn=Infinity, sideSum=0, cnt=0;
    f.line.forEach(pt=>{ const {t,perp}=_projPerp(here,green,pt); if(t>0.02&&t<1.05){ if(Math.abs(perp)<mn) mn=Math.abs(perp); sideSum+=perp; cnt++; } });
    if(cnt && mn<35) out.push({kind:f.kind, side: sideSum<0?"R":"L", minLat:Math.round(mn)});
  });
  return out;
}
// nächstes Grün zur Position (Loch-Erkennung)
function nearestHole(geo, here){  let best=null,bd=Infinity;
  Object.keys(geo.holes).forEach(n=>{ const g=geo.holes[n].green; if(!g) return; const d=geoDist(here,g);
    if(d<bd){bd=d;best=+n;} });
  return best?{hole:best,dist:Math.round(bd)}:null;
}
/* Live-Position: leichtgewichtiger GPS-Watcher für die Kartenanzeige */
let LIVEPOS={watchId:null, pos:null, cb:null};
function liveStart(cb){
  if(!navigator.geolocation) return false; LIVEPOS.cb=cb;
  if(LIVEPOS.watchId!=null) return true;
  LIVEPOS.watchId=navigator.geolocation.watchPosition(
    p=>{ LIVEPOS.pos=[p.coords.latitude,p.coords.longitude]; if(LIVEPOS.cb) LIVEPOS.cb(LIVEPOS.pos); },
    e=>{}, {enableHighAccuracy:true, maximumAge:1000, timeout:12000});
  return true;
}
function liveStop(){ if(LIVEPOS.watchId!=null){ try{navigator.geolocation.clearWatch(LIVEPOS.watchId);}catch(_){} LIVEPOS.watchId=null; } LIVEPOS.cb=null; }
function featPoints(f){ return f.ring?f.ring : f.line?f.line : f.pt?[f.pt]:[]; }
function geoBBox(feats){
  let a=90,b=180,c=-90,d=-180;
  feats.forEach(f=>featPoints(f).forEach(p=>{ a=Math.min(a,p[0]); b=Math.min(b,p[1]); c=Math.max(c,p[0]); d=Math.max(d,p[1]); }));
  return [a,b,c,d];
}
function roundLL(p){ return [Math.round(p[0]*1e6)/1e6, Math.round(p[1]*1e6)/1e6]; }
function thinRing(ring, minM){ minM=minM||0.8; if(ring.length<4) return ring.map(roundLL);
  const out=[roundLL(ring[0])];
  for(let i=1;i<ring.length;i++){ if(geoDist(out[out.length-1],ring[i])>=minM || i===ring.length-1) out.push(roundLL(ring[i])); }
  return out;
}

const GOLF_KIND={ green:"green", bunker:"bunker", fairway:"fairway", rough:"rough", tee:"tee",
  water_hazard:"water", lateral_water_hazard:"water", penalty_area:"water", hole:"hole", pin:"pin",
  driving_range:"range", path:null, cartpath:null, out:"ob" };
function classifyProps(p){
  if(!p) return null;
  if(p.golf && GOLF_KIND.hasOwnProperty(p.golf)) return GOLF_KIND[p.golf];
  if(p.golf==="green"||p.golf==="bunker") return p.golf;
  if(p.natural==="water" || p.water || p.waterway) return "water";
  if(p.natural==="wood" || p.landuse==="forest") return "wood";
  if(p.natural==="scrub" || p.natural==="heath" || p.natural==="grassland" || p.landuse==="meadow") return "scrub";
  if(p.natural==="tree") return "tree";
  if(p.natural==="tree_row") return "treerow";
  if(p.barrier==="hedge" || p.natural==="hedge") return "hedge";
  if(p.building) return "building";
  if(p.amenity==="parking" || p.landuse==="parking") return "parking";
  if(p.highway || p.footway || p.path || p.cycleway) return "path";
  if(p.leisure==="golf_course") return "boundary";
  // generischer Auffang: alles andere mit brauchbarem Tag behalten (nichts verwerfen)
  if(p.landuse||p.leisure||p.natural||p.amenity||p.man_made||p.barrier||p.surface||p.area||p.sport||p.building_part) return "other";
  return null;
}
function holeRef(p){
  if(!p) return null;
  const cand=[p.ref, p["golf:hole"], p.hole, p.name];
  for(const c of cand){ const m=String(c==null?"":c).match(/\b(\d{1,2})\b/); if(m){ const n=+m[1]; if(n>=1&&n<=18) return n; } }
  return null;
}
// GeoJSON FeatureCollection (overpass-turbo Export) -> internes geo
function parseGeoJSONCourse(fc){
  if(!fc || !Array.isArray(fc.features)) throw new Error("Kein GeoJSON FeatureCollection");
  const feats=[];
  const pushPoly=(coords, kind, ref)=>{ // coords = [ [ [lng,lat],... ], holes... ]
    const outer=coords[0]; if(!outer||outer.length<3) return;
    feats.push({kind, ref, ring:thinRing(outer.map(c=>[c[1],c[0]]))});
  };
  fc.features.forEach(ft=>{
    const p=ft.properties||{}; const kind=classifyProps(p); if(!kind) return; const ref=holeRef(p);
    const g=ft.geometry; if(!g) return;
    if(g.type==="Polygon") pushPoly(g.coordinates, kind, ref);
    else if(g.type==="MultiPolygon") g.coordinates.forEach(poly=>pushPoly(poly, kind, ref));
    else if(g.type==="LineString"){ const line=g.coordinates.map(c=>[c[1],c[0]]); feats.push({kind,ref,line:line.map(roundLL)}); }
    else if(g.type==="Point"){ feats.push({kind,ref,pt:roundLL([g.coordinates[1],g.coordinates[0]])}); }
  });
  return finalizeGeo(feats, "geojson");
}
// Overpass JSON (out geom) -> internes geo
function parseOverpassCourse(json){
  if(!json || !Array.isArray(json.elements)) throw new Error("Kein Overpass-JSON");
  const feats=[];
  json.elements.forEach(el=>{
    const p=el.tags||{}; const kind=classifyProps(p); if(!kind) return; const ref=holeRef(p);
    if(el.type==="node" && el.lat!=null){ feats.push({kind,ref,pt:roundLL([el.lat,el.lon])}); }
    else if(el.type==="way" && el.geometry){
      const pts=el.geometry.map(g=>[g.lat,g.lon]);
      const closed = pts.length>3 && pts[0][0]===pts[pts.length-1][0] && pts[0][1]===pts[pts.length-1][1];
      if(kind==="hole"||kind==="boundary"||kind==="ob"||kind==="hedge"||kind==="treerow" || !closed) feats.push({kind,ref,line:pts.map(roundLL)});
      else feats.push({kind,ref,ring:thinRing(pts)});
    } else if(el.type==="relation" && el.members){
      el.members.filter(m=>m.role==="outer"&&m.geometry).forEach(m=>{
        const pts=m.geometry.map(g=>[g.lat,g.lon]); if(pts.length>=3) feats.push({kind,ref,ring:thinRing(pts)});
      });
    }
  });
  return finalizeGeo(feats, "osm");
}
function finalizeGeo(feats, src){
  if(!feats.length) throw new Error("Keine Golf-Flächen gefunden");
  // Kern-Ausdehnung nur aus Golf-Features (Wasser/Grenze können weit weg liegen)
  const CORE=["green","fairway","tee","bunker","hole","pin","rough"];
  const core=feats.filter(f=>CORE.indexOf(f.kind)>=0);
  const cb=geoBBox(core.length?core:feats);
  const dLat=0.0032, dLng=0.0052;                 // ~350 m Puffer um den Platz
  const nearCore=f=>featPoints(f).some(p=> p[0]>=cb[0]-dLat && p[0]<=cb[2]+dLat && p[1]>=cb[1]-dLng && p[1]<=cb[3]+dLng);
  const before=feats.length;
  feats=feats.filter(f=> CORE.indexOf(f.kind)>=0 ? true : nearCore(f));  // Grenze/Wasser/Range nur wenn platznah
  const bb=geoBBox(feats); const center=[(cb[0]+cb[2])/2,(cb[1]+cb[3])/2];
  const geo={ src, loadedAt:new Date().toISOString(), center, bbox:bb, coreBBox:cb, dropped:before-feats.length, features:feats, holes:{}, mine:[], overrides:{holes:{}} };
  buildHoleGeo(geo);
  return geo;
}
function applyGeoOverrides(geo){
  if(!geo.overrides||!geo.overrides.holes) return geo;
  Object.keys(geo.overrides.holes).forEach(k=>{ const n=+k, o=geo.overrides.holes[k];
    if(!geo.holes[n]) geo.holes[n]={green:null,tee:null,line:null,distM:null};

function buildHoleGeo(geo){
  const greens=geo.features.filter(f=>f.kind==="green");

  const lines=geo.features.filter(f=>f.kind==="hole" && f.line && f.line.length>=2);
  const holes={};
  lines.forEach(L=>{ const n=L.ref; if(!n) return;
    const tee=L.line[0], end=L.line[L.line.length-1];
    let g=null,best=Infinity; greenC.forEach(gc=>{ const d=geoDist(end,gc.c); if(d<best){best=d;g=gc.c;} });

  greenC.forEach(gc=>{ if(gc.ref && !holes[gc.ref]) holes[gc.ref]={ green:gc.c, tee:null, line:null, distM:null }; });
  geo.holes=holes;
  geo.stats={ greens:greens.length, bunkers:geo.features.filter(f=>f.kind==="bunker").length,
    fairways:geo.features.filter(f=>f.kind==="fairway").length, water:geo.features.filter(f=>f.kind==="water").length,
    tees:geo.features.filter(f=>f.kind==="tee").length, holeLines:lines.length, holesMapped:Object.keys(holes).length };

const GEO_ORDER=["boundary","range","other","wood","scrub","parking","highrough","rough","fairway","water","bunker","building","green"];
function _fitProject(feats, center, W, pad){
  const pts=[]; feats.forEach(f=>featPoints(f).forEach(p=>pts.push(geoProject(p[0],p[1],center[0],center[1]))));
  if(!pts.length) return null;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
  const spanX=Math.max(1,maxX-minX), spanY=Math.max(1,maxY-minY);
  const s=Math.min((W-2*pad)/spanX, (W-2*pad)/spanY);
  const Hpx=Math.round(spanY*s+2*pad);
  const map=(lat,lng)=>{ const q=geoProject(lat,lng,center[0],center[1]);
    return [ +(pad+(q.x-minX)*s).toFixed(1), +(pad+(maxY-q.y)*s).toFixed(1) ]; };
  return {map, W, H:Hpx, s, minX, maxY, pad, center};
}

function computeRound(rd){
  const t=courseTee(rd.course,rd.tee);
  const W=DB.costWeights;
  const side=rd.side, is9=(side==="Front 9"||side==="Back 9");
  let CR=null,SL=null,PAR=null;
  if(t){ const S=t.sides||{};
    if(side==="Front 9"){CR=S["Front 9"]?.cr;SL=S["Front 9"]?.slope;PAR=S["Front 9"]?.par;}
    else if(side==="Back 9"){CR=S["Back 9"]?.cr;SL=S["Back 9"]?.slope;PAR=S["Back 9"]?.par;}
    else{CR=t.cr18;SL=t.slope18;PAR=t.par18;}
  }
  const HI=(rd.hi!=null?rd.hi:(DB.profile.hcpIndex!=null?DB.profile.hcpIndex:DB.profile.currentHcp))||0;
  const CHcp=(SL!=null&&CR!=null&&PAR!=null)?Math.round(HI*SL/113+(CR-PAR)):null;
  const hmap={}; if(t) t.holes.forEach(h=>hmap[h.hole]={par:h.par,si:h.si});
  const holes=(Array.isArray(rd.holes)?rd.holes:[]).filter(h=>h&&h.hole!=null);
  const has10=holes.some(h=>h.hole>=10);
  const active=h=> side==="Front 9"? h.hole<=9 : side==="Back 9"? (has10?h.hole>=10:h.hole<=9) : true;
  const act=holes.filter(active);
  let rank={};
  if(is9){ const sis=act.map(h=>hmap[h.hole]?.si).filter(s=>s!=null).sort((a,b)=>a-b);
    sis.forEach((s,i)=>rank[s]=i+1); }
  const cost={P:0,T:0,A:0,Wd:0,S:0,Pen:0};
  let stblN=0,stblB=0,gross=0,dbl=0,gir=0,putts=0,fir=0,firDen=0,ags=0,penalties=0,counted=0,parPlayed=0;
  let eagles=0,birdies=0,pars=0,bogeys=0,doubles=0,triples=0,worse=0,hio=0,onePutts=0,uds=0,sands=0;
  act.forEach(h=>{
    const hd=hmap[h.hole]; if(!hd) return;
    const par=hd.par, si=hd.si, score=h.score, pu=h.putts;
    if(par==null||score==null) return;
    counted++; gross+=score; parPlayed+=par; if(pu!=null) putts+=pu; penalties+=(h.penN||0);
    let vg=0;
    if(CHcp!=null){
      if(is9){const bl=rank[si]; vg=bl?Math.max(0,Math.floor(CHcp/9)+(bl<=(CHcp%9)?1:0)):0;}
      else if(si!=null) vg=Math.max(0,Math.floor(CHcp/18)+(si<=(CHcp%18)?1:0));
    }
    stblB+=Math.max(0,2+par-score); stblN+=Math.max(0,2+par+vg-score);
    ags+=Math.min(score, par+2+vg);
    if(score>=par+2) dbl++;
    const diff=score-par;
    if(score===1) hio++;
    if(diff<=-2) eagles++; else if(diff===-1) birdies++; else if(diff===0) pars++;
    else if(diff===1) bogeys++; else if(diff===2) doubles++; else if(diff===3) triples++; else worse++;
    if(pu===1) onePutts++;
    let girv = pu!=null ? (score-pu)<=(par-2) : false;
    if(h.girDirect==="Ja"||h.girDirect===1) girv=true;
    if(girv) gir++;
    const teeErr=par!==3&&TEE_ERR.has(h.tee), teeBig=par!==3&&TEE_BIG.has(h.tee);
    if(par!==3){ firDen++; if(h.tee==="Hit") fir++; }
    const gside=(h.b1==="Green Side")||(h.b2==="Green Side");
    const ud=(h.ud==="Ja"||h.ud===1)||(!girv&&score<=par);
    const ss=(h.ss==="Ja"||h.ss===1)||(gside&&!girv&&score<=par);
    if(ud) uds++; if(ss) sands++;
    if(pu!=null) cost.P+=Math.max(0,pu-2)*W.putt;
    if(par!==3) cost.T+= teeBig?W.teeBig : (teeErr?W.teeSmall:0);
    if(APPR_Z.has(h.appr)&&!girv) cost.A+=W.appr;
    if(WEDGE_Z.has(h.appr)&&!girv) cost.Wd+=W.wedge;
    if(h.appr==="<20"&&!ud) cost.S+=W.short;
    if(gside&&!ss) cost.S+=W.sand;
    if(h.penN) cost.Pen+=h.penN*W.pen;
  });
  const costArr=COST_CATS.map(([lab,k])=>[lab,+cost[k].toFixed(2)]);
  const mx=Math.max(...costArr.map(c=>c[1]));
  const lever=mx>0?(costArr.find(c=>c[1]===mx)[0]):null;
  const totalCost=+costArr.reduce((a,c)=>a+c[1],0).toFixed(2);
  let sd=null;
  if(CR!=null&&SL&&counted>0){
    sd = is9 ? Math.round(((ags-CR)*113/SL)*10)/10 : Math.round(((ags-CR)*113/SL)*10)/10;
  }
  // längste zusammenhängende Birdie-Serie (Birdie oder besser) innerhalb der Runde
  let birdieStreak=0, curStreak=0;
  act.slice().sort((a,b)=>a.hole-b.hole).forEach(h=>{
    const hd=hmap[h.hole];
    if(!hd||hd.par==null||h.score==null){ curStreak=0; return; }
    if(h.score-hd.par<=-1){ curStreak++; if(curStreak>birdieStreak) birdieStreak=curStreak; }
    else curStreak=0;
  });
  return {CHcp,CR,SL,PAR,HI,counted,gross,putts,gir,fir,firDen,dbl,penalties,
    stblB,stblN,ags,sd,cost,costArr,lever,totalCost,
    eagles,birdies,pars,bogeys,doubles,triples,worse,hio,onePutts,uds,sands,birdieStreak,
    toPar:(PAR!=null&&counted>0)?gross-(is9?PAR:PAR):null,
    parPlayed, toParThrough:(counted>0)?gross-parPlayed:null,
    girPct:counted?gir/counted*100:null, puttsPer:counted?putts/counted:null,
    threePutts:(rd.holes||[]).filter(active).filter(h=>h.putts>=3).length};
}

function roundKPIs(r){

    toPar:e.toPar, puttsPer:e.puttsPer, score:e.gross, holesCounted:e.counted, engine:e};

function sortedRounds(){ return DB.rounds.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")); }
function sortedComps(){ return DB.competitions.filter(c=>c.date).slice().sort((a,b)=>a.date.localeCompare(b.date)); }

/* ---------- WHS handicap progression (Best 8 of 20) ---------- */
const WHS_TABLE={3:[1,-2],4:[1,-1],5:[1,0],6:[2,-1],7:[2,0],8:[2,0],9:[3,0],10:[3,0],11:[3,0],
  12:[4,0],13:[4,0],14:[4,0],15:[5,0],16:[5,0],17:[6,0],18:[6,0],19:[7,0],20:[8,0]};
function whsPool(){
  // acceptable 18-hole score differentials: competitions (entered SD) + training rounds explicitly marked as EDS
  const pool=[];
  DB.competitions.forEach(c=>{ if(typeof c.sd==="number") pool.push({date:c.date,sd:c.sd,src:"Turnier",label:c.tournament||c.course||"Turnier"}); });
  DB.rounds.forEach(r=>{ if(r.countHcp===true){ const e=computeRound(r); if(e.sd!=null) pool.push({date:r.date,sd:e.sd,src:"Runde (EDS)",label:r.course||"Runde"}); }});
  return pool.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));
}
function whsIndexOf(pool){
  const recent=pool.slice(-20), n=recent.length;
  if(n<3) return null;
  const [cnt,adj]=WHS_TABLE[Math.min(n,20)];
  const best=recent.map(x=>x.sd).sort((a,b)=>a-b).slice(0,cnt);
  return Math.round((best.reduce((a,b)=>a+b,0)/best.length+adj)*10)/10;
}
function whsSeries(){ // rolling index after each acceptable score
  const pool=whsPool(), out=[];
  for(let i=0;i<pool.length;i++){ const idx=whsIndexOf(pool.slice(0,i+1)); if(idx!=null) out.push({date:pool[i].date,idx}); }
  return out;
}
function currentIndex(){ const i=whsIndexOf(whsPool()); return i!=null?i:(DB.profile.hcpIndex!=null?DB.profile.hcpIndex:DB.profile.currentHcp); }

/* ---------- round series trend ---------- */
function trendArrow(vals, lowerBetter){ // compare last3 avg vs previous3
  const v=vals.filter(x=>x!=null); if(v.length<2) return {sym:"–",cls:"flat",d:0};
  const a=v.slice(-3), b=v.slice(-6,-3); const m=x=>x.reduce((p,c)=>p+c,0)/x.length;
  const cur=m(a), prev=b.length?m(b):cur; const d=cur-prev;
  const better = lowerBetter? d<0 : d>0;
  if(Math.abs(d)<0.01) return {sym:"→",cls:"flat",d:0};
  return {sym: (d<0?"↓":"↑"), cls:better?"up":"down", d};
}

function focusList(){
  // weakest priority-weighted skills that are below HCP15 (tier idx<1)
  const items=[];
  DB.testDefs.forEach(d=>{
    if(!d.benchmark||!d.weight) return;
    const lt=latest(d.key); if(!lt) return;
    const bv=benchValue(d.key,lt.total);
    const idx=tierIndex(bv,d.benchmark.levels,d.benchmark.higherIsBetter);
    // gap: how far below HCP15 (index 1). deficit>0 means below.
    const deficit=Math.max(0, 1.5-(idx+ (idx<0?0:0.5)));
    const score=(deficit+ (idx<1?0.6:0)) * d.weight;
    items.push({d,idx,val:lt.total,score,weight:d.weight});
  });
  items.sort((a,b)=>b.score-a.score);
  return items.slice(0,4);
}

function renderRecords(){
  const rounds=sortedRounds();              // Trainingsrunden (Loch für Loch), chronologisch
  const comps=sortedComps();                // Turniere (Summenwerte), chronologisch
  const RE=rounds.map(r=>({r,e:computeRound(r)}));

  const ctx=(r,h)=>`${fmtDate(r&&r.date)} · ${esc((r&&r.course)||"–")}${h?` · ${h} L`:""}`;
  const sPar=v=> v==null?"–":((v>=0?"+":"")+(Math.round(v*10)/10).toString().replace(".",","));

  // ---- auf 18 Loch normierte Scoring-Averages ----
  const meanLast=(arr,n)=>{ const a=arr.slice(-n); return a.length? a.reduce((x,y)=>x+y,0)/a.length : null; };
  const trAvg=meanLast(RE.filter(x=>x.e.toPar!=null&&x.e.counted).map(x=>x.e.toPar*18/x.e.counted),30);
  const tuAvg=meanLast(comps.filter(c=>c.deltaPar!=null&&c.holes).map(c=>c.deltaPar*18/c.holes),30);

  // ---- Helfer: bestes/schlechtestes über Trainingsrunden ----
  function bestRE(pick,min){
    let bv=null,br=null;
    RE.forEach(({r,e})=>{ const v=pick(e); if(v==null||isNaN(v)) return;
      if(bv==null||(min? v<bv : v>bv)){ bv=v; br=r; } });
    return bv==null?null:{val:bv,sub:ctx(br,br.side&&br.side!=="18 Loch"?computeRound(br).counted:null)};
  }
  // ---- Helfer: über einen kombinierten Pool {v,r,h} ----
  function pickPool(pool,min){
    if(!pool.length) return null;
    let b=pool[0]; pool.forEach(p=>{ if(min? p.v<b.v : p.v>b.v) b=p; });
    return {val:b.v,sub:ctx(b.r,b.h)};
  }

  // Pools, die Turnier-Summenwerte einbeziehen
  const netPool=[
    ...RE.filter(x=>x.e.stblN!=null&&x.e.counted).map(x=>({v:x.e.stblN,r:x.r,h:x.e.counted})),
    ...comps.filter(c=>c.stbNet!=null).map(c=>({v:c.stbNet,r:c,h:c.holes}))];
  const puttPool=[  // faire Vergleichbarkeit nur über 18-Loch-Runden
    ...RE.filter(x=>x.e.counted>=18&&x.e.putts>0).map(x=>({v:x.e.putts,r:x.r,h:x.e.counted})),
    ...comps.filter(c=>c.putts!=null&&c.holes>=18).map(c=>({v:c.putts,r:c,h:c.holes}))];
  const girPool=[
    ...RE.filter(x=>x.e.gir!=null&&x.e.counted).map(x=>({v:x.e.gir,r:x.r,h:x.e.counted})),
    ...comps.filter(c=>c.gir!=null).map(c=>({v:c.gir,r:c,h:c.holes}))];
  const parPool=[   // Score über Par (roh, mit Loch-Kontext)
    ...RE.filter(x=>x.e.toPar!=null&&x.e.counted).map(x=>({v:x.e.toPar,r:x.r,h:x.e.counted})),
    ...comps.filter(c=>c.deltaPar!=null).map(c=>({v:c.deltaPar,r:c,h:c.holes}))];

  // ---- Karten-Renderer ----
  const rec=(lab,res,unit)=>{
    if(!res||res.val==null) return `<div class="card kpi"><div class="lab">${esc(lab)}</div><div class="val tnum">–</div><div class="sub">noch keine Daten</div></div>`;
    const sub=(typeof res.val==="number"&&res.val===0)?"":(res.sub||"");
    return `<div class="card kpi"><div class="lab">${esc(lab)}</div><div class="val tnum">${res.val}${unit?`<small> ${esc(unit)}</small>`:""}</div><div class="sub">${esc(sub)}</div></div>`;
  };
  const tot=(lab,val,sub)=>`<div class="card kpi"><div class="lab">${esc(lab)}</div><div class="val tnum">${val}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>`;

  if(!rounds.length&&!comps.length){
    $("#v-records").innerHTML=`<div class="eyebrow">Rekorde &amp; Statistiken</div><div class="card"><div class="empty"><div class="big">🏆</div>Noch keine Runden oder Turniere erfasst.<br>Erfasse eine Runde oder ein Turnier — die Rekorde erscheinen dann automatisch.</div></div>`;
    return;
  }

  let h=`<div class="eyebrow">Meine Rekorde · über alle Runden &amp; Turniere</div>
  <div class="grid2" style="margin-bottom:12px">
    <div class="card kpi"><div class="lab">Ø über Par · 30 Trainingsrunden</div><div class="val tnum">${sPar(trAvg)}</div><div class="sub">auf 18 Loch normiert</div></div>
    <div class="card kpi"><div class="lab">Ø über Par · 30 Turniere</div><div class="val tnum">${sPar(tuAvg)}</div><div class="sub">auf 18 Loch normiert</div></div>
  </div>
  <div class="grid2" style="margin-bottom:6px">
    ${rec("Wenigste Putts (18 L)",pickPool(puttPool,true))}
    ${rec("Meiste Netto-Punkte",pickPool(netPool,false))}
    ${rec("Meiste Birdies",bestRE(e=>e.birdies,false))}
    ${rec("Meiste Pars",bestRE(e=>e.pars,false))}
    ${rec("Meiste Fairways",bestRE(e=>e.fir,false))}
    ${rec("Meiste GIR",pickPool(girPool,false))}
    ${rec("Meiste Up &amp; Downs",bestRE(e=>e.uds,false))}
    ${rec("Meiste Sand Saves",bestRE(e=>e.sands,false))}
    ${rec("Meiste 1-Putts",bestRE(e=>e.onePutts,false))}
    ${rec("Längste Birdie-Serie",bestRE(e=>e.birdieStreak,false))}
  </div>
  <div class="note">Rekorde je Einzelrunde. „Wenigste Putts“ nur über volle 18-Loch-Runden. Werte mit Loch-Detail stammen aus erfassten Trainingsrunden; Putts, GIR und Netto-Punkte beziehen Turnierwerte mit ein, sofern erfasst.</div>`;

  // ---- Historische Erfolge (kumuliert) ----
  const sum=f=>RE.reduce((a,x)=>a+(f(x.e)||0),0);
  const totHolesTr=sum(e=>e.counted), totHolesTu=comps.reduce((a,c)=>a+(c.holes||0),0);
  const totGir=sum(e=>e.gir)+comps.reduce((a,c)=>a+(c.gir||0),0);
  h+=`<div class="eyebrow" style="margin-top:22px">Historische Erfolge · kumuliert</div>
  <div class="grid3" style="margin-bottom:8px">
    ${tot("Birdies",sum(e=>e.birdies))}
    ${tot("Eagles",sum(e=>e.eagles))}
    ${tot("Pars",sum(e=>e.pars))}
    ${tot("Hole-in-One",sum(e=>e.hio))}
    ${tot("Löcher gespielt",totHolesTr+totHolesTu, (totHolesTr)+" R + "+(totHolesTu)+" T")}
    ${tot("Fairways getroffen",sum(e=>e.fir))}
    ${tot("GIR",totGir)}
  </div>
  <div class="note">Birdies, Eagles, Pars, Hole-in-One und Fairways werden aus den Loch-für-Loch erfassten Runden gezählt. Gespielte Löcher und GIR beziehen Turniere mit ein, soweit dort erfasst.</div>`;

  // ---- Bad Performance ----
  function bestQuote(pnum,pden,min){
    let bv=null,br=null;
    RE.forEach(({r,e})=>{ if(e.counted<18) return; const d=pden(e); if(!d) return; const q=pnum(e)/d*100;
      if(bv==null||(min? q<bv : q>bv)){ bv=q; br=r; } });
    return bv==null?null:{val:Math.round(bv)+"%",sub:ctx(br)};
  }
  const worstPar=pickPool(parPool,false);
  if(worstPar&&typeof worstPar.val==="number") worstPar.val=(worstPar.val>=0?"+":"")+worstPar.val;
  h+=`<div class="eyebrow" style="margin-top:22px">Bad Performance · historisch</div>
  <div class="grid2" style="margin-bottom:6px">
    ${rec("Höchster Score über Par",worstPar)}
    ${rec("Meiste Putts (18 L)",pickPool(puttPool,false))}
    ${rec("Meiste Doppelbogeys",bestRE(e=>e.doubles,false))}
    ${rec("Meiste Triplebogeys",bestRE(e=>e.triples,false))}
    ${rec("Meiste 3-Putts",bestRE(e=>e.threePutts,false))}
    ${rec("Niedrigste Fairwayquote (18 L)",bestQuote(e=>e.fir,e=>e.firDen,true))}
    ${rec("Niedrigste GIR-Quote (18 L)",bestQuote(e=>e.gir,e=>e.counted,true))}
  </div>`;

  // ---- Gesammelte Statistiken ----
  const grossPool=[
    ...RE.filter(x=>x.e.counted>=18&&x.e.gross!=null).map(x=>({g:x.e.gross,par:x.e.PAR})),
    ...comps.filter(c=>c.holes>=18&&c.gbe!=null).map(c=>({g:c.gbe,par:c.par}))];
  const u=(t)=>grossPool.filter(x=>x.g<t).length;
  const parBetter=grossPool.filter(x=>x.par!=null&&(x.g-x.par)<=0).length;
  h+=`<div class="eyebrow" style="margin-top:22px">Gesammelte Statistiken</div>
  <div class="grid3" style="margin-bottom:8px">
    ${tot("Gespielte Runden",rounds.length)}
    ${tot("Gespielte Turniere",comps.length)}
    ${tot("Runden Par o. besser",parBetter,"18 Loch")}
    ${tot("Runden unter 100",u(100),"18 Loch")}
    ${tot("Runden unter 90",u(90),"18 Loch")}
    ${tot("Runden unter 80",u(80),"18 Loch")}
  </div>
  <div class="note">„Gespielte Runden“ = erfasste Trainingsrunden, „Gespielte Turniere“ = Wettkämpfe. Die Schwellen „unter 100/90/80“ und „Par oder besser“ zählen volle 18-Loch-Runden inkl. Turniere (Brutto-Score).</div>`;

  $("#v-records").innerHTML=h;
}

  ["Schwung","🏌️","var(--pine)"],
  ["Putten","🎯","var(--gold)"],

];
function noteCat(name){ return NOTE_CATS.find(c=>c[0]===name)||NOTE_CATS[NOTE_CATS.length-1]; }
function ensureNotes(){ if(!Array.isArray(DB.notes)) DB.notes=[]; if(!Array.isArray(DB.notesTrash)) DB.notesTrash=[];
  const now=Date.now(), cutoff=90*24*3600*1000, before=DB.notesTrash.length;
  DB.notesTrash=DB.notesTrash.filter(n=>{ const t=n.deletedAt?Date.parse(n.deletedAt):now; return (now-t)<cutoff; });
  if(DB.notesTrash.length!==before) persist();
}
function noteDaysLeft(n){ const t=n.deletedAt?Date.parse(n.deletedAt):Date.now(); return Math.max(0,90-Math.floor((Date.now()-t)/86400000)); }
function trashNote(id, close){ ensureNotes(); const i=DB.notes.findIndex(x=>x.id===id); if(i<0) return;
  const n=DB.notes.splice(i,1)[0]; n.deletedAt=new Date().toISOString(); DB.notesTrash.unshift(n);

function restoreNote(id){ ensureNotes(); const i=DB.notesTrash.findIndex(x=>x.id===id); if(i<0) return;
  const n=DB.notesTrash.splice(i,1)[0]; delete n.deletedAt; DB.notes.push(n); persist(); renderNotes(); toast("Wiederhergestellt"); }
function purgeNote(id){ if(!confirm("Notiz endgültig löschen?")) return; ensureNotes();

function resizeImage(file, maxDim=1200, quality=0.72){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(fr.error||new Error("read"));
    fr.onload=()=>{ const img=new Image();
      img.onerror=()=>reject(new Error("decode"));
      img.onload=()=>{ let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        try{ resolve(cv.toDataURL("image/jpeg",quality)); }catch(e){ reject(e); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

}

/* ================= SCHLAG-GPS (Live-Distanz & Schlaglängen-Datenbasis) ================= */
const GPS={ watchId:null, cur:null, anchor:null, endPoint:null, armed:false, pendClub:false, hole:"", wake:null, err:null };
function ensureGps(){ if(!Array.isArray(DB.gpsShots)) DB.gpsShots=[]; }
function median(a){ a=a.slice().sort((x,y)=>x-y); const n=a.length; return n?(n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2):null; }
function accClass(a){ return a==null?"bad":(a<=8?"good":a<=15?"mid":"bad"); }
function haversine(a,b){
  const R=6371000, toR=d=>d*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng), la1=toR(a.lat), la2=toR(b.lat);
  const x=Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
function liveDist(){ return (GPS.armed&&GPS.anchor&&GPS.cur)?haversine(GPS.anchor,GPS.cur):null; }

async function requestWake(){ try{ if("wakeLock" in navigator && !GPS.wake){ GPS.wake=await navigator.wakeLock.request("screen"); GPS.wake.addEventListener("release",()=>{GPS.wake=null;}); } }catch(e){} }
function releaseWake(){ try{ if(GPS.wake){ GPS.wake.release(); GPS.wake=null; } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && GPS.watchId!=null) requestWake(); });

function startWatch(){
  if(!navigator.geolocation){ GPS.err="GPS auf diesem Gerät nicht verfügbar"; gpsRefresh(); return; }
  if(GPS.watchId!=null) return;
  GPS.err=null;
  GPS.watchId=navigator.geolocation.watchPosition(
    p=>{ GPS.err=null; GPS.cur={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,ts:Date.now()}; gpsRefresh(); },
    e=>{ GPS.err = e.code===1?"Standort-Freigabe verweigert — bitte im Browser erlauben":e.code===2?"Kein GPS-Signal":e.code===3?"GPS-Zeitüberschreitung":("GPS-Fehler"); gpsRefresh(); },
    {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
  requestWake(); gpsRefresh();
}
function stopWatch(){ if(GPS.watchId!=null){ navigator.geolocation.clearWatch(GPS.watchId); GPS.watchId=null; } releaseWake(); GPS.cur=null; gpsRefresh(); }

function gpsAnchor(){ if(!GPS.cur) return; GPS.anchor={...GPS.cur}; GPS.armed=true; GPS.endPoint=null; GPS.pendClub=false; gpsRefresh(); }
function gpsArrive(){ if(!GPS.armed||!GPS.cur) return; GPS.endPoint={...GPS.cur}; GPS.pendClub=true; gpsRefresh(); }
function gpsCancelClub(){ GPS.pendClub=false; GPS.endPoint=null; gpsRefresh(); }
function gpsReset(){ GPS.anchor=null; GPS.armed=false; GPS.endPoint=null; GPS.pendClub=false; gpsRefresh(); }
function gpsSaveShot(club){
  if(!GPS.anchor||!GPS.endPoint) return;
  const d=haversine(GPS.anchor,GPS.endPoint);
  ensureGps();
  DB.gpsShots.push({ id:"G"+Date.now(), ts:new Date().toISOString(), club, dist:Math.round(d),
    accA:Math.round(GPS.anchor.acc), accB:Math.round(GPS.endPoint.acc),
    latA:GPS.anchor.lat, lngA:GPS.anchor.lng, latB:GPS.endPoint.lat, lngB:GPS.endPoint.lng,
    hole:GPS.hole?+GPS.hole:null });
  persist();
  // Kette: die Ball-Position wird zum neuen Ausgangspunkt für den nächsten Schlag
  GPS.anchor={...GPS.endPoint}; GPS.endPoint=null; GPS.pendClub=false; GPS.armed=true;
  renderGps(); toast(clubShort(club)+": "+Math.round(d)+" m");
}
function gpsDelShot(id){ ensureGps(); DB.gpsShots=DB.gpsShots.filter(s=>s.id!==id); persist(); renderGps(); }

function applyMeasuredClub(club){
  ensureGps();
  const arr=DB.gpsShots.filter(s=>s.club===club).map(s=>s.dist);
  if(!arr.length) return;
  if(arr.length<3 && !confirm("Nur "+arr.length+" Messung(en) für "+clubShort(club)+" — trotzdem übernehmen?")) return;
  const med=Math.round(median(arr));
  let obj=(DB.clubDistances||[]).find(c=>c.club===club);
  if(!obj){ obj={id:"C"+Date.now(),club,carry:null,total:null}; DB.clubDistances.push(obj); }
  obj.total=med; persist(); renderGps(); renderBag(); toast(clubShort(club)+" → "+med+" m Gesamt");
}
function applyAllMeasured(){
  ensureGps(); const byClub={};
  DB.gpsShots.forEach(s=>{ (byClub[s.club]=byClub[s.club]||[]).push(s.dist); });
  const clubs=Object.keys(byClub); if(!clubs.length) return;
  if(!confirm("Für "+clubs.length+" Schläger den gemessenen Median als Gesamtlänge übernehmen?")) return;
  clubs.forEach(club=>{ const med=Math.round(median(byClub[club]));
    let obj=(DB.clubDistances||[]).find(c=>c.club===club);
    if(!obj){ obj={id:"C"+Date.now()+Math.floor(Math.random()*1e4),club,carry:null,total:null}; DB.clubDistances.push(obj); }
    obj.total=med; });
  persist(); renderGps(); renderBag(); toast("Alle Mediane übernommen");
}

function gpsActionsHtml(){
  if(GPS.watchId==null) return `<button class="gps-btn a" data-act="start">▶ Tracking starten</button>`;
  let h="";
  if(GPS.pendClub){ h=`<button class="gps-btn ghost" data-act="cancelClub">Abbrechen</button>`; }
  else if(GPS.armed){
    h=`<button class="gps-btn b" data-act="arrive"${GPS.cur?"":" disabled"}>✅ Ball erreicht — speichern</button>
       <button class="gps-btn ghost" data-act="reset" style="margin-top:8px">Ausgangspunkt neu setzen</button>`;
  } else {
    h=`<button class="gps-btn a" data-act="anchor"${GPS.cur?"":" disabled"}>📍 Schlag hier</button>`;
  }
  h+=`<button class="gps-btn ghost" data-act="stop" style="margin-top:8px">⏸ Tracking pausieren</button>`;
  return h;
}
function clubPickHtml(){
  const clubs=(DB.clubDistances||[]).map(c=>c.club).filter(Boolean);
  const d=(GPS.anchor&&GPS.endPoint)?Math.round(haversine(GPS.anchor,GPS.endPoint)):null;
  if(!clubs.length) return `<div class="note">Keine Schläger hinterlegt — bitte zuerst unter „Schläger“ anlegen.</div>`;
  return `<div class="r-s" style="margin:2px 0 7px">Distanz <b>${d} m</b> — welchen Schläger hast du gespielt?</div>
    <div class="clubpick">${clubs.map(c=>`<button data-club="${esc(c)}">${esc(clubShort(c))}</button>`).join("")}</div>`;
}
function bindGpsActions(){
  document.querySelectorAll("#gps-actions [data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="start") startWatch(); else if(a==="stop") stopWatch();
    else if(a==="anchor") gpsAnchor(); else if(a==="arrive") gpsArrive();
    else if(a==="reset") gpsReset(); else if(a==="cancelClub") gpsCancelClub();
  });
  document.querySelectorAll("#gps-clubpick [data-club]").forEach(b=>b.onclick=()=>gpsSaveShot(b.dataset.club));
}
function gpsRefresh(){
  if(typeof current!=="undefined" && current!=="gps") return;
  const distEl=document.getElementById("gl-dist"); if(!distEl) return;
  const tracking=GPS.watchId!=null, ld=liveDist();
  distEl.innerHTML = ld!=null ? Math.round(ld)+'<small>m</small>' : (GPS.armed&&tracking? '0<small>m</small>' : '–');
  const subEl=document.getElementById("gl-sub");
  if(subEl) subEl.textContent = !tracking? "Tracking pausiert" :
    GPS.pendClub? "Ball-Position erfasst — Schläger wählen" :
    GPS.armed? "Live-Distanz vom Schlagpunkt" :
    GPS.cur? "Bereit — „Schlag hier“ am Ball drücken" : "Suche GPS-Signal …";
  const accEl=document.getElementById("gl-acc");
  if(accEl){
    if(tracking&&GPS.cur){ const a=Math.round(GPS.cur.acc), cl=accClass(GPS.cur.acc);
      accEl.className="gps-acc "+cl; accEl.style.display="inline-flex";
      accEl.innerHTML='<span class="dot"></span>GPS ±'+a+' m'+(cl==="bad"?" · ungenau":cl==="good"?" · gut":"");
    } else if(GPS.err){ accEl.className="gps-acc bad"; accEl.style.display="inline-flex"; accEl.innerHTML='<span class="dot"></span>'+esc(GPS.err); }
    else accEl.style.display="none";
  }
  const act=document.getElementById("gps-actions"); if(act) act.innerHTML=gpsActionsHtml();
  const cp=document.getElementById("gps-clubpick"); if(cp) cp.innerHTML=GPS.pendClub?clubPickHtml():"";
  bindGpsActions();
}

function renderGps(){
  ensureGps();
  const shots=DB.gpsShots;
  const byClub={}; shots.forEach(s=>{ (byClub[s.club]=byClub[s.club]||[]).push(s.dist); });
  const agg=Object.keys(byClub).map(club=>{ const arr=byClub[club];
    return {club,n:arr.length,med:Math.round(median(arr)),mean:Math.round(arr.reduce((a,b)=>a+b,0)/arr.length),
      min:Math.min(...arr),max:Math.max(...arr),series:arr};
  }).sort((a,b)=>b.med-a.med);

  let h=`<div class="eyebrow">Schlag-GPS · Live-Distanz &amp; Datenbasis</div>
  <div class="gps-live">
    <div class="gl-cap">Live-Distanz</div>
    <div class="gl-dist" id="gl-dist">–</div>
    <div class="gl-sub" id="gl-sub"></div>
    <span class="gps-acc" id="gl-acc" style="display:none"></span>
  </div>
  <div class="card pad" style="margin-top:12px">
    <div class="field" style="margin-bottom:10px"><label>Loch (optional)</label>
      <input id="gps-hole" inputmode="numeric" value="${esc(GPS.hole||"")}" placeholder="z.B. 7" style="max-width:120px"></div>

let PLAY={active:false, course:null, tee:null, side:"18 Loch", type:"18 Loch", roundId:null,
  date:null, hi:null, holes:[], idx:0, here:null, live:false, auto:true, greenRing:{}, startTime:null, endTime:null};
function playGeo(){ const c=DB.courses.find(x=>x.name===PLAY.course); return c&&c.geo?c.geo:null; }
function greenRingFor(geo,n){ if(PLAY.greenRing[n]!==undefined) return PLAY.greenRing[n];
  let ring=null; const center=geo.holes[n]&&geo.holes[n].green;
  if(center){ const greens=(geo.features||[]).filter(f=>f.kind==="green"&&f.ring);
    const inside=greens.find(f=>pointInRing(center,f.ring));           // Grünmitte liegt in dieser Fläche
    if(inside) ring=inside.ring;
    else { let best=Infinity; greens.forEach(f=>{ const d=geoDist(center,ringCentroid(f.ring)); if(d<best&&d<30){best=d;ring=f.ring;} }); }
  }
  PLAY.greenRing[n]=ring; return ring; }
function greenFMB(here,n){ const geo=playGeo(); if(!geo||!geo.holes[n]||!geo.holes[n].green||!here) return null;
  const center=geo.holes[n].green, mid=Math.round(geoDist(here,center)), ring=greenRingFor(geo,n);
  if(ring&&ring.length>2){ let mn=Infinity,mx=0; ring.forEach(p=>{ const d=geoDist(here,p); if(d<mn)mn=d; if(d>mx)mx=d; });
    return {front:Math.round(mn), mid, back:Math.round(mx)}; }
  return {front:null, mid, back:null}; }
function greenAxisEdges(geo,n){
  const ring=greenRingFor(geo,n), center=geo.holes[n]&&geo.holes[n].green; if(!ring||!center) return null;
  const from=(geo.holes[n]&&geo.holes[n].tee)||(geo.holes[n]&&geo.holes[n].line&&geo.holes[n].line[0])||center;
  const pj=p=>geoProject(p[0],p[1],center[0],center[1]);
  const O=pj(center), F=pj(from); let ax=O.x-F.x, ay=O.y-F.y; const L=Math.hypot(ax,ay)||1; ax/=L; ay/=L;
  let mn=Infinity,mx=-Infinity,fp=null,bp=null;
  ring.forEach(p=>{ const P=pj(p), proj=P.x*ax+P.y*ay; if(proj<mn){mn=proj;fp=p;} if(proj>mx){mx=proj;bp=p;} });
  return {front:fp, back:bp, center};
}
function pinPoint(geo,n,d){ const e=greenAxisEdges(geo,n); if(!e) return geo.holes[n]&&geo.holes[n].green;
  d=Math.max(0,Math.min(1,d==null?0.5:d));
  return [ e.front[0]+(e.back[0]-e.front[0])*d, e.front[1]+(e.back[1]-e.front[1])*d ]; }
function greenDims(geo,n){
  const ring=greenRingFor(geo,n), center=geo && geo.holes[n] && geo.holes[n].green; if(!ring||!center) return null;
  const from=(geo.holes[n]&&geo.holes[n].tee)||center;
  const pj=p=>geoProject(p[0],p[1],center[0],center[1]);
  const O=pj(center), F=pj(from); let ax=O.x-F.x, ay=O.y-F.y; const L=Math.hypot(ax,ay)||1; ax/=L; ay/=L;
  const px=-ay, py=ax;   // senkrecht zur Spiellinie
  let minA=Infinity,maxA=-Infinity,minP=Infinity,maxP=-Infinity;
  ring.forEach(p=>{ const P=pj(p), a=P.x*ax+P.y*ay, b=P.x*px+P.y*py;
    if(a<minA)minA=a; if(a>maxA)maxA=a; if(b<minP)minP=b; if(b>maxP)maxP=b; });
  return { depth:Math.round(maxA-minA), width:Math.round(maxP-minP) };
}

/* ================= LAUNCH MONITOR (Garmin R10 / Awesome Golf) ================= */
const LM_ALIASES={
  date:["date","zeit","time"], club:["club type","club name","club"],
  clubSpeed:["club head speed","clubhead speed","club speed"], ballSpeed:["ball speed"],
  carry:["carry distance","carry"], total:["total distance","total"], roll:["roll distance","roll"],
  smash:["smash factor","smash","efficiency"],
  launch:["vertical launch","launch angle","vla"], peak:["peak height","apex height","apex","max height"],
  descent:["descent angle","landing angle","descent"], hlaunch:["horizontal launch","launch direction","hla"],
  carryLat:["carry lateral distance","carry lateral"], totalLat:["total lateral distance","total lateral","carry deviation distance","offline","side total"],
  carryCurve:["carry curve distance","carry curve","curve"], totalCurve:["total curve distance","total curve"],
  altitude:["altitude"], attack:["angle of attack","attack angle","aoa"], dynLoft:["dynamic loft","dyn loft"],
  spinLoft:["spin loft"], spin:["spin rate","back spin","backspin","total spin"], spinAxis:["spin axis"],
  clubPath:["club path","swing path"], facePath:["face path","face to path"],
  faceTarget:["face target","face to target","face angle"], cls:["shot classification","classification","shot type"]
};
const LM_TREND=[
  {key:"carry",label:"Carry",unit:"m",dec:1},{key:"smash",label:"Smash",unit:"",dec:2,t:"smash"},
  {key:"attack",label:"Attack",unit:"°",dec:1,t:"attack"},{key:"launch",label:"V. Launch",unit:"°",dec:1,t:"launch"},
  {key:"descent",label:"Descent",unit:"°",dec:1,t:"descent"},{key:"peak",label:"Apex",unit:"m",dec:1,t:"peak"},
  {key:"spin",label:"Spin (gesch.)",unit:"rpm",dec:0,t:"spin"},{key:"faceTarget",label:"Face-to-Target",unit:"°",dec:1}
];
const LM_TRENDLBL=Object.fromEntries(LM_TREND.map(m=>[m.key,m]));
const LM_ALIASOLD={totalLat:"offline",clubPath:"path",hlaunch:"launchDir"};
function lmGet(s,k){ if(s[k]!=null) return s[k]; const a=LM_ALIASOLD[k]; return (a&&s[a]!=null)?s[a]:null; }

function lmSplit(line,d){ const out=[];let cur="",q=false;
  for(const c of line){ if(c==='"'){q=!q;} else if(c===d&&!q){out.push(cur);cur="";} else cur+=c; }
  out.push(cur); return out.map(s=>s.trim().replace(/^"|"$/g,"")); }
function lmNum(v){ if(v==null)return null; let s=String(v).trim(); if(!s) return null;
  if(s.indexOf(",")>=0 && s.indexOf(".")<0) s=s.replace(/\./g,"").replace(",","."); const n=parseFloat(s.replace(/[^\d.\-]/g,"")); return isFinite(n)?n:null; }
function lmMatchCol(h){ h=(h||"").trim().toLowerCase().replace(/\s*\([^)]*\)\s*/g," ").replace(/\s+/g," ").trim();
  if(/description|note|reading|low point|swing plane|apex time|hang time/.test(h)) return null;
  for(const [k,al] of Object.entries(LM_ALIASES)) if(al.some(a=>h===a)) return k;
  for(const [k,al] of Object.entries(LM_ALIASES)) if(al.some(a=>h.includes(a))) return k; return null; }
function lmParse(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return {shots:[],cols:[],delim:null,rawHeader:"",headerRow:-1};
  let best={delim:",",row:0,matched:0};
  [";",",","\t","|"].forEach(d=>{ for(let i=0;i<Math.min(lines.length,20);i++){
    const m=lmSplit(lines[i],d).map(lmMatchCol).filter(Boolean).length; if(m>best.matched) best={delim:d,row:i,matched:m}; }});
  const {delim,row:hr}=best;
  const map=lmSplit(lines[hr],delim).map(lmMatchCol);
  const clubIdx=map.indexOf("club");
  const row2=lines[hr+1]?lmSplit(lines[hr+1],delim):[];
  const looksUnits=row2.some(c=>/^(mph|rpm|deg|°|yds|yards|meter|m|m\/s|km\/h|ft|cm)$/i.test(c))||(clubIdx>=0&&row2[clubIdx]&&!/[a-z]/i.test(row2[clubIdx]));
  const start=hr+(looksUnits?2:1), shots=[];
  for(let i=start;i<lines.length;i++){
    const cells=lmSplit(lines[i],delim); if(cells.every(c=>c==="")) continue;
    const s={}; map.forEach((k,ci)=>{ if(!k)return; const txt=(k==="club"||k==="date"||k==="cls");
      const val=txt?(cells[ci]||"").trim():lmNum(cells[ci]);
      if(s[k]==null||s[k]==="") s[k]=val; }); // first non-empty wins (avoids duplicate-column overwrite)
    if((s.club&&s.club.length)||s.carry!=null||s.smash!=null||s.clubSpeed!=null) shots.push(s);
  }
  if(shots.length && !shots.some(s=>s.club)) shots.forEach(s=>s.club="Alle Schläge");
  return {shots, cols:map.filter(Boolean), delim, rawHeader:lines[hr]||"", headerRow:hr};
}

/* ---- stats helpers ---- */
const A_mean=a=>{a=a.filter(x=>x!=null&&!isNaN(x)); return a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN;};
const A_med=a=>{a=a.filter(x=>x!=null&&!isNaN(x)).sort((x,y)=>x-y); if(!a.length)return NaN; const m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2;};
const A_std=a=>{a=a.filter(x=>x!=null&&!isNaN(x)); if(a.length<2)return 0; const m=A_mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));};
const acol=(sh,k)=>sh.map(s=>{const v=lmGet(s,k); return v==null?NaN:v;});
function fmtN(v,d){ d=d==null?1:d; return (v==null||isNaN(v))?"–":v.toFixed(d).replace(".",","); }

function clubFamily(name){ const n=(name||"").toLowerCase();
  if(/driver|1\s*wood/.test(n)) return 'driver';
  if(/wood|holz/.test(n)) return 'wood';
  if(/hybrid|rescue/.test(n)) return 'hybrid';
  if(/wedge|pitch|gap|sand|lob|\bpw\b|\bgw\b|\bsw\b|\blw\b|\baw\b/.test(n)) return 'wedge';
  if(/iron|eisen/.test(n)) return 'iron'; return 'other'; }
function normalizeClub(name){ const n=(name||'').toLowerCase();
  if(/driver/.test(n)) return 'Driver';
  let m=n.match(/(\d+)\s*wood/); if(m) return m[1]+' Wood';
  if(/hybrid|rescue/.test(n)) return 'Hybrid';
  if(/lob\s*wedge|(^|\s)lw\b/.test(n)) return 'LW';
  if(/sand\s*wedge|(^|\s)sw\b/.test(n)) return 'SW';
  if(/gap\s*wedge|approach\s*wedge|(^|\s)gw\b|(^|\s)aw\b/.test(n)) return 'GW';
  if(/pitch\w*\s*wedge|(^|\s)pw\b/.test(n)) return 'PW';
  m=n.match(/(\d+)\s*(iron|eisen)/); if(m) return m[1]+' Iron';
  m=n.match(/^\s*(\d+)\b/); if(m&&+m[1]<=9) return m[1]+' Iron';
  return null; }
function bandT(v,tol){ return {green:[v-tol,v+tol],yellow:[v-2*tol,v+2*tol],ideal:v}; }
function targetFor(club){
  const key=normalizeClub(club), p=(key&&CLUB_PROFILE[key])||LM_FAM[clubFamily(club)];
  if(!p) return null;
  return { label:key||clubFamily(club),
    attack:bandT(p.attack,LM_TOL.attack), launch:bandT(p.launch,LM_TOL.launch),
    spin:Object.assign(bandT(p.spin,LM_TOL.spin),{est:true}), descent:bandT(p.descent,LM_TOL.descent),
    peak:bandT(p.peak,LM_TOL.peak), spinLoft:bandT(p.spinLoft,LM_TOL.spinLoft),
    smash:{gmin:p.smash-0.03,ymin:p.smash-0.06,ideal:p.smash},
    latStd:{green:p.latStd,yellow:p.latStd*1.7}, carryStd:{green:p.carryStd,yellow:p.carryStd*1.7} };
}
function rateR(v,t){ if(v==null||isNaN(v)||!t)return 'n'; if(v>=t.green[0]&&v<=t.green[1])return 'g'; if(v>=t.yellow[0]&&v<=t.yellow[1])return 'y'; return 'r'; }
function rateSmash(v,t){ if(v==null||isNaN(v)||!t)return 'n'; if(v>=t.gmin)return 'g'; if(v>=t.ymin)return 'y'; return 'r'; }

function rateStd(v,t){ if(v==null||isNaN(v)||!t)return 'n'; if(v<=t.green)return 'g'; if(v<=t.yellow)return 'y'; return 'r'; }
const LG={g:"var(--pine)",y:"var(--gold-ink,#8a5a00)",r:"var(--red)",n:"var(--ink-faint)"};
const LGBG={g:"var(--pine-soft)",y:"var(--gold-soft)",r:"var(--red-soft)",n:"var(--surface2)"};
const LGTXT={g:"gut",y:"ok",r:"⚠",n:"–"};

function lmMarkOut(shots){
  const mS=A_med(acol(shots,'smash')), mL=A_med(acol(shots,'launch')), mP=A_med(acol(shots,'peak'));
  return shots.map(s=>{ let out=false; const sm=lmGet(s,'smash'),la=lmGet(s,'launch'),pk=lmGet(s,'peak');
    if(sm!=null&&!isNaN(mS)&&sm<mS-0.10) out=true;
    if(la!=null&&!isNaN(mL)&&la<mL-5) out=true;
    if(pk!=null&&!isNaN(mP)&&pk<mP*0.6) out=true;
    return Object.assign({},s,{_out:out}); });
}
function lmStatObj(clean){ const S={};
  ["clubSpeed","ballSpeed","smash","carry","total","roll","launch","peak","descent","attack","dynLoft","spinLoft","spin","totalLat","carryLat","clubPath","facePath","faceTarget","hlaunch","carryCurve","spinAxis"]
    .forEach(k=>{ const c=acol(clean,k); S[k]={mean:A_mean(c),std:A_std(c),med:A_med(c)}; }); return S; }
function lmPearson(a,b){ const xs=[],ys=[]; for(let i=0;i<a.length;i++){ if(!isNaN(a[i])&&!isNaN(b[i])){xs.push(a[i]);ys.push(b[i]);} }
  const n=xs.length; if(n<3) return {r:NaN,n}; const mx=A_mean(xs),my=A_mean(ys); let sxy=0,sx=0,sy=0;
  for(let i=0;i<n;i++){ const dx=xs[i]-mx,dy=ys[i]-my; sxy+=dx*dy; sx+=dx*dx; sy+=dy*dy; }
  if(sx===0||sy===0) return {r:NaN,n}; return {r:sxy/Math.sqrt(sx*sy),n}; }
function lmPct(arr,p){ const a=arr.filter(x=>!isNaN(x)).sort((x,y)=>x-y); if(!a.length)return NaN; const i=(a.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i); return lo===hi?a[lo]:a[lo]+(a[hi]-a[lo])*(i-lo); }

/* ---- recommendations (mit Drills) ---- */
function lmBuildRecs(club,S,clean,t){
  const R=[], add=(sev,title,text,drill)=>R.push({sev,title,text,drill}), isIron=clubFamily(club)==='iron';
  if(t){
    const a=S.attack.mean,A=t.attack;
    if(!isNaN(a)){ const rr=rateR(a,A);
      if(rr==='r'&&a>A.yellow[1]) add('r','Anstellwinkel zu flach ('+fmtN(a,1)+'°)','Du triffst kaum oder aufwärts statt abwärts. Ziel ≈ '+fmtN(A.ideal,1)+'°. Folge: wenig Kompression, wechselnder Spin, dünn/fett-Anfälligkeit.','Ball 1 Ballbreite zurück, ~60% Druck auf vorderem Fuß, Divot nach dem Ball. Kontrolle mit Impact-Spray/Divot-Board.');
      else if(rr==='r'&&a<A.yellow[0]) add('r','Anstellwinkel zu steil ('+fmtN(a,1)+'°)','Zu viel abwärts – kostet Länge, tiefe Divots. Ziel ≈ '+fmtN(A.ideal,1)+'°.','Flacherer Angriff: Gewicht nicht überziehen, Brustzentrum stabil, „durch den Ball" statt „in den Boden".');
      else if(rr==='y') add('y','Anstellwinkel leicht daneben ('+fmtN(a,1)+'°)','Nah dran (Ziel '+fmtN(A.ideal,1)+'°).','Gleiche Richtung, feiner dosiert.');
      else add('g','Anstellwinkel top ('+fmtN(a,1)+'°)','Sauberes '+(isIron?'Abwärts-':'')+'Treffen im Zielbereich.','');
    }
    const sm=S.smash.mean;
    if(!isNaN(sm)){ const rr=rateSmash(sm,t.smash);
      if(rr==='r') add('r','Treffer nicht zentral (Smash '+fmtN(sm,2)+')','Energieübertragung zu niedrig (Ziel ≥'+fmtN(t.smash.gmin,2)+'). Meist außermittig.','Face-Tape/Fußspray auf die Schlagfläche, Treffpunkt prüfen. Zentrum vor Speed.');
      else if(rr==='y') add('y','Treffer ok, nicht optimal (Smash '+fmtN(sm,2)+')','Etwas Streuung im Treffpunkt.','Ein paar langsamere Bälle mit Fokus Mitte.');
      else add('g','Zentraler Treffer (Smash '+fmtN(sm,2)+')','Sehr gute Energieübertragung.','');
    }
    const l=S.launch.mean,L=t.launch;
    if(!isNaN(l)){ const rr=rateR(l,L);
      if(rr==='r'&&l>L.yellow[1]) add('r','Ballflug zu hoch ('+fmtN(l,1)+'°)','Hoher Launch kostet bei Wind Kontrolle. Ziel '+fmtN(L.ideal,1)+'°.','Kommt meist mit dem Attack-Fix von selbst runter (Hände voraus, abwärts).');
      else if(rr==='r'&&l<L.yellow[0]) add('r','Ballflug zu flach ('+fmtN(l,1)+'°)','Zu niedrig zum Stoppen. Ziel '+fmtN(L.ideal,1)+'°.','Nicht am Ball „helfen"/scoopen; sauberer Treffer mit Loft.');
      else if(rr==='y') add('y','Launch grenzwertig ('+fmtN(l,1)+'°)','Knapp außerhalb (Ziel '+fmtN(L.ideal,1)+'°).','');
    }
    const d=S.descent.mean,D=t.descent;
    if(!isNaN(d)&&rateR(d,D)==='r'&&d<D.yellow[0]) add('r','Landewinkel zu flach ('+fmtN(d,1)+'°)','Ball stoppt schlecht, rollt zu viel. Ziel '+fmtN(D.ideal,0)+'°.','Mehr Höhe/Spin über besseren Treffer – hängt an Attack & Launch.');
  }
  const ft=S.faceTarget.mean;
  if(!isNaN(ft)){ const rr=rateAbs(ft,1.5,3.0);
    if(rr==='r') add('r','Systematischer Richtungsfehler (Face '+(ft>0?'+':'')+fmtN(ft,1)+'°)','Das Blatt zeigt im Schnitt '+(ft>0?'rechts':'links')+' vom Ziel – eher Ausrichtung/Blattkontrolle als Zufall.','Ausrichtung mit Alignment-Sticks prüfen. Bleibt der Fehler: Blattstellung im Treffmoment (Griff/Release).');
    else if(rr==='y') add('y','Leichte Richtungstendenz (Face '+(ft>0?'+':'')+fmtN(ft,1)+'°)','Kleiner '+(ft>0?'Rechts':'Links')+'-Bias.','Ausrichtung gegenchecken.');
    else add('g','Blatt im Schnitt quadratisch','Sehr gute Richtungskontrolle.','');
  }
  const cp=S.clubPath.mean;
  if(!isNaN(cp)&&Math.abs(cp)>3) add('y','Schwungbahn ausgeprägt ('+(cp>0?'in-to-out':'out-to-in')+', '+fmtN(cp,1)+'°)','Deutliche '+(cp>0?'von-innen':'von-außen')+'-Bahn. Mit der Blattstellung steuert das deine Kurve.','');
  if(t){ const lstd=A_std(acol(clean,'totalLat')), rl=rateStd(lstd,t.latStd);
    if(rl==='r') add('r','Große seitliche Streuung (±'+fmtN(lstd,1)+' m)','Die Bälle streuen breit nach links/rechts.','Erst Treffpunkt & Blattstellung stabilisieren, dann Speed. Konsistenz vor Distanz.');
    else if(rl==='y') add('y','Seitliche Streuung mittel (±'+fmtN(lstd,1)+' m)','Noch Luft bei der Richtungsstabilität.','');
    else if(rl==='g') add('g','Enges Trefferbild (±'+fmtN(lstd,1)+' m)','Sehr konstante Richtung.','');
    const rc=rateStd(S.carry.std,t.carryStd);
    if(rc==='r') add('r','Große Längen-Streuung (±'+fmtN(S.carry.std,1)+' m)','Carry schwankt stark – erschwert Gapping/Clubwahl.','Treffpunkt-Konsistenz ist der Haupthebel (siehe Smash/Attack).');
    else if(rc==='g') add('g','Konstante Längen (±'+fmtN(S.carry.std,1)+' m)','Verlässliches Gapping möglich.','');
  }

}

/* ---- charts (helles Design) ---- */
function lmDispersion(marked){
  const pts=marked.filter(s=>lmGet(s,'totalLat')!=null&&s.carry!=null);
  if(pts.length<2) return '<div class="note">Zu wenige Daten fürs Trefferbild.</div>';
  const W=560,H=300,pad=34;
  const xs=pts.map(s=>lmGet(s,'totalLat')), ys=pts.map(s=>s.carry);
  const xmax=Math.max(6,...xs.map(Math.abs))*1.15; let ymin=Math.min(...ys),ymax=Math.max(...ys);
  const yr=Math.max(10,ymax-ymin); ymin-=yr*0.15; ymax+=yr*0.15;
  const X=v=>pad+(v+xmax)/(2*xmax)*(W-2*pad), Y=v=>H-pad-(v-ymin)/(ymax-ymin)*(H-2*pad);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  svg+=`<line x1="${X(0)}" y1="${pad}" x2="${X(0)}" y2="${H-pad}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  svg+=`<rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="none" stroke="var(--line)"/>`;
  svg+=`<text x="${X(-xmax*0.8)}" y="${H-12}" fill="var(--ink-faint)" font-size="12" text-anchor="middle">← links</text>`;
  svg+=`<text x="${X(xmax*0.8)}" y="${H-12}" fill="var(--ink-faint)" font-size="12" text-anchor="middle">rechts →</text>`;
  const clean=marked.filter(s=>!s._out);
  const mx=A_mean(acol(clean,'totalLat')), my=A_mean(acol(clean,'carry'));
  if(clean.length>=3&&!isNaN(mx)&&!isNaN(my)){
    const lat=acol(clean,'totalLat'),car=acol(clean,'carry'); let n=0,dxx=0,dyy=0,dxy=0;
    for(let i=0;i<clean.length;i++){ const x=lat[i],y=car[i]; if(isNaN(x)||isNaN(y))continue; n++; dxx+=(x-mx)**2; dyy+=(y-my)**2; dxy+=(x-mx)*(y-my); }
    if(n>=3){ const sxx=dxx/(n-1),syy=dyy/(n-1),sxy=dxy/(n-1); const tr=sxx+syy,det=sxx*syy-sxy*sxy,disc=Math.max(0,tr*tr-4*det);
      const l1=(tr+Math.sqrt(disc))/2,l2=(tr-Math.sqrt(disc))/2; let v1x,v1y; if(Math.abs(sxy)>1e-6){v1x=l1-syy;v1y=sxy;}else{v1x=1;v1y=0;}
      const nn=Math.hypot(v1x,v1y)||1; v1x/=nn;v1y/=nn; const v2x=-v1y,v2y=v1x,a1=Math.sqrt(Math.max(l1,0)),a2=Math.sqrt(Math.max(l2,0));
      let dd=''; for(let k=0;k<=48;k++){ const th=k/48*2*Math.PI; const px=mx+Math.cos(th)*a1*v1x+Math.sin(th)*a2*v2x, py=my+Math.cos(th)*a1*v1y+Math.sin(th)*a2*v2y; dd+=(k?'L':'M')+X(px).toFixed(1)+','+Y(py).toFixed(1)+' '; }
      svg+=`<path d="${dd}Z" fill="var(--pine)" fill-opacity="0.10" stroke="var(--pine)" stroke-opacity="0.6" stroke-dasharray="4 3"/>`;
    }
  }
  marked.forEach(s=>{ const lat=lmGet(s,'totalLat'); if(lat==null||s.carry==null)return; const cx=X(lat),cy=Y(s.carry);
    if(s._out) svg+=`<circle cx="${cx}" cy="${cy}" r="5" fill="none" stroke="var(--ink-faint)" stroke-width="1.5"/>`;
    else svg+=`<circle cx="${cx}" cy="${cy}" r="5.5" fill="var(--pine)" opacity="0.85"/>`; });
  if(!isNaN(mx)&&!isNaN(my)){ const cx=X(mx),cy=Y(my);
    svg+=`<circle cx="${cx}" cy="${cy}" r="8" fill="none" stroke="var(--gold)" stroke-width="2.5"/><line x1="${cx-11}" y1="${cy}" x2="${cx+11}" y2="${cy}" stroke="var(--gold)" stroke-width="2"/><line x1="${cx}" y1="${cy-11}" x2="${cx}" y2="${cy+11}" stroke="var(--gold)" stroke-width="2"/>`; }
  return svg+`</svg>`;
}
function lmCarryStrip(marked,S){
  const ys=marked.map(s=>s.carry).filter(v=>v!=null); if(!ys.length) return '';
  const W=560,H=210,pad=30; let ymin=Math.min(...ys),ymax=Math.max(...ys); const yr=Math.max(10,ymax-ymin); ymin-=yr*0.2; ymax+=yr*0.2;
  const Y=v=>H-pad-(v-ymin)/(ymax-ymin)*(H-2*pad), m=S.carry.mean, sd=S.carry.std;
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  if(!isNaN(m)&&sd>0){ const yT=Y(m+sd),yB=Y(m-sd);
    svg+=`<rect x="${pad}" y="${yT}" width="${W-2*pad}" height="${yB-yT}" fill="var(--pine)" opacity="0.12"/><line x1="${pad}" y1="${Y(m)}" x2="${W-pad}" y2="${Y(m)}" stroke="var(--gold)" stroke-width="2"/><text x="${W-pad}" y="${Y(m)-5}" fill="#8a5a00" font-size="12" text-anchor="end">Ø ${fmtN(m,0)} m ±${fmtN(sd,1)}</text>`; }
  const n=marked.length;
  marked.forEach((s,i)=>{ if(s.carry==null)return; const x=pad+(n>1?i/(n-1):0.5)*(W-2*pad),y=Y(s.carry); svg+=`<circle cx="${x}" cy="${y}" r="5" fill="${s._out?'var(--ink-faint)':'#2b6fb0'}"/>`; });
  return svg+`</svg>`;
}
function lmDiagScatter(marked){

      let band=null; const tt=targetFor(lmSelClub); if(def.t&&tt&&tt[def.t]){ const T=tt[def.t]; band=def.t==='smash'?[T.gmin,T.gmin*1.05]:(T.green?[T.green[0],T.green[1]]:null); }

function lmBind(){
  const fi=$("#lmFile"); if(fi){ $("#lmImport").onclick=()=>fi.click(); fi.onchange=e=>lmImport([...e.target.files]); }
  document.querySelectorAll(".lmclub").forEach(b=>b.onclick=()=>{lmSelClub=b.dataset.c;lmSelSession=null;renderLaunch();});
  document.querySelectorAll(".lmsess").forEach(b=>b.onclick=()=>{lmSelSession=b.dataset.s;renderLaunch();});
  document.querySelectorAll(".lmtrend").forEach(b=>b.onclick=()=>{lmSelTrend=b.dataset.m;renderLaunch();});
}
function lmImport(files){
  if(!files.length) return; let done=0, added=0; lmLastFail=null;
  files.forEach(f=>{ const rd=new FileReader();
    rd.onload=()=>{ try{ const p=lmParse(rd.result);
      if(p.shots.length){ (DB.lmSessions=DB.lmSessions||[]).push({id:"LM"+Date.now()+Math.floor(Math.random()*1000),
        date:new Date().toISOString().slice(0,10), name:f.name.replace(/\.csv$/i,""), shots:p.shots,
        meta:{cols:p.cols, delim:p.delim, rawHeader:p.rawHeader}}); added+=p.shots.length; }
      else { lmLastFail={name:f.name, rawHeader:p.rawHeader, delim:p.delim, cols:p.cols}; }
    }catch(err){ console.error(err); lmLastFail={name:f.name, error:String(err)}; }
    if(++done===files.length){ persist(); renderAll(); setView("launch"); toast(added?`${added} Schläge importiert`:"Keine Daten erkannt"); }
    };
    rd.readAsText(f);
  });
  $("#lmFile").value="";
}
function openLMsession(id){

function isoWeek(d){ d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day); const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil(((d-ys)/86400000+1)/7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function currentPhase(){ const t=todayISO(); return (DB.phases||[]).find(p=>(!p.start||p.start<=t)&&(!p.end||t<=p.end))||(DB.phases||[])[0]; }
function currentBlock(){ const kw=isoWeek(new Date()); return ((DB.periodization||{}).blocks||[]).find(b=>b.kwFrom<=kw&&kw<=b.kwTo); }
function nextTournament(){ const t=todayISO(); return (DB.tournaments||[]).filter(x=>x.date>=t).sort((a,b)=>a.date.localeCompare(b.date))[0]; }
function dueTests(){ const t=Date.now();
  return DB.testDefs.map(d=>{ const h=testsFor(d.key); const last=h.length?h[h.length-1].date:null;
    const days=last?Math.floor((t-new Date(last).getTime())/864e5):null; return {def:d,last,days}; })
    .filter(x=>x.days==null||x.days>=21).sort((a,b)=>(b.days==null?99999:b.days)-(a.days==null?99999:a.days)).slice(0,5); }

/* ================= KORRELATION ================= */
function pearson(xs,ys){ const n=xs.length; if(n<3) return null;
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let sxy=0,sxx=0,syy=0; for(let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
  if(sxx===0||syy===0) return null; return sxy/Math.sqrt(sxx*syy); }
function renderKorrelation(){
  const rounds=sortedRounds().map(r=>({r,e:computeRound(r)})).filter(x=>x.e.toPar!=null);
  let h=`<div class="eyebrow">Was treibt deinen Score?</div>`;
  if(rounds.length<4){ h+=`<div class="card"><div class="empty"><div class="big">📈</div>Mindestens 4 gewertete Runden nötig (aktuell ${rounds.length}).</div></div>`;
    $("#v-korrelation").innerHTML=h; return; }
  const toPar=rounds.map(x=>x.e.toPar);
  const KPIS=[
    ["GIR-Quote", rounds.map(x=>x.e.girPct), true],
    ["Putts/Loch", rounds.map(x=>x.e.puttsPer), false],
    ["3-Putts", rounds.map(x=>x.e.threePutts), false],
    ["Fairway-Quote", rounds.map(x=>x.e.firDen?x.e.fir/x.e.firDen*100:null), true],
    ["Strafschläge", rounds.map(x=>x.e.penalties), false],
    ["Kosten Putting", rounds.map(x=>x.e.cost.P), false],
    ["Kosten Tee/Long", rounds.map(x=>x.e.cost.T), false],
    ["Kosten Approach", rounds.map(x=>x.e.cost.A), false],
    ["Kosten Wedge", rounds.map(x=>x.e.cost.Wd), false],
    ["Kosten Shortgame", rounds.map(x=>x.e.cost.S), false],
  ];
  const res=[];
  KPIS.forEach(([lab,arr])=>{ const pairs=arr.map((v,i)=>[v,toPar[i]]).filter(p=>p[0]!=null);
    if(pairs.length<4) return; const r=pearson(pairs.map(p=>p[0]),pairs.map(p=>p[1]));
    if(r!=null) res.push({lab,r,n:pairs.length}); });
  res.sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
  h+=`<div class="card"><div style="padding:6px 0">`;
  res.forEach(x=>{ const pct=Math.min(100,Math.abs(x.r)*100), strong=Math.abs(x.r);
    const col=x.r>0?"var(--red)":"var(--pine)"; // positive r with toPar = higher value → worse score
    h+=`<div class="focus" style="cursor:default"><div class="grow">
      <div class="f-t" style="font-size:13.5px">${esc(x.lab)}</div>
      <div style="height:8px;border-radius:4px;background:var(--surface2);margin-top:5px;overflow:hidden"><span style="display:block;height:100%;width:${pct}%;background:${col}"></span></div></div>
      <div class="tnum" style="width:52px;text-align:right;font-weight:700;color:${col}">${x.r>0?"+":""}${x.r.toFixed(2)}</div></div>`; });
  h+=`</div></div>
  <div class="note">Korrelation jeder Kennzahl mit „Schläge über Par" über ${rounds.length} Runden. <b>Näher an ±1</b> = stärkerer Zusammenhang. Ampelfarbe zeigt: was deinen Score nach oben treibt (rot) bzw. senkt (grün). Bei dieser Stichprobengröße als Tendenz lesen, nicht als Beweis.</div>`;
  // range→course transfer
  const linked=[["Putting","P","kurzputt"],["Approach","A","approach"],["Wedge","Wd","distanzkontrolle"],["Shortgame","S","scrambling"]];
  h+=`<div class="eyebrow">Range → Platz · Transfer</div><div class="card"><div style="padding:4px 0">
    <div class="hist-row" style="font-weight:700;font-size:11px;color:var(--ink-faint)"><span style="flex:1">Bereich</span><span style="width:96px;text-align:right">Ø Kosten/Runde</span><span style="width:96px;text-align:right">Test-Level</span></div>`;
  linked.forEach(([lab,ck,tk])=>{ const avg=rounds.reduce((a,x)=>a+(x.e.cost[ck]||0),0)/rounds.length;
    const th=testsFor(tk); const lvl=th.length?lvlChip(th[th.length-1].total,defFor(tk)):null;
    h+=`<div class="hist-row"><span style="flex:1">${lab}</span>
      <span class="v tnum" style="width:96px">${avg.toFixed(2)}</span>
      <span style="width:96px;text-align:right">${lvl||'<span class="r-s">–</span>'}</span></div>`; });
  h+=`</div></div><div class="note">Hohe Platzkosten trotz gutem Test-Level = <b>Transfer-Lücke</b> (Range-Form kommt nicht auf den Platz). Umgekehrt: niedriges Test-Level bei geringen Kosten = Bereich ist auf dem Platz (noch) kein Problem.</div>`;
  $("#v-korrelation").innerHTML=h;
}

function goalCurrent(g){ if(g.testKey){ const th=testsFor(g.testKey); if(th.length) return th[th.length-1].total; } return g.current!=null?g.current:null; }

function mdToHtml(md){
  const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const out=[]; let inList=false, inCode=false, code=[];
  md.split("\n").forEach(raw=>{
    if(raw.trim().startsWith("```")){ if(inCode){ out.push("<pre>"+esc(code.join("\n"))+"</pre>"); code=[]; inCode=false; } else inCode=true; return; }
    if(inCode){ code.push(raw); return; }
    if(/^\s*[-*]\s+/.test(raw)){ if(!inList){ out.push("<ul>"); inList=true; } out.push("<li>"+inl(raw.replace(/^\s*[-*]\s+/,""))+"</li>"); return; }
    if(/^\s*\d+\.\s+/.test(raw)){ if(!inList){ out.push("<ul>"); inList=true; } out.push("<li>"+inl(raw.replace(/^\s*\d+\.\s+/,""))+"</li>"); return; }
    if(inList){ out.push("</ul>"); inList=false; }
    const hm=raw.match(/^(#{1,4})\s+(.*)/);
    if(hm){ out.push("<h"+hm[1].length+">"+inl(hm[2])+"</h"+hm[1].length+">"); return; }
    if(/^>\s?/.test(raw)){ out.push("<blockquote>"+inl(raw.replace(/^>\s?/,""))+"</blockquote>"); return; }
    if(raw.trim()===""){ return; }
    out.push("<p>"+inl(raw)+"</p>");
  });
  if(inList) out.push("</ul>");
  return out.join("\n");
}

        const mb=x=> x>=104857600 ? (x/1048576).toFixed(0) : (x/1048576).toFixed(1);
        const pct=quota?Math.min(100,Math.max(1,Math.round(used/quota*100))):0;

  const saveCfg=()=>{ const u=normUrl($("#cfgUrl").value); $("#cfgUrl").value=u;
    localStorage.setItem("golfdb_workerUrl",u);

    localStorage.setItem("golfdb_cloudAuto",$("#cfgAuto").checked?"1":"0");
    const st=$("#cloudStatus"); if(st) st.textContent=cloudConfigured()?"✓ konfiguriert":"noch nicht konfiguriert"; };
  $("#cfgUrl").onchange=saveCfg; $("#cfgKey").onchange=saveCfg;
  $("#cfgAuto").onchange=()=>{ saveCfg(); toast($("#cfgAuto").checked?"Auto-Sync an":"Auto-Sync aus"); };
  $("#btnCloudSave").onclick=()=>{ saveCfg(); cloudSave(false); };
  $("#btnCloudLoad").onclick=cloudLoadManual;
  (function(){ const el=$("#backupList"); if(!el) return; const bs=getBackups().slice().reverse();
    if(!bs.length){ el.innerHTML='<div class="r-s">Noch keine Sicherungen vorhanden.</div>'; return; }
    el.innerHTML=bs.map(b=>`<div class="row" style="cursor:default"><div class="grow"><div class="r-t">${new Date(b.ts).toLocaleString('de-DE')}</div><div class="r-s">${esc(b.reason||"")} · ${b.score} gew. Einträge</div></div><button class="btn ghost" style="width:auto;padding:8px 12px" data-ts="${esc(b.ts)}">Wiederherstellen</button></div>`).join("");
    el.querySelectorAll("button[data-ts]").forEach(btn=>btn.onclick=()=>restoreBackup(btn.dataset.ts));
  })();
}
let fileHandle=null;
async function fsSave(){
  try{
    if(!fileHandle){ fileHandle=await window.showSaveFilePicker({suggestedName:"trainingsdaten.json",
      types:[{description:"JSON",accept:{"application/json":[".json"]}}]}); }
    snapshot("Vor Speichern", true);
    DB.exportedAt=new Date().toISOString();
    const w=await fileHandle.createWritable(); await w.write(JSON.stringify(DB,null,1)); await w.close();
    saveLocal(); markSaved();
    toast("In Datei gespeichert");
  }catch(e){ if(e.name!=="AbortError") toast("Speichern abgebrochen"); }
}
async function fsOpen(){
  try{
    const [h]=await window.showOpenFilePicker({types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
    const f=await h.getFile(); const d=JSON.parse(await f.text());
    if(applyLoaded(d,"Datei")) fileHandle=h;
  }catch(e){ if(e.name!=="AbortError") toast("Konnte Datei nicht laden"); }
}
function doExport(){
  DB.exportedAt=new Date().toISOString();
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="trainingsdaten.json"; a.click(); URL.revokeObjectURL(a.href);
  saveLocal(); markSaved(); toast("Datei gesichert");
}
function doImport(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ applyLoaded(JSON.parse(rd.result),"Datei"); }catch(err){ toast("Datei nicht lesbar"); } };
  rd.readAsText(f); e.target.value="";
}

/* ---- test detail + add ---- */
function openTest(key){
  const d=defFor(key); const hist=testsFor(key);
  const lt=hist.length?hist[hist.length-1]:null;
  let h=`<h2>${esc(d.label)}</h2><div class="sub">${esc(d.category)}${d.benchmark?" · Skala "+d.benchmark.unit:""}</div>`;
  if(lt&&d.benchmark){
    h+=`<div style="margin:4px 2px 6px">${lvlChip(lt.total,d)}
      <span class="r-s" style="margin-left:8px">aktuell <b class="tnum">${lt.total}</b></span></div>${ladder(lt.total,d)}`;
  }
  if(d.description&&d.description.trim()){
    h+=`<details class="descbox">
      <summary><span>ℹ️ Testbeschreibung</span><span class="chev-d">▾</span></summary>
      <div class="desc-body">${esc(d.description).replace(/\n/g,"<br>")}</div>
    </details>`;
  }
  h+=`<div style="margin:18px 0 10px" class="eyebrow" >Neuer Eintrag</div>`;
  h+=`<div class="field"><label>Datum</label><input type="date" id="f_date" value="${new Date().toISOString().slice(0,10)}"></div>`;
  h+=`<div class="in-grid">`;
  d.inputs.forEach((inp,i)=>{
    h+=`<div class="field num"><label>${esc(inp.label)}${typeof inp.max==="number"?" /"+inp.max:""}</label>
      <input inputmode="decimal" class="t-in" data-k="${esc(inp.key)}" placeholder="–"></div>`;
  });
  h+=`</div>`;
  h+=`<div class="live"><div><div class="lv-l">Ergebnis</div><div class="lv-n tnum" id="liveTotal">–</div></div>
      <div id="liveChip"></div></div>`;
  h+=`<button class="btn" id="saveTest">Eintrag speichern</button>`;
  if(hist.length){
    h+=`<div class="eyebrow" style="margin-top:22px">Verlauf</div><div class="card">`;
    hist.slice().reverse().forEach((t,i)=>{
      const gi=hist.length-1-i;
      h+=`<div class="hist-row"><span class="d">${fmtDate(t.date)}</span>
        <span>${d.inputs.filter(x=>typeof x.max==="number").map(x=>t.inputs[x.key]!=null?t.inputs[x.key]:"–").join(" · ")}</span>
        <span class="v tnum">${t.total!=null?t.total:"–"}</span>
        <button class="del" data-i="${gi}">Löschen</button></div>`;
    });
    h+=`</div>`;
  }
  openSheet(h);
  const recalc=()=>{
    const inputs={}; document.querySelectorAll(".t-in").forEach(el=>{const v=num(el.value); if(v!=null) inputs[el.dataset.k]=v;});
    const tot=computeTotal(key,d,inputs);
    $("#liveTotal").textContent=tot!=null?tot:"–";
    $("#liveChip").innerHTML=(tot!=null&&d.benchmark)?lvlChip(tot,d):"";
  };
  document.querySelectorAll(".t-in").forEach(el=>el.addEventListener("input",recalc));
  $("#saveTest").onclick=()=>{
    const inputs={}; document.querySelectorAll(".t-in").forEach(el=>{const v=num(el.value); if(v!=null) inputs[el.dataset.k]=v;});
    if(!Object.keys(inputs).length){ toast("Bitte Werte eingeben"); return; }
    const tot=computeTotal(key,d,inputs);
    DB.tests.push({defKey:key,date:$("#f_date").value,inputs,total:tot});
    persist(); closeSheet(); renderAll(); toast("Eintrag gespeichert");
  };
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    const entry=hist[parseInt(b.dataset.i)];
    const gi=DB.tests.indexOf(entry);
    if(gi>=0&&confirm("Diesen Eintrag löschen?")){ DB.tests.splice(gi,1); persist(); closeSheet(); renderAll(); toast("Gelöscht"); }
  });
}

/* ---- add / edit round (hole-by-hole) ---- */
function courseNames(){ return DB.courses.map(c=>c.name); }
function teeNames(course){ const c=DB.courses.find(x=>x.name===course); return c?Object.keys(c.tees):[]; }
function activeHoles(course,tee,side){
  const t=courseTee(course,tee); if(!t) return [];
  return t.holes.filter(h=> side==="Front 9"?h.hole<=9 : side==="Back 9"?h.hole>=10 : true);
}
const ROUND_KINDS=[["18 Loch","18 Loch","18 Loch"],["9 Loch – Front 9","9 Loch","Front 9"],["9 Loch – Back 9","9 Loch","Back 9"]];

function roundDurationMin(s,e){ if(!s||!e) return null;
  const a=s.split(":").map(Number), b=e.split(":").map(Number);
  if(a.length<2||b.length<2||[...a,...b].some(isNaN)) return null;
  let d=(b[0]*60+b[1])-(a[0]*60+a[1]); if(d<0) d+=1440; return d; }
function fmtDur(min){ if(min==null) return "–"; const h=Math.floor(min/60), m=min%60; return h+":"+String(m).padStart(2,"0")+" h"; }

let RTRACK={}, RTRACK_KEEP=false;

  <div class="in-grid">

  </div>
  <div class="r-s" id="r_dur" style="margin:-2px 2px 8px;color:var(--pine-deep);font-weight:600"></div>

  </div>
  ${isDraft?'':`<div class="r-s" id="r_autosave" style="margin:0 2px 8px;color:var(--pine)">✓ Eingaben werden automatisch gesichert</div>`}
  <div class="cad-mode-wrap"><span class="cad-mode-lab">🧭 Caddy-Strategie</span>
    <div class="risk-seg" id="caddyMode">
      <button type="button" data-m="safe">Sicher</button>
      <button type="button" data-m="bal">Ausgewogen</button>
      <button type="button" data-m="aggr">Offensiv</button>
    </div></div>
  <div id="r_holes"></div>
  <button class="btn" id="saveRound" style="margin-top:8px">${ed?"Änderungen speichern":"Runde speichern"}</button>
  ${ed?`<button class="btn warn" id="delRound" style="margin-top:10px">Runde löschen</button>`:""}`;
  openSheet(h);

  const teeSel=$("#r_tee"), courseSel=$("#r_course"), kindSel=$("#r_kind");
  const updDur=()=>{ const d=roundDurationMin($("#r_start").value,$("#r_end").value); $("#r_dur").textContent=d!=null?("Dauer: "+fmtDur(d)):""; };
  $("#r_start").oninput=updDur; $("#r_end").oninput=updDur;
  $("#r_start_now").onclick=()=>{ $("#r_start").value=new Date().toTimeString().slice(0,5); updDur(); };
  $("#r_end_now").onclick=()=>{ $("#r_end").value=new Date().toTimeString().slice(0,5); updDur(); };
  updDur();
  function fillTees(){ teeSel.innerHTML=teeNames(courseSel.value).map(t=>`<option${seed&&seed.tee===t?" selected":""}>${esc(t)}</option>`).join(""); }
  fillTees();
  function existingHole(n){ return seed? (seed.holes||[]).find(x=>x.hole===n) : null; }
  function buildHoles(){
    const [_,type,side]=ROUND_KINDS[+kindSel.value];
    const hs=activeHoles(courseSel.value,teeSel.value,side);
    const cadCtx=caddyContext(), cadMode=caddyMode();
    const apprOpts=DB.approachBuckets.map(b=>`<option value="${b}">${b}</option>`).join("");
    const teeOpts=DB.teeResults.map(t=>`<option value="${t}">${t}</option>`).join("");
    const opt=(arr)=>`<option value="">–</option>`+arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
    const fpOpts=opt(DB.firstPuttDist||[]), qOpts=opt(DB.qualityOpts||[]), clubOpts=opt(DB.teeClubs||[]),
      lieOpts=opt(DB.approachLies||[]), btOpts=opt(DB.bunkerTypes||[]), ptOpts=opt(DB.penaltyTypes||[]), jn=opt(["Ja","Nein"]);
    const fS="margin:0";
    $("#r_holes").innerHTML=hs.map(hd=>{
      const ex=existingHole(hd.hole)||{};
      return `<div class="hcard" data-hole="${hd.hole}" style="border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px">

        </div>

        <button type="button" class="shot-trk-b" onclick="window.__openShotTrack(${hd.hole})">🎯 Schläge tracken${shotCount(RTRACK[hd.hole])?` (${shotCount(RTRACK[hd.hole])})`:""}</button>
